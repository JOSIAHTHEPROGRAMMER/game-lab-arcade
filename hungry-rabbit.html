/* ---------- vision ---------- */
function visionRange(e){
  var base = STATS[e.team].sight;
  if (e.team === 'scientist' && e.buffT > 0) base *= 1.45;
  return base;
}
function canSee(obs, tgt){
  if (obs.f !== tgt.f) return false;
  if (obs.mode === 'vent' || obs.mode === 'elev' || tgt.mode === 'vent' || tgt.mode === 'elev') return false;
  if (tgt.state !== 'active') return false;
  var d = dist(obs.x, obs.y, tgt.x, tgt.y);
  var range = visionRange(obs);
  if (d > range) return false;
  if (tgt.mode === 'hide' && tgt.revealT <= 0){
    if (!(obs.team === 'rabbit' && d < 22)) return false;
  }
  if (!hasLOS(obs.f, obs.x, obs.y, tgt.x, tgt.y)) return false;
  if (obs.team === 'scientist'){
    if (d < 46) return true;
    var half = (obs.buffT > 0 ? 0.62 : 0.5);
    return Math.abs(angDiff(Math.atan2(tgt.y - obs.y, tgt.x - obs.x), obs.ang)) < half;
  }
  return true;
}

/* ---------- damage / death ---------- */
function damage(e, amt, src, kind){
  if (e.state !== 'active') return;
  if (e.mode === 'vent' || e.mode === 'elev') return;   /* untouchable in transit */
  /* acid ticks every frame: give the feedback once per hit-flash, not 60x a second,
     or one puddle costs ~900 audio nodes and 1800 particles */
  var loud = e.hurtT <= 0;
  e.hp -= amt;
  e.hurtT = 0.25;
  e.lastHitBy = src ? src.id : -1;
  if (e.mode === 'nap'){ e.mode = 'normal'; e.stam = e.maxStam * 0.4; SFX.wake(); }
  if (e.mode === 'hide'){ e.mode = 'normal'; }
  if (loud){
    burst(e.f, e.x, e.y, e.team === 'rabbit' ? 6 : 8, e.team === 'rabbit' ? '#9fe0b0' : '#8e1620', 55, 0.4, 1);
    if (e.team === 'scientist') bloodDecal(e.f, e.x, e.y, 3);
    if (e === player || (spectate === e)) camShake = Math.max(camShake, 4);
  }
  if (e.hp <= 0) killEnt(e, src, kind);
  else if (loud && e.f === camFloor) SFX.hurt();
}

function killEnt(e, src, kind){
  if (e.state !== 'active') return;
  if (e.team === 'rabbit'){
    /* neutralised: waits out the round, out of play but still there */
    e.state = 'down';
    e.mode = 'normal';
    if (!e.temp) score.rn++;
    burst(e.f, e.x, e.y, 16, '#7fe0b8', 70, 0.6, 2);
    SFX.down();
    msg(e.isPlayer ? 'YOU WERE NEUTRALISED - SPECTATING' : 'RABBIT NEUTRALISED', '#8fe8c4', e.isPlayer);
  } else {
    e.state = 'dead';
    e.mode = 'normal';
    if (!e.temp) score.sd++;
    bloodDecal(e.f, e.x, e.y, 14);
    corpses.push({ f:e.f, x:e.x, y:e.y, fed:false, t:0 });
    if (corpses.length > 14) corpses.shift();
    burst(e.f, e.x, e.y, 18, '#8e1620', 80, 0.7, 2);
    SFX.bite();
    msg(e.isPlayer ? 'YOU WERE KILLED - SPECTATING' : 'SCIENTIST DOWN', '#e05a52', e.isPlayer);
  }
  emitNoise(e.f, e.x, e.y, 220, 'death');
  if (e.isPlayer) startSpectate();
  checkEnd();
}

function startSpectate(){
  var team = playerTeam;
  var cand = null, i;
  for (i = 0; i < ents.length; i++){
    var e = ents[i];
    if (e.team === team && e.state === 'active' && !e.temp){ cand = e; break; }
  }
  if (!cand) for (i = 0; i < ents.length; i++) if (ents[i].state === 'active'){ cand = ents[i]; break; }
  spectate = cand;
}

/* ============================================================
   ACTIONS
   ============================================================ */
var CLAW_RANGE = 22, CLAW_DMG = 38, BITE_THRESHOLD = 40;
var VIAL_DMG = 38, VIAL_SPLASH = 24, ACID_DPS = 16;
var CLONE_TIME = 10, BACKUP_TIME = 15, CLONE_CD = 30, BACKUP_CD = 35;

function canAct(e){
  return e.state === 'active' && e.mode !== 'nap' && e.mode !== 'vent' && e.mode !== 'elev' && e.mode !== 'feed';
}

function rabbitAttack(e){
  if (!canAct(e) || e.atkCd > 0) return false;
  var weak = e.stam < 8;
  e.atkCd = weak ? 0.95 : 0.55;
  e.stam = Math.max(0, e.stam - 8);
  if (weak && e.isPlayer) msg('TOO TIRED - WEAK SWIPE', '#e0a020');
  if (e.mode === 'hide') e.mode = 'normal';
  SFX.claw();
  emitNoise(e.f, e.x, e.y, 120, 'attack', e.team);
  /* short lunge */
  moveEnt(e, Math.cos(e.ang) * 5, Math.sin(e.ang) * 5);
  var hitAny = false, i;
  for (i = 0; i < ents.length; i++){
    var t = ents[i];
    if (t.team !== 'scientist' || t.state !== 'active') continue;
    if (t.f !== e.f || t.mode === 'vent' || t.mode === 'elev') continue;
    var d = dist(e.x, e.y, t.x, t.y);
    if (d > CLAW_RANGE + 6) continue;
    if (Math.abs(angDiff(Math.atan2(t.y - e.y, t.x - e.x), e.ang)) > 1.0) continue;
    var finisher = t.hp <= BITE_THRESHOLD && !weak;
    damage(t, finisher ? 999 : (weak ? CLAW_DMG * 0.55 : CLAW_DMG), e, finisher ? 'bite' : 'claw');
    if (finisher) SFX.bite();
    hitAny = true;
  }
  /* claws also tear barricades apart */
  for (i = 0; i < barricades.length; i++){
    var b = barricades[i];
    if (b.f !== e.f || b.hp <= 0) continue;
    if (dist(e.x, e.y, b.px, b.py) < CLAW_RANGE + 10){
      b.hp -= weak ? 18 : 34; hitAny = true;
      burst(e.f, b.px, b.py, 6, '#7a6a44', 50, 0.4, 1);
      if (b.hp <= 0) removeBarricade(b);
    }
  }
  if (!hitAny) burst(e.f, e.x + Math.cos(e.ang) * 12, e.y + Math.sin(e.ang) * 12, 3, '#6a6a72', 30, 0.25, 1);
  return true;
}

function invCount(e, kind){
  var n = 0;
  for (var i = 0; i < e.inv.length; i++) if (e.inv[i] === kind) n++;
  return n;
}
function invTake(e, kind){
  for (var i = 0; i < e.inv.length; i++) if (e.inv[i] === kind){ e.inv.splice(i, 1); return true; }
  return false;
}

function throwVial(e){
  if (!canAct(e) || e.atkCd > 0) return false;
  if (!invCount(e, 'vial')){ if (e.isPlayer) msg('NO CHEMICALS - FIND A RESTOCK STATION', '#e0a020'); return false; }
  invTake(e, 'vial');
  e.atkCd = e.isPlayer ? 0.7 : 0.95;
  if (e.mode === 'hide') e.mode = 'normal';
  SFX.throwv();
  emitNoise(e.f, e.x, e.y, 70, 'throw', e.team);
  for (var i = 0; i < JMAX; i++){
    var p = projectiles[i];
    if (p.on) continue;
    p.on = true; p.f = e.f; p.x = e.x; p.y = e.y - 4;
    p.vx = Math.cos(e.ang) * 190; p.vy = Math.sin(e.ang) * 190;
    p.life = 0.85; p.owner = e.id;
    break;
  }
  return true;
}

function smashVial(p){
  p.on = false;
  SFX.smash();
  emitNoise(p.f, p.x, p.y, 190, 'smash');
  burst(p.f, p.x, p.y, 12, '#8ff0c0', 70, 0.5, 1);
  acids.push({ f:p.f, x:p.x, y:p.y, t:3.0, r:VIAL_SPLASH });
  if (acids.length > 10) acids.shift();
  for (var i = 0; i < ents.length; i++){
    var e = ents[i];
    if (e.team !== 'rabbit' || e.state !== 'active') continue;
    if (e.f !== p.f) continue;
    if (dist(e.x, e.y, p.x, p.y) < VIAL_SPLASH) damage(e, VIAL_DMG, null, 'chem');
  }
}

function updateProjectiles(dt){
  var i, p;
  for (i = 0; i < JMAX; i++){
    p = projectiles[i];
    if (!p.on) continue;
    p.life -= dt;
    var nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
    if (collides(p.f, nx, ny, 2) || p.life <= 0){ p.x = nx; p.y = ny; smashVial(p); continue; }
    p.x = nx; p.y = ny;
    if (Math.random() < 0.4) spawnP(p.f, p.x, p.y, 0, 0, 0.25, 'rgba(140,240,200,0.6)', 1, 0);
    for (var k = 0; k < ents.length; k++){
      var e = ents[k];
      if (e.team !== 'rabbit' || e.state !== 'active' || e.f !== p.f) continue;
      if (e.mode === 'vent' || e.mode === 'elev') continue;
      if (dist(e.x, e.y, p.x, p.y) < 9){ smashVial(p); break; }
    }
  }
  for (i = acids.length - 1; i >= 0; i--){
    var a = acids[i];
    a.t -= dt;
    if (a.t <= 0){ acids.splice(i, 1); continue; }
    if (Math.random() < 0.25) spawnP(a.f, a.x + rnd(-a.r * 0.6, a.r * 0.6), a.y + rnd(-a.r * 0.4, a.r * 0.4), 0, -8, 0.5, 'rgba(150,240,190,0.5)', 1, 0);
    for (var j = 0; j < ents.length; j++){
      var t = ents[j];
      if (t.team !== 'rabbit' || t.state !== 'active' || t.f !== a.f) continue;
      if (dist(t.x, t.y, a.x, a.y) < a.r) damage(t, ACID_DPS * dt, null, 'acid');
    }
  }
}

/* ---------- items ---------- */
function useItem(e){
  if (!canAct(e)) return false;
  if (e.team === 'scientist'){
    if (invTake(e, 'drink')){
      e.stam = e.maxStam;
      e.buffT = 12;
      SFX.drink();
      burst(e.f, e.x, e.y, 8, '#ffd060', 40, 0.5, 1);
      if (e.isPlayer) msg('ENERGY DRINK - FASTER AND MORE ALERT (12s)', '#ffd060');
      return true;
    }
    if (e.isPlayer) msg('NO ENERGY DRINK', '#e0a020');
  } else {
    if (invTake(e, 'serum')){
      e.hp = Math.min(e.maxHp, e.hp + 45);
      SFX.drink();
      burst(e.f, e.x, e.y, 8, '#ff6070', 40, 0.5, 1);
      if (e.isPlayer) msg('SERUM - WOUNDS CLOSE', '#ff6070');
      return true;
    }
    if (e.isPlayer) msg('NO SERUM', '#e0a020');
  }
  return false;
}

function stationAt(f, x, y){
  var st = FLOORS[f].stations;
  for (var i = 0; i < st.length; i++)
    if (dist(x, y, st[i].px, st[i].py) < 22) return st[i];
  return null;
}
function restock(e, s){
  if (!s.on || s.stock <= 0){ if (e.isPlayer) msg('STATION IS DEAD', '#8a8f98'); return false; }
  if (e.inv.length >= 3){ if (e.isPlayer) msg('INVENTORY FULL', '#e0a020'); return false; }
  var added = 0;
  while (e.inv.length < 3 && s.stock > 0 && added < 2){
    if (e.team === 'scientist') e.inv.push(invCount(e, 'vial') < 2 ? 'vial' : 'drink');
    else e.inv.push('serum');
    s.stock--; added++;
  }
  SFX.ui();
  emitNoise(e.f, e.x, e.y, 60, 'restock', e.team);
  if (e.isPlayer) msg('RESTOCKED x' + added + '  (station ' + s.stock + ' left)', '#8fe8c4');
  return added > 0;
}

/* ---------- hiding ---------- */
function hideSpotAt(f, x, y){
  var hs = FLOORS[f].hides;
  for (var i = 0; i < hs.length; i++)
    if (dist(x, y, hs[i].px, hs[i].py) < 16) return hs[i];
  return null;
}
function tryHide(e){
  if (e.mode === 'hide'){ e.mode = 'normal'; if (e.isPlayer) msg('OUT OF COVER', '#b8bec8'); return true; }
  var hs = hideSpotAt(e.f, e.x, e.y);
  if (!hs) return false;
  /* hiding while an enemy watches must not work */
  var foe = e.team === 'rabbit' ? 'scientist' : 'rabbit';
  for (var i = 0; i < ents.length; i++){
    var o = ents[i];
    if (o.team !== foe || o.state !== 'active') continue;
    if (canSee(o, e) && dist(o.x, o.y, e.x, e.y) < 150){
      e.spotT = 1.4;
      if (e.isPlayer) msg('THEY SAW YOU GET IN', '#e05a52');
      o.ai.seenX = e.x; o.ai.seenY = e.y; o.ai.seenF = e.f; o.ai.seenT = 4;
      return false;
    }
  }
  e.x = hs.px; e.y = hs.py;
  e.mode = 'hide';
  e.running = false;
  SFX.step(0.6);
  if (e.isPlayer) msg('HIDDEN - MOVE OR PRESS E TO LEAVE', '#8fb8e0');
  return true;
}

/* ---------- vents ---------- */
function ventAt(f, x, y){
  var vs = FLOORS[f].vents;
  for (var i = 0; i < vs.length; i++){
    var v = VENTS[vs[i]];
    if (dist(x, y, v.px, v.py) < 15) return vs[i];
  }
  return -1;
}
function chooseVentLink(e, vi){
  var v = VENTS[vi];
  var best = v.links[0], bestScore = -1e9;
  for (var i = 0; i < v.links.length; i++){
    var d = VENTS[v.links[i]];
    var sc = 0;
    var foe = e.team === 'rabbit' ? 'scientist' : 'rabbit';
    var nearest = 1e9;
    for (var k = 0; k < ents.length; k++){
      var o = ents[k];
      if (o.team !== foe || o.state !== 'active') continue;
      var dd = (o.f === d.f) ? dist(o.x, o.y, d.px, d.py) : 900;
      if (dd < nearest) nearest = dd;
    }
    sc = (e.team === 'rabbit') ? -nearest : nearest;
    if (e.ai.transit && e.ai.transit.floor === d.f) sc += 500;
    if (sc > bestScore){ bestScore = sc; best = v.links[i]; }
  }
  return best;
}
function enterVent(e, vi, forced){
  if (e.mode === 'vent') return false;
  var to = (typeof forced === 'number') ? forced : chooseVentLink(e, vi);
  e.mode = 'vent'; e.modeT = 1.5; e.ventFrom = vi; e.ventTo = to;
  SFX.vent();
  emitNoise(e.f, e.x, e.y, 80, 'vent', e.team);
  if (e.isPlayer) msg('IN THE VENTS -> ' + roomNameAt(VENTS[to].f, VENTS[to].tx, VENTS[to].ty) + ' / ' + floorLabel(VENTS[to].f), '#8fb8e0');
  return true;
}
function ventTravelDesc(e, vi){
  var to = chooseVentLink(e, vi);
  var v = VENTS[to];
  return roomNameAt(v.f, v.tx, v.ty) + ' / ' + floorLabel(v.f);
}

/* ---------- elevators ---------- */
function shaftAt(f, x, y){
  for (var s = 0; s < SHAFTS.length; s++){
    var sh = SHAFTS[s];
    var cx = (sh.x0 + sh.x1 + 1) / 2 * TILE, cy = (sh.y0 + sh.y1 + 1) / 2 * TILE;
    if (Math.abs(x - cx) < TILE + 4 && Math.abs(y - cy) < TILE + 4) return s;
  }
  return -1;
}
function shaftCenter(s){
  var sh = SHAFTS[s];
  return { x:(sh.x0 + sh.x1 + 1) / 2 * TILE, y:(sh.y0 + sh.y1 + 1) / 2 * TILE };
}
function elevatorInteract(e, s, wantFloor){
  var sh = SHAFTS[s];
  if (sh.state !== 'idle'){ if (e.isPlayer) msg('LIFT IS MOVING', '#8a8f98'); return false; }
  if (sh.at !== e.f){
    sh.state = 'calling'; sh.dest = e.f; sh.t = 1.2;
    SFX.ding();
    if (e.isPlayer) msg('CALLING ' + sh.name + '...', '#8fb8e0');
    return true;
  }
  var dest = wantFloor;
  if (typeof dest !== 'number' || dest === e.f || dest < 0 || dest >= NFLOORS){
    dest = (e.f + 1) % NFLOORS;
  }
  /* everyone standing in the car rides along */
  sh.riders.length = 0;
  for (var i = 0; i < ents.length; i++){
    var o = ents[i];
    if (o.state !== 'active' || o.f !== e.f) continue;
    if (o.mode === 'vent' || o.mode === 'elev') continue;
    if (shaftAt(o.f, o.x, o.y) === s){
      o.mode = 'elev'; o.shaft = s; o.modeT = 1.6;
      sh.riders.push(o.id);
    }
  }
  sh.state = 'moving'; sh.dest = dest; sh.t = 1.6;
  SFX.ding();
  emitNoise(e.f, e.x, e.y, 150, 'lift');
  if (e.isPlayer) msg(sh.name + ' -> ' + floorLabel(dest), '#8fb8e0');
  return true;
}
function updateShafts(dt){
  for (var s = 0; s < SHAFTS.length; s++){
    var sh = SHAFTS[s];
    if (sh.state === 'idle') continue;
    sh.t -= dt;
    if (sh.t > 0) continue;
    if (sh.state === 'calling'){ sh.at = sh.dest; sh.state = 'idle'; SFX.ding(); continue; }
    /* arrive */
    sh.at = sh.dest; sh.state = 'idle';
    var c = shaftCenter(s);
    for (var i = 0; i < sh.riders.length; i++){
      var e = entById(sh.riders[i]);
      if (!e) continue;
      e.f = sh.at; e.mode = 'normal'; e.shaft = -1; e.modeT = 0;
      e.x = c.x + rnd(-6, 6); e.y = c.y + rnd(-6, 6);
      unstick(e);
      e.ai.path.length = 0; e.ai.pi = 0;
      if (e.isPlayer || e === spectate) camFloor = e.f;
    }
    sh.riders.length = 0;
    SFX.ding();
    emitNoise(sh.at, c.x, c.y, 130, 'lift');
  }
}
function entById(id){
  for (var i = 0; i < ents.length; i++) if (ents[i].id === id) return ents[i];
  return null;
}

/* ---------- barricades ---------- */
function doorAt(f, x, y){
  var ds = FLOORS[f].doors;
  for (var i = 0; i < ds.length; i++){
    var d = ds[i];
    var cx = (d.x + 1) * TILE, cy = d.y * TILE + 8;
    if (Math.abs(x - cx) < 20 && Math.abs(y - cy) < 16) return d;
  }
  return null;
}
function barricadeCountOn(f){
  var n = 0;
  for (var i = 0; i < barricades.length; i++) if (barricades[i].f === f && barricades[i].hp > 0) n++;
  return n;
}
function placeBarricade(e, d){
  if (barricadeCountOn(e.f) >= 2) { if (e.isPlayer) msg('NO MATERIAL LEFT ON THIS FLOOR', '#e0a020'); return false; }
  for (var i = 0; i < barricades.length; i++)
    if (barricades[i].f === e.f && barricades[i].x === d.x && barricades[i].y === d.y) return false;
  var tiles = FLOORS[e.f].tiles;
  tiles[idx(d.x, d.y)] = T_BARR;
  tiles[idx(d.x + 1, d.y)] = T_BARR;
  barricades.push({ f:e.f, x:d.x, y:d.y, px:(d.x + 1) * TILE, py:d.y * TILE + 8, hp:70 });
  e.barrCd = 20;
  SFX.thump(0.7);
  emitNoise(e.f, e.x, e.y, 130, 'barricade', e.team);
  if (e.isPlayer) msg('DOOR BARRICADED', '#c8a060');
  return true;
}
function removeBarricade(b){
  var tiles = FLOORS[b.f].tiles;
  if (tiles[idx(b.x, b.y)] === T_BARR) tiles[idx(b.x, b.y)] = T_DOOR;
  if (tiles[idx(b.x + 1, b.y)] === T_BARR) tiles[idx(b.x + 1, b.y)] = T_DOOR;
  b.hp = 0;
  SFX.smash();
  msg('BARRICADE TORN APART', '#e05a52');
}

/* ---------- team abilities ---------- */
function teamAbility(e){
  if (!canAct(e) || e.abilCd > 0) return false;
  if (e.temp) return false;
  if (e.team === 'rabbit'){
    e.abilCd = CLONE_CD;
    for (var i = 0; i < 2; i++){
      var c = mkEnt('rabbit', e.f, e.x + rnd(-14, 14), e.y + rnd(-14, 14), { temp:true, life:CLONE_TIME });
      c.hp = 60; c.maxHp = 60;
      unstick(c);
      c.ai.st = 'hunt';
      ents.push(c);
    }
    SFX.spawn(); SFX.screech();
    burst(e.f, e.x, e.y, 20, '#8f7fd0', 70, 0.6, 2);
    msg((e.isPlayer ? 'YOU SPLIT - ' : 'A RABBIT SPLITS - ') + 'CLONES FOR ' + CLONE_TIME + 's', '#b9a8ff', e.isPlayer);
  } else {
    e.abilCd = BACKUP_CD;
    var s = 0, best = 1e9;
    for (var k = 0; k < SHAFTS.length; k++){
      var c2 = shaftCenter(k), d = dist(e.x, e.y, c2.x, c2.y);
      if (d < best){ best = d; s = k; }
    }
    var cc = shaftCenter(s);
    for (var j = 0; j < 2; j++){
      var b = mkEnt('scientist', e.f, cc.x + rnd(-10, 10), cc.y + rnd(-10, 10), { temp:true, life:BACKUP_TIME });
      b.inv.push('vial'); b.inv.push('vial'); b.inv.push('drink');
      unstick(b);
      ents.push(b);
    }
    SFX.ding(); SFX.alarm();
    msg((e.isPlayer ? 'YOU CALL BACKUP - ' : 'BACKUP CALLED - ') + BACKUP_TIME + 's', '#8fd0ff', e.isPlayer);
    emitNoise(e.f, e.x, e.y, 240, 'backup', e.team);
  }
  return true;
}

/* ---------- power nap / feeding ---------- */
function startNap(e){
  if (!canAct(e) || e.team !== 'rabbit') return false;
  if (e.stam > e.maxStam - 5){ if (e.isPlayer) msg('NOT TIRED', '#8a8f98'); return false; }
  e.mode = 'nap'; e.modeT = 10;
  SFX.nap();
  if (e.isPlayer) msg('POWER NAP - 10s, HELPLESS, FULL ENERGY ON WAKING', '#b9a8ff');
  return true;
}
function corpseAt(f, x, y){
  for (var i = 0; i < corpses.length; i++){
    var c = corpses[i];
    if (c.f === f && !c.fed && dist(x, y, c.x, c.y) < 18) return c;
  }
  return null;
}
function startFeed(e, c){
  e.mode = 'feed'; e.modeT = 2.0; e.feedT = 0; e.ai.transit = null;
  c.fed = true;
  SFX.bite();
  emitNoise(e.f, e.x, e.y, 110, 'feed', e.team);
  if (e.isPlayer) msg('FEEDING...', '#e05a52');
  return true;
}

/* ============================================================
   ENTITY UPDATE
   ============================================================ */
function speedOf(e){
  var st = STATS[e.team];
  var sp = e.running ? st.run : st.walk;
  if (e.team === 'scientist' && e.buffT > 0) sp *= 1.30;
  if (e.mode === 'hide') sp = 0;
  sp *= (1 + (e.team === 'rabbit' ? 0.30 : 0.14) * intensity);
  if (e.temp) sp *= 1.05;
  return sp;
}

function updateEnt(e, dt){
  if (e.state !== 'active'){
    if (e.state === 'down'){ e.animT += dt; }
    return;
  }
  if (e.temp){
    e.life -= dt;
    if (e.life <= 0){
      e.state = 'gone';
      burst(e.f, e.x, e.y, 12, e.team === 'rabbit' ? '#8f7fd0' : '#8fd0ff', 50, 0.5, 1);
      checkEnd();
      return;
    }
  }
  e.atkCd = Math.max(0, e.atkCd - dt);
  e.abilCd = Math.max(0, e.abilCd - dt);
  e.buffT = Math.max(0, e.buffT - dt);
  e.hurtT = Math.max(0, e.hurtT - dt);
  e.revealT = Math.max(0, e.revealT - dt);
  e.spotT = Math.max(0, e.spotT - dt);
  e.barrCd = Math.max(0, e.barrCd - dt);

  /* transit modes */
  if (e.mode === 'vent'){
    e.modeT -= dt;
    if (e.modeT <= 0){
      var v = VENTS[e.ventTo];
      e.f = v.f; e.x = v.px; e.y = v.py;
      e.mode = 'normal';
      e.ai.path.length = 0; e.ai.pi = 0;
      unstick(e);
      SFX.vent();
      emitNoise(e.f, e.x, e.y, 70, 'vent', e.team);
      if (e.isPlayer || e === spectate) camFloor = e.f;
    }
    return;
  }
  if (e.mode === 'elev'){ return; }   /* shaft update moves them */
  if (e.mode === 'nap'){
    e.modeT -= dt;
    if (Math.random() < 0.05) spawnP(e.f, e.x + rnd(-4, 4), e.y - 10, 0, -12, 0.8, 'rgba(180,170,220,0.5)', 1, 0);
    if (e.modeT <= 0){
      e.mode = 'normal';
      e.stam = e.maxStam;               /* instant energy on waking */
      e.hp = Math.min(e.maxHp, e.hp + 12);
      SFX.wake();
      if (e.isPlayer) msg('AWAKE - FULL ENERGY', '#8fe8c4');
    }
    return;
  }
  if (e.mode === 'feed'){
    e.modeT -= dt;
    if (Math.random() < 0.3) spawnP(e.f, e.x + rnd(-6, 6), e.y + rnd(-4, 4), 0, -10, 0.4, 'rgba(140,20,26,0.7)', 1, 0);
    if (e.modeT <= 0){
      e.mode = 'normal';
      e.hp = Math.min(e.maxHp, e.hp + 30);
      e.stam = Math.min(e.maxStam, e.stam + 35);
      if (e.isPlayer) msg('FED - STRENGTH RETURNS', '#e05a52');
    }
    return;
  }

  if (e.isPlayer) playerControl(e, dt);
  else aiControl(e, dt);

  /* stamina */
  var st = STATS[e.team];
  if (e.running && e.moving){
    e.stam -= st.drain * dt;
    if (e.stam <= 0){ e.stam = 0; e.running = false; }
  } else {
    var reg = st.regen * (e.mode === 'hide' ? 1.6 : 1) * (e.buffT > 0 ? 1.5 : 1);
    e.stam = Math.min(e.maxStam, e.stam + reg * dt);
  }

  /* footstep noise + animation */
  if (e.moving && e.mode !== 'hide'){
    e.animT += dt * (e.running ? 12 : 7);
    e.anim = e.animT | 0;
    e.stepT -= dt;
    if (e.stepT <= 0){
      e.stepT = e.running ? 0.30 : 0.60;
      emitNoise(e.f, e.x, e.y, e.running ? 135 : 50, 'step', e.team);
      if (e.f === camFloor){
        var pd = playerEye();
        if (pd && dist(pd.x, pd.y, e.x, e.y) < 190) SFX.step(e.running ? 1 : 0.55);
      }
    }
  } else {
    e.anim = 0;
  }
  unstick(e);
}

function playerEye(){
  var pe = (player && player.state === 'active') ? player : spectate;
  if (pe && pe.f === camFloor) return pe;
  return null;
}

/* ============================================================
   PLAYER CONTROL
   ============================================================ */
var promptText = '', promptAction = null;

function playerControl(e, dt){
  var dx = 0, dy = 0;
  if (keys.ArrowLeft) dx -= 1;
  if (keys.ArrowRight) dx += 1;
  if (keys.ArrowUp) dy -= 1;
  if (keys.ArrowDown) dy += 1;

  if ((dx || dy) && e.mode === 'hide'){ e.mode = 'normal'; msg('OUT OF COVER', '#b8bec8'); }

  e.running = (keys.ShiftLeft || keys.ShiftRight) && e.stam > 1 && (dx !== 0 || dy !== 0);
  e.moving = (dx !== 0 || dy !== 0) && e.mode !== 'hide';

  if (e.moving){
    var l = Math.sqrt(dx * dx + dy * dy);
    dx /= l; dy /= l;
    setDirFromVec(e, dx, dy);
    var sp = speedOf(e);
    e.vx = dx * sp; e.vy = dy * sp;
    moveEnt(e, dx * sp * dt, dy * sp * dt);
  } else { e.vx = 0; e.vy = 0; }

  /* context prompt */
  promptText = ''; promptAction = null;
  var s = stationAt(e.f, e.x, e.y);
  var vi = ventAt(e.f, e.x, e.y);
  var shi = shaftAt(e.f, e.x, e.y);
  var hs = hideSpotAt(e.f, e.x, e.y);
  var dr = doorAt(e.f, e.x, e.y);
  var cp = (e.team === 'rabbit') ? corpseAt(e.f, e.x, e.y) : null;
  if (e.mode === 'hide'){ promptText = 'E - LEAVE COVER'; promptAction = 'hide'; }
  else if (s){ promptText = s.on && s.stock > 0 ? 'E - RESTOCK (' + s.stock + ' left)' : 'E - STATION OFFLINE'; promptAction = 'station'; }
  else if (vi >= 0){ promptText = 'E - ENTER VENT -> ' + ventTravelDesc(e, vi); promptAction = 'vent'; }
  else if (shi >= 0){
    var sh = SHAFTS[shi];
    promptText = sh.state !== 'idle' ? sh.name + ' MOVING...' :
      (sh.at !== e.f ? 'E - CALL ' + sh.name : 'E - RIDE ' + sh.name + '  (HOLD UP/DOWN TO PICK FLOOR)');
    promptAction = 'elev';
  }
  else if (cp){ promptText = 'E - FEED'; promptAction = 'feed'; }
  else if (hs){ promptText = 'E - HIDE'; promptAction = 'hide'; }
  else if (dr && e.team === 'scientist' && e.barrCd <= 0){ promptText = 'E - BARRICADE DOOR'; promptAction = 'barricade'; }

  if (hit('KeyE')){
    if (promptAction === 'station') restock(e, s);
    else if (promptAction === 'vent') enterVent(e, vi);
    else if (promptAction === 'elev'){
      var want = -1;
      if (keys.ArrowUp) want = e.f + 1;
      else if (keys.ArrowDown) want = e.f - 1;
      if (want < 0 || want >= NFLOORS) want = -1;
      elevatorInteract(e, shi, want >= 0 ? want : undefined);
    }
    else if (promptAction === 'feed') startFeed(e, cp);
    else if (promptAction === 'hide'){ if (!tryHide(e)) msg('NOTHING TO HIDE IN', '#8a8f98'); }
    else if (promptAction === 'barricade') placeBarricade(e, dr);
    else msg('NOTHING HERE', '#8a8f98');
  }
  if (hit('Space')){
    if (e.team === 'rabbit') rabbitAttack(e);
    else throwVial(e);
  }
  if (hit('KeyF')) useItem(e);
  if (hit('KeyQ')){
    if (e.abilCd > 0) msg((e.team === 'rabbit' ? 'CLONE' : 'BACKUP') + ' READY IN ' + Math.ceil(e.abilCd) + 's', '#e0a020');
    else teamAbility(e);
  }
  if (hit('KeyR')){
    if (e.team === 'rabbit') startNap(e);
    else msg('SCIENTISTS DO NOT NAP - USE F FOR AN ENERGY DRINK', '#8a8f98');
  }
}

/* ============================================================
   AI
   ============================================================ */
function nearestVisibleFoe(e){
  var foe = e.team === 'rabbit' ? 'scientist' : 'rabbit';
  var best = null, bd = 1e9;
  for (var i = 0; i < ents.length; i++){
    var o = ents[i];
    if (o.team !== foe || o.state !== 'active') continue;
    if (o.f !== e.f) continue;
    if (!canSee(e, o)) continue;
    var d = dist2(e.x, e.y, o.x, o.y);
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}
function nearestFoeAnywhere(e){
  var foe = e.team === 'rabbit' ? 'scientist' : 'rabbit';
  var best = null, bd = 1e9;
  for (var i = 0; i < ents.length; i++){
    var o = ents[i];
    if (o.team !== foe || o.state !== 'active' || o.temp) continue;
    var d = (o.f === e.f) ? dist(e.x, e.y, o.x, o.y) : 1200 + Math.abs(o.f - e.f) * 100;
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}
function nearestAlly(e){
  var best = null, bd = 1e9;
  for (var i = 0; i < ents.length; i++){
    var o = ents[i];
    if (o === e || o.team !== e.team || o.state !== 'active' || o.f !== e.f) continue;
    var d = dist2(e.x, e.y, o.x, o.y);
    if (d < bd){ bd = d; best = o; }
  }
  return best;
}
function heardNoise(e){
  var best = null, bd = 1e9;
  for (var i = 0; i < noises.length; i++){
    var n = noises[i];
    if (n.f !== e.f || n.t > 2.0) continue;
    if (n.team === e.team) continue;
    var d = dist(e.x, e.y, n.x, n.y);
    if (d > n.r) continue;
    if (d < bd){ bd = d; best = n; }
  }
  return best;
}

function repath(e, tx, ty){
  var r = findPath(e.f, (e.x / TILE) | 0, (e.y / TILE) | 0, tx, ty, e.ai.path);
  e.ai.pi = 0;
  e.ai.pathT = r ? rnd(0.5, 0.9) : 0.35;
  if (!r) e.ai.path.length = 0;
  return !!r;
}
function pathGoalTile(e){
  if (!e.ai.path.length) return null;
  var n = e.ai.path[e.ai.path.length - 1];
  return { x:n % GW, y:(n / GW) | 0 };
}

function followPath(e, dt, run){
  if (!e.ai.path.length || e.ai.pi >= e.ai.path.length){ e.moving = false; e.running = false; e.vx = 0; e.vy = 0; return false; }
  var n = e.ai.path[e.ai.pi];
  var tx = (n % GW) * TILE + 8, ty = ((n / GW) | 0) * TILE + 8;
  var dx = tx - e.x, dy = ty - e.y;
  var d = Math.sqrt(dx * dx + dy * dy);
  if (d < 5){ e.ai.pi++; return true; }
  dx /= d; dy /= d;
  e.running = !!run && e.stam > 3;
  e.moving = true;
  setDirFromVec(e, dx, dy);
  var sp = speedOf(e);
  e.vx = dx * sp; e.vy = dy * sp;
  var bx = e.x, by = e.y;
  moveEnt(e, dx * sp * dt, dy * sp * dt);
  if (Math.abs(e.x - bx) < 0.01 && Math.abs(e.y - by) < 0.01){
    e.ai.pathT = 0;                    /* wedged: repath next think */
    moveEnt(e, rnd(-1, 1) * sp * dt, rnd(-1, 1) * sp * dt);
  }
  return true;
}

function planTransit(e, targetFloor){
  if (targetFloor === e.f){ e.ai.transit = null; return; }
  var tr0 = e.ai.transit;
  if (tr0 && tr0.floor === targetFloor && e.ai.path.length && e.ai.pi < e.ai.path.length) return;
  var i;
  if (e.team === 'rabbit'){
    var vs = FLOORS[e.f].vents, bestV = -1, bestLink = -1, bd = 1e9;
    for (i = 0; i < vs.length; i++){
      var v = VENTS[vs[i]];
      for (var k = 0; k < v.links.length; k++){
        var dst = VENTS[v.links[k]];
        if (dst.f !== targetFloor) continue;
        var d = dist(e.x, e.y, v.px, v.py);
        if (d < bd){ bd = d; bestV = vs[i]; bestLink = v.links[k]; }
      }
    }
    if (bestV >= 0){
      e.ai.transit = { type:'vent', vi:bestV, link:bestLink, floor:targetFloor };
      repath(e, VENTS[bestV].tx, VENTS[bestV].ty);
      return;
    }
  }
  var bs = 0, bsd = 1e9;
  for (i = 0; i < SHAFTS.length; i++){
    var c = shaftCenter(i), dd = dist(e.x, e.y, c.x, c.y);
    if (dd < bsd){ bsd = dd; bs = i; }
  }
  e.ai.transit = { type:'elev', s:bs, floor:targetFloor };
  var sh = SHAFTS[bs];
  repath(e, sh.x0, sh.y0);
}

function serviceTransit(e, dt){
  var tr = e.ai.transit;
  if (!tr) return false;
  if (tr.floor === e.f){ e.ai.transit = null; return false; }
  if (tr.type === 'vent'){
    var v = VENTS[tr.vi];
    if (dist(e.x, e.y, v.px, v.py) < 12){ enterVent(e, tr.vi, tr.link); e.ai.transit = null; return true; }
  } else {
    var sh = SHAFTS[tr.s];
    var c = shaftCenter(tr.s);
    if (dist(e.x, e.y, c.x, c.y) < 16){
      if (sh.state === 'idle'){
        if (sh.at !== e.f) elevatorInteract(e, tr.s);
        else {
          var step = tr.floor > e.f ? e.f + 1 : e.f - 1;
          elevatorInteract(e, tr.s, step);
          e.ai.transit = null;
        }
      }
      e.moving = false;
      return true;
    }
  }
  if (e.ai.pathT <= 0){
    var okp = (tr.type === 'vent') ? repath(e, VENTS[tr.vi].tx, VENTS[tr.vi].ty)
                                   : repath(e, SHAFTS[tr.s].x0, SHAFTS[tr.s].y0);
    /* if the route keeps failing, abandon the plan instead of standing in a
       doorway forever - serviceTransit short-circuits every other behaviour */
    if (okp) tr.fails = 0;
    else if ((tr.fails = (tr.fails || 0) + 1) > 8){ e.ai.transit = null; return false; }
  }
  followPath(e, dt, e.team === 'rabbit' && e.stam > 30);
  return true;
}

function aiControl(e, dt){
  var a = e.ai;
  a.thinkT -= dt;
  a.pathT -= dt;
  a.seenT -= dt;
  a.wanderT -= dt;
  e.moving = false;
  if (a.thinkT <= 0){
    a.thinkT = 0.22 + Math.random() * 0.12;
    if (e.team === 'rabbit') rabbitThink(e); else sciThink(e);
  }
  if (e.mode === 'hide'){ e.moving = false; return; }
  if (serviceTransit(e, dt)) return;
  followPath(e, dt, a.run);
}

/* ---------------- RABBIT AI ---------------- */
function rabbitThink(e){
  var a = e.ai;
  a.run = false;
  var foe = nearestVisibleFoe(e);

  if (foe){
    a.seenX = foe.x; a.seenY = foe.y; a.seenF = foe.f; a.seenT = 4.5; a.target = foe.id;
    a.st = 'hunt';
  } else if (a.seenT <= 0){
    var n = heardNoise(e);
    if (n && (n.kind !== 'step' || Math.random() < 0.8)){
      a.seenX = n.x; a.seenY = n.y; a.seenF = n.f; a.seenT = 3.0;
      a.st = 'listen';
    }
  }

  /* a barricaded door in the face gets torn apart */
  for (var bi = 0; bi < barricades.length; bi++){
    var bb = barricades[bi];
    if (bb.f !== e.f || bb.hp <= 0) continue;
    if (dist(e.x, e.y, bb.px, bb.py) < 26){
      setDirFromVec(e, bb.px - e.x, bb.py - e.y);
      if (rabbitAttack(e)) return;
    }
  }

  /* exhausted and nothing in sight -> power nap (helpless but instant recharge) */
  if (e.stam < 7 && !foe && a.seenT <= 0 && e.mode === 'normal'){
    if (startNap(e)) return;
  }

  /* clone when outnumbered targets are visible */
  if (e.abilCd <= 0 && !e.temp){
    var vis = 0;
    for (var i = 0; i < ents.length; i++){
      var o = ents[i];
      if (o.team === 'scientist' && o.state === 'active' && canSee(e, o)) vis++;
    }
    if (vis >= 2 || (vis >= 1 && intensity > 0.6)) { teamAbility(e); }
  }

  if (foe){
    a.transit = null;
    var d = dist(e.x, e.y, foe.x, foe.y);
    if (d < CLAW_RANGE){
      setDirFromVec(e, foe.x - e.x, foe.y - e.y);
      rabbitAttack(e);
      a.path.length = 0;
      return;
    }
    a.run = e.stam > 14;
    if (a.pathT <= 0 || !a.path.length) repath(e, (foe.x / TILE) | 0, (foe.y / TILE) | 0);
    return;
  }

  if (a.seenT > 0){
    if (a.seenF !== e.f){ planTransit(e, a.seenF); return; }
    a.transit = null;
    a.run = e.stam > 35;
    if (a.pathT <= 0 || !a.path.length) repath(e, (a.seenX / TILE) | 0, (a.seenY / TILE) | 0);
    return;
  }

  /* feed on a corpse to recover */
  if (e.hp < e.maxHp * 0.7){
    var c = null, bd = 1e9;
    for (var k = 0; k < corpses.length; k++){
      var cc = corpses[k];
      if (cc.fed || cc.f !== e.f) continue;
      var dd = dist(e.x, e.y, cc.x, cc.y);
      if (dd < bd){ bd = dd; c = cc; }
    }
    if (c){
      a.transit = null;
      if (bd < 16){ startFeed(e, c); return; }
      if (a.pathT <= 0 || !a.path.length) repath(e, (c.x / TILE) | 0, (c.y / TILE) | 0);
      return;
    }
  }

  /* patrol: hunt the last known prey, cross floors through vents */
  var prey = nearestFoeAnywhere(e);
  if (prey && prey.f !== e.f && Math.random() < 0.7){ planTransit(e, prey.f); return; }
  if (prey && prey.f === e.f && Math.random() < 0.6){
    /* cut off the escape: aim ahead of where they were going */
    var px = prey.x + prey.vx * 0.6, py = prey.y + prey.vy * 0.6;
    var t = nearestWalkable(e.f, clamp((px / TILE) | 0, 1, GW - 2), clamp((py / TILE) | 0, 1, GH - 2));
    if (t && (a.pathT <= 0 || !a.path.length)){ repath(e, t.x, t.y); a.run = e.stam > 45; return; }
  }
  if (a.pathT <= 0 || !a.path.length){
    var w = randomWalkable(e.f);
    repath(e, w.x, w.y);
    a.run = false;
  }
}

/* ---------------- SCIENTIST AI ---------------- */
function sciThink(e){
  var a = e.ai;
  a.run = false;
  var foe = nearestVisibleFoe(e);
  if (foe){ a.seenX = foe.x; a.seenY = foe.y; a.seenF = foe.f; a.seenT = 4; a.target = foe.id; }
  if (!foe && a.seenT <= 0){
    var hn = heardNoise(e);
    if (hn && hn.kind !== 'step'){ a.seenX = hn.x; a.seenY = hn.y; a.seenF = hn.f; a.seenT = 2.5; }
  }
  var danger = foe || a.seenT > 0;

  /* drink when tired or hurt - faster and more alert */
  if ((e.stam < 30 || e.hp < 55) && invCount(e, 'drink') > 0 && e.buffT <= 0) useItem(e);

  /* slam the door on the way through, whenever something is hunting you and
     it is not already breathing down your neck */
  if (danger && e.barrCd <= 0 && !e.temp && (!foe || dist(e.x, e.y, foe.x, foe.y) > 40)){
    var dr0 = doorAt(e.f, e.x, e.y);
    if (dr0) placeBarricade(e, dr0);
  }

  if (e.mode === 'hide'){
    var close = foe && dist(e.x, e.y, foe.x, foe.y) < 70;
    if (close || (!danger && e.stam > 70 && intensity < 0.7) || e.revealT > 0){
      e.mode = 'normal';
    } else return;
  }

  if (foe){
    a.transit = null;
    var d = dist(e.x, e.y, foe.x, foe.y);
    setDirFromVec(e, foe.x - e.x, foe.y - e.y);
    /* count nearby threats -> emergency backup */
    if (e.abilCd <= 0 && !e.temp){
      var near = 0;
      for (var i = 0; i < ents.length; i++){
        var o = ents[i];
        if (o.team === 'rabbit' && o.state === 'active' && o.f === e.f && dist(o.x, o.y, e.x, e.y) < 170) near++;
      }
      if (near >= 2 || e.hp < 50) teamAbility(e);
    }
    if (invCount(e, 'vial') > 0 && d > 30 && d < 112 && e.atkCd <= 0){
      /* lead the shot a little */
      var lx = foe.x + foe.vx * 0.22, ly = foe.y + foe.vy * 0.22;
      e.ang = Math.atan2(ly - e.y, lx - e.x) + rnd(-0.20, 0.20);
      throwVial(e);
      return;
    }
    if (d < 120){
      a.run = e.stam > 6;
      var ax = e.x - foe.x, ay = e.y - foe.y;
      var l = Math.max(1, Math.sqrt(ax * ax + ay * ay));
      var ally = nearestAlly(e);
      var gx = e.x + ax / l * 110, gy = e.y + ay / l * 110;
      if (ally && dist(ally.x, ally.y, foe.x, foe.y) > d){ gx = ally.x; gy = ally.y; }   /* group up */
      var t = nearestWalkable(e.f, clamp((gx / TILE) | 0, 1, GW - 2), clamp((gy / TILE) | 0, 1, GH - 2));
      if (t) repath(e, t.x, t.y);
      return;
    }
  }

  if (a.seenT > 0 && !foe){
    /* keep distance from where it was last seen */
    if (a.pathT <= 0 || !a.path.length){
      var bx = e.x + (e.x - a.seenX), by = e.y + (e.y - a.seenY);
      var tt = nearestWalkable(e.f, clamp((bx / TILE) | 0, 1, GW - 2), clamp((by / TILE) | 0, 1, GH - 2));
      if (tt) repath(e, tt.x, tt.y);
      a.run = e.stam > 25;
    }
    return;
  }

  /* restock chemicals */
  if (invCount(e, 'vial') === 0 || e.inv.length === 0){
    var best = null, bd = 1e9;
    for (var f2 = 0; f2 < NFLOORS; f2++){
      var sts = FLOORS[f2].stations;
      for (var k = 0; k < sts.length; k++){
        var s = sts[k];
        if (!s.on || s.stock <= 0) continue;
        var dd = (s.f === e.f) ? dist(e.x, e.y, s.px, s.py) : 900 + Math.abs(s.f - e.f) * 100;
        if (dd < bd){ bd = dd; best = s; }
      }
    }
    if (best){
      if (best.f !== e.f){ planTransit(e, best.f); return; }
      if (dist(e.x, e.y, best.px, best.py) < 20){ restock(e, best); a.pathT = 0; return; }
      if (a.pathT <= 0 || !a.path.length) repath(e, best.tx, best.ty);
      return;
    }
  }

  /* nothing to fight with, low on energy, clock running out -> go to ground */
  if ((e.stam < 35 || e.hp < 50 || (intensity > 0.55 && invCount(e, 'vial') === 0)) && e.revealT <= 0){
    var hs = FLOORS[e.f].hides, bh = null, bhd = 1e9;
    for (var h = 0; h < hs.length; h++){
      var hd = dist(e.x, e.y, hs[h].px, hs[h].py);
      if (hd < bhd){ bhd = hd; bh = hs[h]; }
    }
    if (bh){
      if (bhd < 14){ tryHide(e); return; }
      if (a.pathT <= 0 || !a.path.length) repath(e, bh.tx, bh.ty);
      return;
    }
  }

  /* patrol, sometimes to another floor */
  if (a.pathT <= 0 || !a.path.length){
    if (Math.random() < 0.12){ planTransit(e, rint(0, NFLOORS - 1)); return; }
    var w = randomWalkable(e.f);
    repath(e, w.x, w.y);
  }
}

/* ============================================================
   ROUND FLOW
   ============================================================ */
function roomCenter(f, ri){
  var r = FLOORS[f].rooms[ri];
  var t = nearestWalkable(f, ((r.x0 + r.x1) / 2) | 0, ((r.y0 + r.y1) / 2) | 0);
  if (!t) t = { x:((r.x0 + r.x1) / 2) | 0, y:((r.y0 + r.y1) / 2) | 0 };
  return { x:t.x * TILE + 8, y:t.y * TILE + 8 };
}

function startRound(team){
  playerTeam = team;
  buildMap();
  ents.length = 0; corpses.length = 0; barricades.length = 0;
  acids.length = 0; noises.length = 0; msgs.length = 0;
  for (var i = 0; i < PMAX; i++) particles[i].on = false;
  for (i = 0; i < JMAX; i++) projectiles[i].on = false;
  score.rn = 0; score.sd = 0;
  timeLeft = ROUND_LEN; extraCount = 0; inExtra = false;
  intensity = 0; alarmT = 6; revealPulseT = 8; revealFlash = 0; lastDroneI = -1;
  roundOver = false; resultData = null; endReason = '';
  paused = false; camShake = 0; heartT = 0; beatT = 0;
  promptText = ''; promptAction = null;

  var e, p;
  /* the three infected: they start in the cage room on B2 */
  for (i = 0; i < 3; i++){
    p = roomCenter(0, 2);
    e = mkEnt('rabbit', 0, p.x + rnd(-24, 24), p.y + rnd(-16, 16));
    unstick(e);
    ents.push(e);
  }
  /* four scientists, spread through the building */
  var spawns = [[0, 3], [1, 4], [1, 9], [2, 1]];
  for (i = 0; i < spawns.length; i++){
    var f = spawns[i][0], ri = Math.min(spawns[i][1], FLOORS[f].rooms.length - 1);
    p = roomCenter(f, ri);
    e = mkEnt('scientist', f, p.x + rnd(-16, 16), p.y + rnd(-12, 12));
    e.inv.push('vial'); e.inv.push('vial'); e.inv.push('drink');
    unstick(e);
    ents.push(e);
  }
  /* hand one body to the human */
  player = null;
  for (i = 0; i < ents.length; i++){
    if (ents[i].team === team){ player = ents[i]; break; }
  }
  player.isPlayer = true;
  if (team === 'scientist'){ player.inv = ['vial', 'vial', 'drink']; }
  spectate = player;
  camFloor = player.f;
  camX = clamp(player.x - VW / 2, 0, WW - VW);
  camY = clamp(player.y - VH / 2, 0, WH - VH);
  droneStart();
  SFX.alarm();
  msg('ROUND START - ' + (team === 'rabbit' ? 'HUNT THEM ALL' : 'NEUTRALISE OR SURVIVE'), '#e8e2d8', true);
  screen = 'play';
}

function checkEnd(){
  if (roundOver) return;
  var rab = aliveTeam('rabbit', false);
  var sci = aliveTeam('scientist', true);
  if (rab === 0 && sci === 0){
    var diff = score.sd - score.rn;
    finishRound(diff > 0 ? 'rabbits' : (diff < 0 ? 'scientists' : 'draw'), 'MUTUAL DESTRUCTION');
  } else if (sci === 0){
    finishRound('rabbits', 'EVERY SCIENTIST DEFEATED');
  } else if (rab === 0){
    finishRound('scientists', 'EVERY RABBIT NEUTRALISED');
  }
}

function finishRound(winner, reason){
  if (roundOver) return;
  roundOver = true;
  endReason = reason;
  var diff = score.sd - score.rn;
  var playerWon = (winner === playerTeam + 's') || (winner === 'rabbits' && playerTeam === 'rabbit') || (winner === 'scientists' && playerTeam === 'scientist');
  if (winner === 'draw'){ REC.d++; }
  else if (playerWon){ REC.w++; }
  else { REC.l++; }
  saveRecord();
  resultData = {
    winner:winner, reason:reason, diff:diff,
    rn:score.rn, sd:score.sd, playerWon:playerWon, team:playerTeam,
    extra:extraCount
  };
  droneSet(0);
  if (winner === 'draw') SFX.uiBig();
  else if (playerWon) SFX.win(); else SFX.lose();
  screenT = 0;
  screen = 'results';
}

function grantExtraTime(){
  extraCount++;
  inExtra = true;
  timeLeft = EXTRA_LEN;
  msg('DRAW - EXTRA TIME ' + EXTRA_LEN + 's  (' + extraCount + '/' + MAX_EXTRA + ')', '#ffd060', true);
  SFX.alarm(); SFX.uiBig();
}

function timeExpired(){
  var diff = score.sd - score.rn;
  var rab = aliveTeam('rabbit', false), sci = aliveTeam('scientist', true);
  if (aliveTeam('scientist', false) === 0){
    finishRound('rabbits', 'EVERY SCIENTIST DEFEATED - ONLY BACKUP WAS LEFT STANDING');
    return;
  }
  if (diff === 0 && extraCount < MAX_EXTRA && rab > 0 && sci > 0){ grantExtraTime(); return; }
  if (diff === 0){
    finishRound('scientists', 'TIME OUT - THE SURVIVORS HELD THE LAB');
  } else if (diff > 0){
    finishRound('scientists', 'TIME OUT - NOT EVERY SCIENTIST WAS TAKEN');
  } else {
    finishRound('scientists', 'TIME OUT - CONTAINMENT HELD');
  }
}

function updateRound(dt){
  var i;
  screenT += dt;
  timeLeft -= dt;

  var base = inExtra ? 1 : (1 - timeLeft / ROUND_LEN);
  intensity = clamp(base, 0, 1);
  if (Math.abs(intensity - lastDroneI) > 0.02){ lastDroneI = intensity; droneSet(intensity); }
  alarmT = Math.max(0, alarmT - dt);
  camShake = Math.max(0, camShake - dt * 12);

  /* stations run dry as the clock runs down */
  for (var f = 0; f < NFLOORS; f++){
    var sts = FLOORS[f].stations;
    for (i = 0; i < sts.length; i++){
      var s = sts[i];
      var was = s.on;
      if (intensity > 0.82) s.on = false;
      else if (intensity > 0.52) s.on = (s.id % 2 === 0);
      if (was && !s.on && s.f === camFloor) SFX.thump(0.4);
      if (s.stock <= 0) s.on = false;
    }
  }

  /* endgame sensor sweep - nobody hides forever */
  if (intensity > 0.62){
    revealPulseT -= dt;
    if (revealPulseT <= 0){
      revealPulseT = 8;
      revealFlash = 1.2;
      var any = false;
      for (i = 0; i < ents.length; i++){
        var e = ents[i];
        if (e.state !== 'active' || e.mode !== 'hide') continue;
        e.revealT = 2.5;
        any = true;
        for (var k = 0; k < ents.length; k++){
          var h = ents[k];
          if (h.team === e.team || h.state !== 'active' || h.isPlayer) continue;
          h.ai.seenX = e.x; h.ai.seenY = e.y; h.ai.seenF = e.f; h.ai.seenT = 5;
        }
      }
      SFX.alarm(); SFX.thump(1.2);
      msg(any ? 'SENSOR SWEEP - HIDING PLACES EXPOSED' : 'SENSOR SWEEP - NOTHING HIDDEN', '#ffb040', true);
    }
  }
  revealFlash = Math.max(0, revealFlash - dt);

  pathBudget = 3;
  for (i = 0; i < ents.length; i++) updateEnt(ents[i], dt);
  /* clear expired temps */
  for (i = ents.length - 1; i >= 0; i--) if (ents[i].state === 'gone') ents.splice(i, 1);
  if (spectate && spectate.state === 'gone') startSpectate();

  updateShafts(dt);
  updateProjectiles(dt);

  for (i = noises.length - 1; i >= 0; i--){
    noises[i].t += dt;
    if (noises[i].t > 2.4) noises.splice(i, 1);
  }
  for (i = 0; i < PMAX; i++){
    var p = particles[i];
    if (!p.on) continue;
    p.life -= dt;
    if (p.life <= 0){ p.on = false; continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += p.grav * dt;
    p.vx *= 0.96; p.vy *= 0.96;
  }
  for (i = msgs.length - 1; i >= 0; i--){
    msgs[i].t += dt;
    if (msgs[i].t > msgs[i].life) msgs.splice(i, 1);
  }
  for (i = 0; i < corpses.length; i++) corpses[i].t += dt;

  /* spectate handoff */
  if (player && player.state !== 'active'){
    if (!spectate || spectate.state !== 'active') startSpectate();
  }

  /* camera */
  var eye = (player && player.state === 'active') ? player : spectate;
  if (eye){
    if (eye.mode !== 'vent' && eye.mode !== 'elev') camFloor = eye.f;
    var tx = clamp(eye.x - VW / 2, 0, WW - VW);
    var ty = clamp(eye.y - VH / 2, 0, WH - VH);
    camX = lerp(camX, tx, Math.min(1, dt * 8));
    camY = lerp(camY, ty, Math.min(1, dt * 8));
  }

  /* heartbeat: closer hunter = faster beat */
  var me = (player && player.state === 'active') ? player : null;
  var near = 1e9;
  if (me){
    for (i = 0; i < ents.length; i++){
      var o = ents[i];
      if (o.state !== 'active' || o.f !== me.f) continue;
      if (playerTeam === 'scientist' && o.team !== 'rabbit') continue;
      if (playerTeam === 'rabbit' && o.team !== 'scientist') continue;
      var d = dist(o.x, o.y, me.x, me.y);
      if (d < near) near = d;
    }
  }
  heartT -= dt;
  if (heartT <= 0){
    var prox = clamp(1 - near / 260, 0, 1);
    var rate = lerp(1.5, 0.42, Math.max(prox, intensity * 0.55));
    heartT = rate;
    if (me && (prox > 0.15 || intensity > 0.4)) SFX.heart(0.5 + prox);
  }
  beatT -= dt;
  if (beatT <= 0){
    beatT = rnd(2.4, 5.5) * (1 - intensity * 0.45);
    if (Math.random() < 0.55) SFX.thump(0.35 + intensity * 0.5);
  }

  if (timeLeft <= 0 && !roundOver) timeExpired();
}

/* ============================================================
   RENDER
   ============================================================ */
var LC = mkc(VW, VH), LX = cx2(LC);
var gameT = 0;

function worldToScreen(x, y, ox, oy){ return { x:(x - ox) | 0, y:(y - oy) | 0 }; }

function drawEntity(g, e, ox, oy, ghost){
  var spr = entSprite(e);
  if (!spr) return;
  var sx = (e.x - ox - spr.width / 2) | 0;
  var sy = (e.y - oy - spr.height + 4) | 0;
  /* shadow */
  g.globalAlpha = 0.35;
  g.fillStyle = '#000';
  g.fillRect((e.x - ox - 5) | 0, (e.y - oy + 1) | 0, 10, 3);
  g.globalAlpha = 1;
  if (ghost) g.globalAlpha = 0.45;
  if (e.temp) g.globalAlpha *= 0.85;
  if (e.hurtT > 0){
    g.globalAlpha *= 1;
    g.drawImage(spr, sx, sy);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = e.hurtT * 2.4;
    g.fillStyle = '#8e1620';
    g.fillRect(sx, sy, spr.width, spr.height);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
  } else {
    g.drawImage(spr, sx, sy);
  }
  g.globalAlpha = 1;
  if (e.mode === 'hide'){
    g.globalAlpha = 0.35; g.drawImage(spr, sx, sy); g.globalAlpha = 1;
  }
  /* eyes glow for infected rabbits */
  if (e.team === 'rabbit' && e.state === 'active' && e.mode !== 'nap'){
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = e.temp ? 'rgba(180,150,255,0.55)' : 'rgba(255,60,40,0.65)';
    var ey = sy + (e.dir === 1 ? 4 : 5);
    if (e.dir === 2) g.fillRect(sx + 4, ey, 2, 2);
    else if (e.dir === 3) g.fillRect(sx + 10, ey, 2, 2);
    else if (e.dir === 0){ g.fillRect(sx + 3, ey, 2, 2); g.fillRect(sx + 11, ey, 2, 2); }
    g.globalCompositeOperation = 'source-over';
  }
  if (e.isPlayer){
    g.fillStyle = 'rgba(255,255,255,0.75)';
    g.fillRect((e.x - ox - 1) | 0, (e.y - oy - spr.height - 1) | 0, 2, 2);
  }
  if (e.revealT > 0 || e.spotT > 0){
    g.strokeStyle = 'rgba(255,140,40,' + (0.35 + 0.35 * Math.sin(gameT * 14)) + ')';
    g.lineWidth = 1;
    g.strokeRect(sx - 1.5, sy - 1.5, spr.width + 3, spr.height + 3);
  }
  if (e.mode === 'nap'){
    txt(g, 'z', (e.x - ox + 6) | 0, (e.y - oy - 18 - (gameT * 8 % 6)) | 0, 7, 'rgba(200,190,240,0.7)');
  }
}

function drawWorld(){
  var eye = (player && player.state === 'active') ? player : spectate;
  var shake = camShake > 0 ? camShake : 0;
  var ox = (camX + (shake ? rnd(-shake, shake) : 0)) | 0;
  var oy = (camY + (shake ? rnd(-shake, shake) : 0)) | 0;
  var fl = FLOORS[camFloor];
  var i, e;

  CX.fillStyle = '#000';
  CX.fillRect(0, 0, VW, VH);
  CX.drawImage(fl.canvas, ox, oy, VW, VH, 0, 0, VW, VH);

  /* stations (state changes with the clock) */
  for (i = 0; i < fl.stations.length; i++){
    var s = fl.stations[i];
    var sx = (s.px - 8 - ox) | 0, sy = (s.py - 8 - oy) | 0;
    if (sx < -20 || sx > VW || sy < -20 || sy > VH) continue;
    CX.drawImage(s.on && s.stock > 0 ? SPR.station : SPR.stationDead, sx, sy);
    if (s.on && s.stock > 0){
      CX.globalCompositeOperation = 'lighter';
      CX.fillStyle = 'rgba(120,220,180,' + (0.30 + 0.16 * Math.sin(gameT * 3 + i)) + ')';
      CX.fillRect(sx + 3, sy + 3, 10, 6);
      CX.globalCompositeOperation = 'source-over';
    }
  }
  /* barricades */
  for (i = 0; i < barricades.length; i++){
    var b = barricades[i];
    if (b.f !== camFloor || b.hp <= 0) continue;
    CX.drawImage(SPR.barricade, (b.x * TILE - ox) | 0, (b.y * TILE - oy) | 0);
    CX.drawImage(SPR.barricade, ((b.x + 1) * TILE - ox) | 0, (b.y * TILE - oy) | 0);
  }
  /* elevator doors */
  for (i = 0; i < SHAFTS.length; i++){
    var sh = SHAFTS[i];
    var c = shaftCenter(i);
    var ex = (sh.x0 * TILE - ox) | 0, ey = (sh.y0 * TILE - oy) | 0;
    var w = (sh.x1 - sh.x0 + 1) * TILE, h = (sh.y1 - sh.y0 + 1) * TILE;
    if (ex < -40 || ex > VW) continue;
    CX.fillStyle = '#0b0d10';
    CX.fillRect(ex, ey, w, h);
    var open = (sh.at === camFloor && sh.state === 'idle');
    CX.fillStyle = '#2b323b';
    if (open){ CX.fillRect(ex, ey, 3, h); CX.fillRect(ex + w - 3, ey, 3, h); }
    else { CX.fillRect(ex, ey, w, h); CX.fillStyle = '#1b2027'; CX.fillRect(ex + w / 2 - 1, ey, 2, h); }
    CX.fillStyle = sh.state === 'idle' ? (open ? '#5ad08a' : '#8a5a2a') : '#d0a02a';
    CX.fillRect(ex + w - 4, ey - 3, 3, 2);
    txt(CX, String(sh.at === camFloor ? 'HERE' : (sh.at + 1)), ex + 2, ey - 9, 6, 'rgba(160,190,210,0.5)');
  }
  /* acid pools */
  for (i = 0; i < acids.length; i++){
    var a = acids[i];
    if (a.f !== camFloor) continue;
    CX.globalAlpha = clamp(a.t / 3, 0, 1) * 0.5;
    CX.fillStyle = '#7fe0b0';
    CX.beginPath();
    CX.arc((a.x - ox) | 0, (a.y - oy) | 0, a.r * 0.8, 0, 6.283);
    CX.fill();
    CX.globalAlpha = 1;
  }
  /* corpses */
  for (i = 0; i < corpses.length; i++){
    var cp = corpses[i];
    if (cp.f !== camFloor) continue;
    CX.drawImage(cp.fed ? SPR.corpseFed : SPR.corpse, (cp.x - 8 - ox) | 0, (cp.y - 8 - oy) | 0);
  }

  /* entities, sorted back to front */
  var drawList = [];
  for (i = 0; i < ents.length; i++){
    e = ents[i];
    if (e.f !== camFloor) continue;
    if (e.mode === 'vent' || e.mode === 'elev') continue;
    if (e.state === 'gone') continue;
    if (e.team === 'scientist' && e.state === 'dead') continue;
    var show = false, ghost = false;
    if (e === eye || e.isPlayer) show = true;
    else if (eye && e.team === eye.team){ show = true; ghost = (e.mode === 'hide'); }
    else if (eye && canSee(eye, e)) show = true;
    else if (e.state !== 'active') {
      show = eye ? dist(eye.x, eye.y, e.x, e.y) < 130 : false;
      ghost = true;
    }
    if (!show) continue;
    drawList.push(e);
  }
  drawList.sort(function(a2, b2){ return a2.y - b2.y; });
  for (i = 0; i < drawList.length; i++) drawEntity(CX, drawList[i], ox, oy, false);

  /* projectiles */
  for (i = 0; i < JMAX; i++){
    var pj = projectiles[i];
    if (!pj.on || pj.f !== camFloor) continue;
    CX.drawImage(SPR.vialItem, (pj.x - 3 - ox) | 0, (pj.y - 4 - oy) | 0);
  }
  /* particles */
  for (i = 0; i < PMAX; i++){
    var pt = particles[i];
    if (!pt.on || pt.f !== camFloor) continue;
    CX.globalAlpha = clamp(pt.life / pt.max, 0, 1);
    CX.fillStyle = pt.col;
    CX.fillRect((pt.x - ox) | 0, (pt.y - oy) | 0, pt.sz, pt.sz);
  }
  CX.globalAlpha = 1;

  drawLighting(eye, ox, oy);

  /* rabbit heat sense: prey outlines through the walls */
  if (eye && eye.team === 'rabbit' && eye.state === 'active'){
    for (i = 0; i < ents.length; i++){
      e = ents[i];
      if (e.team !== 'scientist' || e.state !== 'active' || e.f !== camFloor) continue;
      if (e.mode === 'vent' || e.mode === 'elev') continue;
      var d = dist(eye.x, eye.y, e.x, e.y);
      if (d > 175) continue;
      if (e.mode === 'hide' && e.revealT <= 0) continue;
      CX.globalCompositeOperation = 'lighter';
      CX.globalAlpha = clamp(1 - d / 175, 0, 1) * 0.55;
      CX.fillStyle = '#ff5030';
      CX.fillRect((e.x - 5 - ox) | 0, (e.y - 15 - oy) | 0, 10, 16);
      CX.globalCompositeOperation = 'source-over';
      CX.globalAlpha = 1;
    }
  }
  /* noise blips for the hunter's ears */
  if (eye){
    for (i = 0; i < noises.length; i++){
      var n = noises[i];
      if (n.f !== camFloor || n.t > 0.9) continue;
      if (dist(eye.x, eye.y, n.x, n.y) > (eye.team === 'rabbit' ? 240 : 150)) continue;
      CX.globalAlpha = (1 - n.t / 0.9) * 0.5;
      CX.strokeStyle = eye.team === 'rabbit' ? '#ffd060' : '#9fd0ff';
      CX.lineWidth = 1;
      CX.beginPath();
      CX.arc((n.x - ox) | 0, (n.y - oy) | 0, 4 + n.t * 26, 0, 6.283);
      CX.stroke();
      CX.globalAlpha = 1;
    }
  }
}

/* torch cone gradients, built once per range and reused every frame */
var CONE_G = {};
function coneGradient(range){
  var g = CONE_G[range];
  if (!g){
    g = LX.createRadialGradient(0, 0, 6, 0, 0, range);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.55, 'rgba(255,255,255,0.85)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    CONE_G[range] = g;
  }
  return g;
}

function drawLighting(eye, ox, oy){
  var fl = FLOORS[camFloor];
  var dark = (eye && eye.team === 'rabbit') ? 0.80 : 0.90;
  dark = clamp(dark + intensity * 0.06, 0, 0.97);
  LX.globalCompositeOperation = 'source-over';
  LX.clearRect(0, 0, VW, VH);
  LX.fillStyle = 'rgba(0,0,0,' + dark + ')';
  LX.fillRect(0, 0, VW, VH);
  LX.globalCompositeOperation = 'destination-out';

  var i, l, lx, ly, r;
  /* ceiling lights, flickering harder as the round decays */
  for (i = 0; i < fl.lights.length; i++){
    l = fl.lights[i];
    lx = l.px - ox; ly = l.py - oy;
    if (lx < -90 || lx > VW + 90 || ly < -90 || ly > VH + 90) continue;
    var f1 = Math.sin(gameT * 2.3 + l.ph) * 0.5 + 0.5;
    var flick = 1;
    if (intensity > 0.25){
      var chance = 0.02 + intensity * 0.10;
      flick = (hash2((gameT * 9) | 0, i * 7) < chance) ? rnd(0.05, 0.4) : 1;
    }
    var amt = (0.55 + 0.25 * f1) * flick * (1 - intensity * 0.35);
    r = l.r * (0.85 + 0.15 * f1);
    LX.globalAlpha = clamp(amt, 0, 1);
    LX.drawImage(SPR.light, (lx - r) | 0, (ly - r) | 0, r * 2, r * 2);
  }
  LX.globalAlpha = 1;

  /* the player's own vision */
  if (eye){
    var px = eye.x - ox, py = eye.y - oy;
    if (eye.team === 'scientist'){
      r = 46;
      LX.drawImage(SPR.light, (px - r) | 0, (py - r) | 0, r * 2, r * 2);
      var range = eye.buffT > 0 ? 210 : 150;
      var half = eye.buffT > 0 ? 0.62 : 0.5;
      /* ponytail: cone ignores walls (cheap); the LOS test that matters is canSee() */
      /* gradient is built at the origin once per range and moved with a transform,
         so nothing is allocated in the frame loop */
      LX.save();
      LX.translate(px | 0, py | 0);
      LX.beginPath();
      LX.moveTo(0, 0);
      LX.arc(0, 0, range, eye.ang - half, eye.ang + half);
      LX.closePath();
      LX.fillStyle = coneGradient(range);
      LX.fill();
      LX.restore();
    } else {
      r = 150;
      LX.globalAlpha = 0.95;
      LX.drawImage(SPR.light, (px - r) | 0, (py - r) | 0, r * 2, r * 2);
      LX.globalAlpha = 1;
    }
  }
  LX.globalCompositeOperation = 'source-over';
  CX.drawImage(LC, 0, 0);

  /* emergency lamps burn through the dark once the alarm is up */
  var emerOn = (alarmT > 0) || intensity > 0.35;
  if (emerOn){
    var pulse = 0.35 + 0.4 * (Math.sin(gameT * 3.4) * 0.5 + 0.5);
    CX.globalCompositeOperation = 'lighter';
    for (i = 0; i < fl.emer.length; i++){
      var em = fl.emer[i];
      lx = em.px - ox; ly = em.py - oy;
      if (lx < -80 || lx > VW + 80 || ly < -80 || ly > VH + 80) continue;
      CX.globalAlpha = pulse * (0.35 + intensity * 0.5);
      CX.drawImage(SPR.redLight, (lx - em.r) | 0, (ly - em.r) | 0, em.r * 2, em.r * 2);
    }
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }
  /* scientist torch warmth */
  if (eye && eye.team === 'scientist'){
    CX.globalCompositeOperation = 'lighter';
    CX.globalAlpha = 0.12;
    var pr = 60;
    CX.drawImage(SPR.coolLight, (eye.x - ox - pr) | 0, (eye.y - oy - pr) | 0, pr * 2, pr * 2);
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }
  /* tints */
  CX.drawImage(SPR.vignette, 0, 0);
  if (eye && eye.team === 'rabbit'){
    CX.globalCompositeOperation = 'lighter';
    CX.globalAlpha = 0.06 + 0.04 * intensity;
    CX.fillStyle = '#601018';
    CX.fillRect(0, 0, VW, VH);
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }
  if (revealFlash > 0){
    CX.globalAlpha = revealFlash * 0.25;
    CX.fillStyle = '#ff8030';
    CX.fillRect(0, 0, VW, VH);
    CX.globalAlpha = 1;
  }
  var me = (player && player.state === 'active') ? player : null;
  if (me && me.hp < 45){
    CX.globalAlpha = (1 - me.hp / 45) * (0.10 + 0.06 * Math.sin(gameT * 5));
    CX.fillStyle = '#7a0e14';
    CX.fillRect(0, 0, VW, VH);
    CX.globalAlpha = 1;
  }
}

/* ============================================================
   HUD
   ============================================================ */
function fmtTime(t){
  t = Math.max(0, t);
  var m = (t / 60) | 0, s = (t % 60) | 0;
  return m + ':' + (s < 10 ? '0' : '') + s;
}
function bar(g, x, y, w, h, v, max, col, back){
  g.fillStyle = back || 'rgba(0,0,0,0.65)';
  g.fillRect(x - 1, y - 1, w + 2, h + 2);
  g.fillStyle = '#15181d';
  g.fillRect(x, y, w, h);
  g.fillStyle = col;
  g.fillRect(x, y, Math.max(0, Math.min(1, v / max)) * w, h);
}

    else if (eye.mode === 'hide') txtShadow(CX, 'HIDDEN', bx, by + 17, 6, '#8fb8e0');

  for (i = 0; i < 3; i++){

    CX.lineWidth = 1;
    CX.strokeRect(ix + i * 16 + 0.5, iy + 0.5, 13, 15);
    if (eye && eye.inv[i]){
      var sp = eye.inv[i] === 'vial' ? SPR.vialItem : (eye.inv[i] === 'drink' ? SPR.drinkItem : SPR.serumItem);
      CX.drawImage(sp, ix + i * 16 + 4, iy + 4);
    }
  }
  txtShadow(CX, 'F USE', ix + 50, iy + 4, 6, 'rgba(150,165,180,0.7)');

  /* minimap */
  var mmW = GW * 2, mmH = GH * 2, mx = VW - mmW - 6, my = 26;
  CX.globalAlpha = 0.82;
  CX.fillStyle = '#05060a';
  CX.fillRect(mx - 2, my - 2, mmW + 4, mmH + 4);
  CX.drawImage(FLOORS[camFloor].mini, 0, 0, GW, GH, mx, my, mmW, mmH);
  CX.globalAlpha = 1;
  CX.strokeStyle = 'rgba(120,150,170,0.35)';
  CX.strokeRect(mx - 2.5, my - 2.5, mmW + 5, mmH + 5);
  for (i = 0; i < ents.length; i++){
    var e2 = ents[i];
    if (e2.f !== camFloor || e2.state === 'gone') continue;
    if (e2.mode === 'vent' || e2.mode === 'elev') continue;
    var show2 = e2.isPlayer || (eye && e2.team === eye.team) || (eye && canSee(eye, e2)) || e2.state !== 'active';
    if (!show2) continue;
    var col2 = e2.state !== 'active' ? '#4a4a52' : (e2.team === 'rabbit' ? '#ff5030' : '#7fd0ff');
    if (e2.isPlayer) col2 = '#ffffff';
    CX.fillStyle = col2;
    CX.fillRect(mx + ((e2.x / TILE) * 2) | 0, my + ((e2.y / TILE) * 2) | 0, 2, 2);
  }
  txtShadow(CX, 'FLOOR ' + (camFloor + 1) + '/' + NFLOORS, mx, my + mmH + 3, 6, 'rgba(150,165,180,0.7)');

  /* prompt */
  if (me && promptText){
    txtShadow(CX, promptText, VW / 2, VH - 62, 8, '#ffe0a0', 'center');
  }
  if (!me){
    txtShadow(CX, 'YOU ARE OUT - WATCHING THE ROUND FINISH', VW / 2, 26, 8, '#e05a52', 'center');
  }

  /* messages */
  for (i = 0; i < msgs.length; i++){
    var m = msgs[i];
    var al = clamp(Math.min(m.t * 4, (m.life - m.t) * 3), 0, 1);
    CX.globalAlpha = al;
    txtShadow(CX, m.s, VW / 2, 34 + i * 11, m.big ? 9 : 8, m.col, 'center');
    CX.globalAlpha = 1;
  }

  /* key legend */
  txtShadow(CX, 'ARROWS MOVE  SHIFT RUN  SPACE ' + (playerTeam === 'rabbit' ? 'CLAW/BITE' : 'THROW CHEMICAL') +
    '  E INTERACT  F ITEM  Q ' + (playerTeam === 'rabbit' ? 'CLONE' : 'BACKUP') +
    (playerTeam === 'rabbit' ? '  R NAP' : '') + '  P PAUSE  M MUTE',
    VW / 2, VH - 9, 6, 'rgba(150,165,180,0.55)', 'center');
}

function drawIntro(t){
  if (!introBg) buildIntroBg();
  CX.fillStyle = '#000'; CX.fillRect(0, 0, VW, VH);
  CX.drawImage(introBg, 0, 0);
  var i, x, y;

  /* monitors flicker */
  CX.globalCompositeOperation = 'lighter';
  for (i = 0; i < 3; i++){
    CX.globalAlpha = 0.10 + 0.06 * Math.sin(t * 6 + i * 2);
    CX.fillStyle = '#2c8fa8';
    CX.fillRect(28 + i * 96, 20, 56, 36);
  }
  CX.globalAlpha = 1;
  CX.globalCompositeOperation = 'source-over';

  /* caged rabbits (one of them is subject 7, cage index 1) */
  var infT = clamp((t - 6.2) / 3.3, 0, 1);
  for (i = 0; i < 8; i++){
    var cxp = 360 + (i % 4) * 28, cyp = (i < 4 ? 126 : 182);
    var hop = Math.abs(Math.sin(t * 3 + i)) * 3;
    if (i === 1 && t > 6.2) continue;
    CX.drawImage(SPR.smallRab, cxp, cyp - hop);
  }
  /* subject 7 transforming inside the cage, then out of it */
  if (t > 6.2){
    var sc = lerp(0.55, 1.25, infT);
    var shakeI = (t < 9.4) ? Math.sin(t * 40) * (1.5 + 3 * infT) : 0;
    var bx = 360 + 28, by = 126;
    CX.save();
    CX.translate(bx + 8 + shakeI, by + 8);
    CX.scale(sc, sc);
    CX.globalAlpha = 1;
    if (infT < 0.45){
      CX.globalAlpha = 1;
      CX.drawImage(SPR.smallRab, -4, -4);
      CX.globalCompositeOperation = 'lighter';
      CX.globalAlpha = infT * 1.6;
      CX.fillStyle = '#4fe0a0';
      CX.fillRect(-4, -4, 8, 8);
      CX.globalCompositeOperation = 'source-over';
      CX.globalAlpha = 1;
    } else {
      CX.drawImage(SPR.rab[0][(t * 8) & 3], -8, -10);
    }
    CX.restore();
    if (t > 9.4 && t < 9.9){
      /* cage bursts */
      if (Math.random() < 0.6) burst(0, bx + 8, by + 8, 2, '#8a8f98', 90, 0.5, 2);
    }
  }
  /* the loose infected stalks left across the room after 10s */
  if (t > 10){
    var wx = lerp(370, 150, clamp((t - 10) / 5, 0, 1));
    var wy = 196;
    CX.drawImage(SPR.rab[2][(t * 9) & 3], wx | 0, wy | 0);
    CX.globalCompositeOperation = 'lighter';
    CX.globalAlpha = 0.6;
    CX.fillStyle = '#ff3020';
    CX.fillRect((wx + 4) | 0, (wy + 5) | 0, 2, 2);
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }

  /* scientists at work */
  var sciPos = [
    { x0:70,  x1:150, y:170, ph:0 },
    { x0:180, x1:250, y:200, ph:1.7 },
    { x0:250, x1:330, y:150, ph:3.1 }
  ];
  for (i = 0; i < sciPos.length; i++){
    var s = sciPos[i];
    var w = 0.5 + 0.5 * Math.sin(t * 0.7 + s.ph);
    var sx = lerp(s.x0, s.x1, w);
    var d = Math.cos(t * 0.7 + s.ph) > 0 ? 3 : 2;
    var fr = ((t * 7) | 0) & 3;
    if (t > 10.2){
      /* they run for the doors */
      var fleeT = clamp((t - 10.2) / 4, 0, 1);
      sx = lerp(sx, i === 1 ? 20 : -30, fleeT);
      d = 2;
      fr = ((t * 12) | 0) & 3;
    }
    if (t > 11.6 && i === 2) continue;   /* the one that does not make it */
    CX.drawImage(SPR.sci[d][fr], sx | 0, s.y);
  }
  /* the mistake: a scientist carries a flask to cage 2, drops it */
  if (t > 3 && t < 6.6){
    var apT = clamp((t - 3) / 2.4, 0, 1);
    var ax = lerp(300, 352, apT), ay = 150;
    CX.drawImage(SPR.sci[3][((t * 7) | 0) & 3], ax | 0, ay);
    if (t < 5.8) CX.drawImage(SPR.vialItem, (ax + 12) | 0, (ay + 4) | 0);
  }
  if (t >= 5.8 && t < 6.3){
    var fall = (t - 5.8) / 0.5;
    CX.drawImage(SPR.vialItem, 364, (154 + fall * 30) | 0);
  }
  if (t >= 6.2 && t < 7.4){
    CX.globalCompositeOperation = 'lighter';
    CX.globalAlpha = clamp(1.2 - (t - 6.2), 0, 1) * 0.7;
    CX.fillStyle = '#7fffbf';
    CX.fillRect(340, 120, 80, 60);
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }
  /* the one that does not make it: silhouette + spray */
  if (t > 11.4 && t < 12.4){
    CX.fillStyle = 'rgba(90,10,14,' + clamp((t - 11.4) * 2, 0, 0.85) + ')';
    for (i = 0; i < 14; i++){
      var a = -0.4 - Math.random() * 1.6, dd = Math.random() * 40;
      CX.fillRect((300 + Math.cos(a) * dd) | 0, (150 + Math.sin(a) * dd) | 0, 2, 2);
    }
  }

  /* darkness + alarm lighting */
  var dk = t < 9.6 ? 0.30 : lerp(0.30, 0.72, clamp((t - 9.6) / 2, 0, 1));
  CX.fillStyle = 'rgba(0,0,0,' + dk + ')';
  CX.fillRect(0, 0, VW, VH);
  if (t > 10.4){
    CX.globalCompositeOperation = 'lighter';
    var pulse = (Math.sin(t * 7) * 0.5 + 0.5);
    CX.globalAlpha = 0.18 + 0.28 * pulse;
    CX.fillStyle = '#8a1010';
    CX.fillRect(0, 0, VW, VH);
    CX.globalAlpha = 1;
    CX.globalCompositeOperation = 'source-over';
  }
  CX.drawImage(SPR.vignette, 0, 0);

  /* captions */
  var cap = '';
  if (t < 3) cap = 'CTS BIOLABS - SUBLEVEL B2 - 03:14';
  else if (t < 5.8) cap = 'SUBJECT 7 - TRIAL 44 - HANDLER: DR. ELKIN';
  else if (t < 6.4) cap = 'ONE SLIP.';
  else if (t < 9.6) cap = 'THE VIRUS TAKES. IT GROWS. IT HUNGERS.';
  else if (t < 13) cap = 'CONTAINMENT FAILURE - LOCKDOWN - ALL STAFF';
  else cap = '';
  if (cap) txtShadow(CX, cap, VW / 2, VH - 34, 8, 'rgba(220,225,235,0.85)', 'center');

  if (t > 13){
    var tt = clamp((t - 13) / 1.4, 0, 1);
    CX.globalAlpha = tt;
    txtShadow(CX, 'HUNGRY RABBIT', VW / 2, 96, 26, '#e8e2d8', 'center');
    txtShadow(CX, 'a Team Pixel production', VW / 2, 126, 8, 'rgba(190,120,120,0.85)', 'center');
    CX.globalAlpha = 1;
  }
  if (Math.sin(t * 4) > -0.4)
    txtShadow(CX, 'SPACE / ENTER - ' + (t > 13 ? 'CONTINUE' : 'SKIP'), VW / 2, VH - 18, 8, 'rgba(200,210,220,0.8)', 'center');
}

function introAudio(prev, t){
  if (prev < 0.2 && t >= 0.2) nz(2.5, 300, 0.05);
  if (prev < 1.5 && t >= 1.5) tone(880, 0.05, 'square', 0.04);
  if (prev < 3.0 && t >= 3.0) tone(660, 0.05, 'square', 0.04);
  if (prev < 5.8 && t >= 5.8) SFX.glass();
  if (prev < 6.2 && t >= 6.2){ SFX.smash(); SFX.rumble(3.2); }
  if (prev < 8.0 && t >= 8.0) SFX.thump(1.2);
  if (prev < 9.4 && t >= 9.4){ SFX.glass(); SFX.screech(); }
  if (prev < 10.4 && t >= 10.4){ SFX.alarm(); }
  if (prev < 11.4 && t >= 11.4){ SFX.bite(); }
  if (prev < 12.4 && t >= 12.4){ SFX.alarm(); }
  if (prev < 13.0 && t >= 13.0){ SFX.uiBig(); droneStart(); }
  if (t > 10.4){
    var k0 = Math.floor(prev * 0.7), k1 = Math.floor(t * 0.7);
    if (k1 !== k0) SFX.alarm();
  }
}

  if (AU.droneGain) { try { AU.droneGain.gain.setTargetAtTime(AU.muted ? 0 : 0.05, now(), 0.1); } catch (e) {} }

function step(dt){
  gameT += dt;
  if (hit('KeyM')) toggleMute();

  if (screen === 'boot'){
    screenT += dt;
    if (confirmKey()){ SFX.uiBig(); introT = 0; introDone = false; screen = 'intro'; }
  }
  else if (screen === 'intro'){
    var prev = introT;
    introT += dt;
    introAudio(prev, introT);
    if (confirmKey()){
      if (introT < 12.9){ introT = 12.95; SFX.ui(); }
      else { SFX.uiBig(); screen = 'select'; screenT = 0; }
    }
    if (introT >= INTRO_END){ screen = 'select'; screenT = 0; }
  }
  else if (screen === 'select'){
    screenT += dt;
    if (hit('ArrowLeft') && selIndex !== 0){ selIndex = 0; SFX.ui(); }
    if (hit('ArrowRight') && selIndex !== 1){ selIndex = 1; SFX.ui(); }
    if (hit('Escape')){ goMenu(); SFX.ui(); }
    if (confirmKey()){ SFX.uiBig(); startRound(selIndex === 0 ? 'rabbit' : 'scientist'); }
  }
  else if (screen === 'menu'){
    screenT += dt;
    toastT = Math.max(0, toastT - dt);
    if (hit('ArrowUp')){ menuIndex = (menuIndex + MENU_ITEMS.length - 1) % MENU_ITEMS.length; SFX.ui(); }
    if (hit('ArrowDown')){ menuIndex = (menuIndex + 1) % MENU_ITEMS.length; SFX.ui(); }
    if (confirmKey()){
      SFX.uiBig();
      if (menuIndex === 0){ screen = 'select'; screenT = 0; }
      else if (menuIndex === 1){ screen = 'help'; }
      else if (menuIndex === 2){ introT = 0; screen = 'intro'; }
      else { resetRecord(); toastT = 2.2; toastS = 'RECORD CLEARED'; }
    }
  }
  else if (screen === 'help'){
    screenT += dt;
    if (confirmKey() || hit('Escape')){ SFX.ui(); screen = 'menu'; }
  }
  else if (screen === 'play'){
    /* read the escape edge ONCE: pausing and abandoning must not share a press */
    var esc = hit('Escape');
    if (paused){
      if (esc){ SFX.ui(); goMenu(); return; }
      if (confirmKey() || hit('KeyP')){ paused = false; SFX.ui(); }
      return;
    }
    if (esc || hit('KeyP')){ paused = true; SFX.ui(); return; }
    updateRound(dt);
  }
  else if (screen === 'results'){
    screenT += dt;
    if (screenT > 0.4 && confirmKey()){ SFX.uiBig(); goMenu(); }
  }
}

function render(){
  if (screen === 'boot') drawBoot();
  else if (screen === 'intro') drawIntro(introT);
  else if (screen === 'select') drawSelect();
  else if (screen === 'menu') drawMenu();
  else if (screen === 'help') drawHelp();
  else if (screen === 'results') drawResults();
  else if (screen === 'play'){
    drawWorld();
    drawHUD();
    if (paused) drawPauseOverlay();
  }
}

/* ============================================================
   CANVAS FIT (letterbox, whole device pixels)
   ============================================================ */
function resize(){
  var dpr = window.devicePixelRatio || 1;
  var w = window.innerWidth, h = window.innerHeight;
  var scaleDev = Math.floor(Math.min(w * dpr / VW, h * dpr / VH));
  var cssW, cssH;
  if (scaleDev >= 1){
    cssW = VW * scaleDev / dpr;
    cssH = VH * scaleDev / dpr;
  } else {
    var s = Math.min(w / VW, h / VH);
    cssW = VW * s; cssH = VH * s;
  }
  CV.style.width = cssW + 'px';
  CV.style.height = cssH + 'px';
}
window.addEventListener('resize', resize, false);

/* ============================================================
   MAIN LOOP
   ============================================================ */
var lastT = 0, acc = 0, started = false;
function frame(ts){
  window.requestAnimationFrame(frame);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000;
  lastT = ts;
  if (dt > 0.25) dt = 0.25;
  if (dt < 0) dt = 0;
  acc += dt;
  var steps = 0;
  while (acc >= DT && steps < 8){
    step(DT);
    if (steps === 0) clearPressed();
    acc -= DT;
    steps++;
  }
  if (steps >= 8) acc = 0;
  render();
  if (steps > 0) clearPressed();
}

function init(){
  buildSprites();
  REC = loadRecord();
  resize();
  screen = 'boot';
  window.requestAnimationFrame(frame);
}
init();

})();
</script>
