   Single file. No network. Everything drawn / synthesised here.

var VW = 480, VH = 270;
var TILE = 16, GW = 56, GH = 32, NFLOORS = 3;
var WW = GW * TILE, WH = GH * TILE;
var DT = 1 / 60;

var T_FLOOR = 0, T_WALL = 1, T_VENT = 2, T_ELEV = 3, T_HIDE = 4,
    T_STATION = 5, T_PROP = 6, T_GLASS = 7, T_DOOR = 8, T_BARR = 9;

var CV = document.getElementById('cv');
var CX = CV.getContext('2d');
CX.imageSmoothingEnabled = false;

/* ---------- tiny utils ---------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function dist2(ax, ay, bx, by){ var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
function dist(ax, ay, bx, by){ return Math.sqrt(dist2(ax, ay, bx, by)); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function rint(a, b){ return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr){ return arr[(Math.random() * arr.length) | 0]; }
function hash2(x, y){ var h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }
function idx(x, y){ return y * GW + x; }
function inb(x, y){ return x >= 0 && y >= 0 && x < GW && y < GH; }
function angDiff(a, b){ var d = a - b; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

function isSolidT(t){ return t === T_WALL || t === T_PROP || t === T_GLASS || t === T_BARR; }
function blocksLOS(t){ return t === T_WALL || t === T_PROP || t === T_BARR; }

function mkc(w, h){
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  var g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}
function cx2(c){ var g = c.getContext('2d'); g.imageSmoothingEnabled = false; return g; }

function drawPix(g, rows, pal, ox, oy){
  for (var y = 0; y < rows.length; y++){
    var r = rows[y];
    for (var x = 0; x < r.length; x++){
      var ch = r.charAt(x);
      if (ch === ' ') continue;
      var col = pal[ch];
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(ox + x, oy + y, 1, 1);
    }
  }
}

function txt(g, s, x, y, size, col, align){
  g.font = size + 'px monospace';
  g.textAlign = align || 'left';
  g.textBaseline = 'top';
  g.fillStyle = col;
  g.fillText(s, x, y);
}
function txtShadow(g, s, x, y, size, col, align){
  g.font = size + 'px monospace';
  g.textAlign = align || 'left';
  g.textBaseline = 'top';
  g.fillStyle = 'rgba(0,0,0,0.85)';
  g.fillText(s, x + 1, y + 1);
  g.fillStyle = col;
  g.fillText(s, x, y);
}

/* ---------- input ---------- */
var keys = {}, pressed = {};
var BLOCK = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, Space:1, ShiftLeft:1, ShiftRight:1,
              KeyE:1, KeyF:1, KeyQ:1, KeyR:1, KeyP:1, KeyM:1, Enter:1, NumpadEnter:1, Escape:1, Tab:1 };

window.addEventListener('keydown', function(e){
  var c = e.code;
  if (BLOCK[c]) e.preventDefault();
  if (!keys[c]) pressed[c] = true;
  keys[c] = true;
  onAnyKey();
}, false);
window.addEventListener('keyup', function(e){
  var c = e.code;
  if (BLOCK[c]) e.preventDefault();
  keys[c] = false;
}, false);
window.addEventListener('blur', function(){
  for (var k in keys) keys[k] = false;
  if (screen === 'play') { paused = true; }
}, false);
document.addEventListener('visibilitychange', function(){
  if (document.hidden && screen === 'play') paused = true;
}, false);
/* inside an iframe the keyboard goes nowhere until this window has focus */
window.addEventListener('pointerdown', function(){
  try { window.focus(); } catch (e) {}
  onAnyKey();
}, false);

function hit(code){ return !!pressed[code]; }
function confirmKey(){ return pressed.Space || pressed.Enter || pressed.NumpadEnter; }
function clearPressed(){ pressed = {}; }

/* ---------- audio (WebAudio, created only after a gesture) ---------- */
var AU = { ctx:null, master:null, noise:null, muted:false, drone:null, droneGain:null, droneF:null, ready:false };

function audioInit(){
  if (AU.ctx) { audioResume(); return; }
  var C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  try { AU.ctx = new C(); } catch (e) { AU.ctx = null; return; }
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = 0.55;
  AU.master.connect(AU.ctx.destination);
  var sr = AU.ctx.sampleRate;
  var b = AU.ctx.createBuffer(1, sr, sr);
  var d = b.getChannelData(0);
  for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = b;
  AU.ready = true;
}
function audioResume(){
  if (AU.ctx && AU.ctx.state === 'suspended') { try { AU.ctx.resume(); } catch (e) {} }
}
function now(){ return AU.ctx ? AU.ctx.currentTime : 0; }

function tone(freq, dur, type, gain, freq2, delay){
  if (!AU.ready || AU.muted) return;
  var t0 = now() + (delay || 0);
  var o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + Math.min(0.02, dur * 0.3));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AU.master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function nz(dur, cut, gain, type, delay, q){
  if (!AU.ready || AU.muted) return;
  var t0 = now() + (delay || 0);
  var s = AU.ctx.createBufferSource();
  s.buffer = AU.noise;
  s.loop = true;
  var f = AU.ctx.createBiquadFilter();
  f.type = type || 'lowpass';
  f.frequency.setValueAtTime(cut, t0);
  if (q) f.Q.value = q;
  var g = AU.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(AU.master);
  s.start(t0); s.stop(t0 + dur + 0.02);
}

  lose:    function(){ tone(220, 0.25, 'sawtooth', 0.10); tone(160, 0.30, 'sawtooth', 0.10, null, 0.2); tone(100, 0.6, 'sawtooth', 0.11, 60, 0.4); },
  glass:   function(){ nz(0.35, 6000, 0.22, 'highpass'); tone(1500, 0.2, 'triangle', 0.06, 400); },
  rumble:  function(d){ tone(44, d || 1.6, 'sawtooth', 0.10, 30); nz(d || 1.6, 220, 0.09); }

function droneStart(){
  if (!AU.ready || AU.drone) return;
  var g = AU.ctx.createGain(); g.gain.value = 0.0;
  var f = AU.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;
  var o1 = AU.ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
  var o2 = AU.ctx.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.6;
  var o3 = AU.ctx.createOscillator(); o3.type = 'sine'; o3.frequency.value = 27.5;
  o1.connect(f); o2.connect(f); o3.connect(f); f.connect(g); g.connect(AU.master);
  o1.start(); o2.start(); o3.start();
  g.gain.linearRampToValueAtTime(0.05, now() + 2);
  AU.drone = { o1:o1, o2:o2, o3:o3 };
  AU.droneGain = g; AU.droneF = f;
}
function droneSet(intensity){
  if (!AU.droneGain) return;
  try {
    AU.droneGain.gain.setTargetAtTime(AU.muted ? 0 : (0.045 + 0.05 * intensity), now(), 0.5);
    AU.droneF.frequency.setTargetAtTime(180 + 320 * intensity, now(), 0.8);
    AU.drone.o2.frequency.setTargetAtTime(55.6 + 2.2 * intensity, now(), 0.8);
  } catch (e) {}
}
function droneStop(){
  if (!AU.drone) return;
  try {
    AU.droneGain.gain.setTargetAtTime(0, now(), 0.2);
    AU.drone.o1.stop(now() + 0.6); AU.drone.o2.stop(now() + 0.6); AU.drone.o3.stop(now() + 0.6);
  } catch (e) {}
  AU.drone = null; AU.droneGain = null; AU.droneF = null;
}

function sciPal(coat, dark){
  return { h:'#23232a', s:'#c9b79c', g: dark ? '#4be0c8' : '#7fe0ff', m:'#e2e2e8',
           w:coat, W:'#8f959f', a: dark ? '#6d7480' : '#aeb4bd' };
}

function buildSci(name, coat, dark){
  var views = [SCI_BODY, SCI_BACK, SCI_SIDE];
  var out = [[], [], [], []];
  for (var d = 0; d < 3; d++){
    for (var fr = 0; fr < 4; fr++){
      var c = mkc(12, 16), g = cx2(c);
      var bob = (fr === 1 || fr === 3) ? 1 : 0;
      drawPix(g, views[d], sciPal(coat, dark), 0, bob);
      // legs
      var lp = [0, 1, 0, -1][fr];
      g.fillStyle = '#343945';
      g.fillRect(3 + lp, 13 + bob, 2, 2);
      g.fillRect(7 - lp, 13 + bob, 2, 2);
      g.fillStyle = '#14161a';
      g.fillRect(3 + lp, 15, 2, 1);
      g.fillRect(7 - lp, 15, 2, 1);
      out[d].push(c);
    }
  }
  // right = mirrored side
  for (var fr2 = 0; fr2 < 4; fr2++){
    var c2 = mkc(12, 16), g2 = cx2(c2);
    g2.save(); g2.translate(12, 0); g2.scale(-1, 1);
    g2.drawImage(out[2][fr2], 0, 0);
    g2.restore();
    out[3].push(c2);
  }
  SPR[name] = out; // [dirDown, dirUp, dirLeft, dirRight][frame]
}

function rabPal(clone){
  if (clone) return { E:'#5a4f66', i:'#7a5f78', B:'#5b5170', b:'#6d6288', r:'#ff8f7a', t:'#d9d3e8', C:'#cfd6ee', D:'#3f3854', L:'#3a3350', x:'#2a2438' };

function buildRabbit(name, clone){
  var pal = rabPal(clone);
  var out = [[], [], [], []];
  var d, fr, c, g, bob, i;
  for (d = 0; d < 3; d++){
    var art = (d === 2) ? RAB_SIDE : RAB_FRONT;
    for (fr = 0; fr < 4; fr++){
      c = mkc(16, 16); g = cx2(c);
      bob = (fr === 1) ? -1 : (fr === 3 ? 1 : 0);
      drawPix(g, art, pal, 0, 0);
      // shift back legs for gait
      g.clearRect(0, 14, 16, 2);
      var lp = [0, 1, 0, -1][fr];
      g.fillStyle = pal.L;
      if (d === 2){ g.fillRect(2 + lp, 14, 2, 2); g.fillRect(8 - lp, 14, 2, 2); }
      else { g.fillRect(2 + lp, 14, 2, 2); g.fillRect(12 - lp, 14, 2, 2); }
      if (bob){
        var tmp = mkc(16, 16), tg = cx2(tmp);
        tg.drawImage(c, 0, bob);
        c = tmp;
      }
      out[d].push(c);
    }
  }
  for (fr = 0; fr < 4; fr++){
    c = mkc(16, 16); g = cx2(c);
    g.save(); g.translate(16, 0); g.scale(-1, 1); g.drawImage(out[2][fr], 0, 0); g.restore();
    out[3].push(c);
  }
  SPR[name] = out;
  var ca = mkc(16, 16); drawPix(cx2(ca), RAB_ATTACK, pal, 0, 0); SPR[name + 'Atk'] = ca;
  var cn = mkc(16, 16); drawPix(cx2(cn), RAB_NAP, pal, 0, 0); SPR[name + 'Nap'] = cn;
  var cd = mkc(16, 16); drawPix(cx2(cd), RAB_DOWN, pal, 0, 0); SPR[name + 'Down'] = cd;
}

function buildLights(){

  var c2 = mkc(s, s), g2 = cx2(c2);
  var gr2 = g2.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr2.addColorStop(0, 'rgba(255,90,60,0.85)');
  gr2.addColorStop(0.5, 'rgba(210,40,30,0.35)');
  gr2.addColorStop(1, 'rgba(160,20,20,0)');
  g2.fillStyle = gr2; g2.fillRect(0, 0, s, s);

  var c3 = mkc(s, s), g3 = cx2(c3);
  var gr3 = g3.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr3.addColorStop(0, 'rgba(190,225,255,0.55)');
  gr3.addColorStop(0.55, 'rgba(150,200,240,0.18)');
  gr3.addColorStop(1, 'rgba(120,180,230,0)');
  g3.fillStyle = gr3; g3.fillRect(0, 0, s, s);

  // vignette
  var c4 = mkc(VW, VH), g4 = cx2(c4);
  var gr4 = g4.createRadialGradient(VW / 2, VH / 2, VH * 0.28, VW / 2, VH / 2, VH * 0.85);
  gr4.addColorStop(0, 'rgba(0,0,0,0)');
  gr4.addColorStop(1, 'rgba(0,0,0,0.72)');
  g4.fillStyle = gr4; g4.fillRect(0, 0, VW, VH);
  SPR.vignette = c4;
}

/* ============================================================
   MAP  --  3 floors, rooms, vents, elevators, stations
   ============================================================ */
var ROOMX = [[1, 13], [15, 27], [29, 41], [43, 54]];
var TOP_Y0 = 1, TOP_Y1 = 12, BOT_Y0 = 18, BOT_Y1 = 30;
var COR_Y0 = 14, COR_Y1 = 16, WALL_TOP = 13, WALL_BOT = 17;
var DIVX = [14, 28, 42];

var FLOOR_DEFS = [
  { name:'B2 CONTAINMENT', tint:'#1a1c20',
    top:[['TEST CHAMBER A','test'], ['CAGE ROOM','cage'], ['DECON','decon'], ['STORAGE','store']],
    bot:[['MORGUE','morgue'], ['WET LAB','lab'], ['SPECIMEN VAULT','vault'], ['PUMP ROOM','pump']] },
  { name:'B1 RESEARCH', tint:'#191b1e',
    top:[['TEST CHAMBER B','test'], ['GENE LAB','lab'], ['OFFICES','office'], ['SERVER ROOM','server']],
    bot:[['CANTEEN','canteen'], ['COLD STORE','store'], ['SURGERY','lab'], ['LOCKER ROOM','office']] },
  { name:'G FLOOR ATRIUM', tint:'#17191c',
    top:[['SECURITY','security'], ['ADMIN OFFICES','office'], ['ARCHIVE','store'], ['SERVER HUB','server']],
    bot:[['RECEPTION','office'], ['DISPATCH','store'], ['CHEM STORE','test'], ['EXIT CORRIDOR','decon']] }
];

var PROP_FOR = { test:'p1', lab:'p1', cage:'p2', vault:'p2', server:'p3', morgue:'p4',
                 store:'p5', pump:'p5', decon:'p5', office:'p6', canteen:'p6', security:'p6' };

var VENT_POS = [[3, 3], [25, 10], [37, 20], [52, 28], [10, 28], [45, 5]];
var STATION_POS = [[[20, 20], [46, 10]], [[6, 6], [33, 26]], [[24, 4], [50, 20]]];

var SHAFTS = [
  { x0:3,  y0:14, x1:4,  y1:15, at:0, state:'idle', t:0, dest:0, riders:[], name:'LIFT A' },
  { x0:51, y0:15, x1:52, y1:16, at:0, state:'idle', t:0, dest:0, riders:[], name:'LIFT B' }
];

var FLOORS = [];
var VENTS = [];   /* {f,tx,ty,px,py,links:[ventIndex,...]} */

function tileAt(f, tx, ty){
  if (!inb(tx, ty)) return T_WALL;
  return FLOORS[f].tiles[idx(tx, ty)];
}
function solidAt(f, tx, ty){ return isSolidT(tileAt(f, tx, ty)); }

function buildFloor(f){
  var def = FLOOR_DEFS[f];
  var tiles = new Uint8Array(GW * GH);
  var props = new Uint8Array(GW * GH);
  var roomId = new Int8Array(GW * GH);
  var i;
  for (i = 0; i < tiles.length; i++){ tiles[i] = T_WALL; roomId[i] = -1; }

  var rooms = [];
  var r, x, y, x0, x1, y0, y1;

  function carve(rx0, rx1, ry0, ry1, rid){
    for (y = ry0; y <= ry1; y++)
      for (x = rx0; x <= rx1; x++){ tiles[idx(x, y)] = T_FLOOR; roomId[idx(x, y)] = rid; }
  }

  for (r = 0; r < 4; r++){
    x0 = ROOMX[r][0]; x1 = ROOMX[r][1];
    rooms.push({ x0:x0, x1:x1, y0:TOP_Y0, y1:TOP_Y1, name:def.top[r][0], kind:def.top[r][1], band:0 });
    carve(x0, x1, TOP_Y0, TOP_Y1, rooms.length - 1);
    rooms.push({ x0:x0, x1:x1, y0:BOT_Y0, y1:BOT_Y1, name:def.bot[r][0], kind:def.bot[r][1], band:1 });
    carve(x0, x1, BOT_Y0, BOT_Y1, rooms.length - 1);
  }
  // corridor
  for (y = COR_Y0; y <= COR_Y1; y++)
    for (x = 1; x <= GW - 2; x++){ tiles[idx(x, y)] = T_FLOOR; roomId[idx(x, y)] = 8; }
  rooms.push({ x0:1, x1:GW - 2, y0:COR_Y0, y1:COR_Y1, name:'MAIN CORRIDOR', kind:'corridor', band:2 });

  // doors onto corridor (2 wide)
  var doors = [];
  for (r = 0; r < 4; r++){
    x0 = ROOMX[r][0]; x1 = ROOMX[r][1];
    var dx = ((x0 + x1) / 2) | 0;
    tiles[idx(dx, WALL_TOP)] = T_DOOR; tiles[idx(dx + 1, WALL_TOP)] = T_DOOR;
    doors.push({ x:dx, y:WALL_TOP, room:r * 2, w:2 });
    tiles[idx(dx, WALL_BOT)] = T_DOOR; tiles[idx(dx + 1, WALL_BOT)] = T_DOOR;
    doors.push({ x:dx, y:WALL_BOT, room:r * 2 + 1, w:2 });
  }
  // interior doors between neighbouring rooms (keeps every room double-exit)
  for (i = 0; i < DIVX.length; i++){
    tiles[idx(DIVX[i], 6)] = T_DOOR; tiles[idx(DIVX[i], 7)] = T_DOOR;
    tiles[idx(DIVX[i], 24)] = T_DOOR; tiles[idx(DIVX[i], 25)] = T_DOOR;
  }
  // glass fronts on containment rooms
  for (r = 0; r < 4; r++){
    var kt = def.top[r][1], kb = def.bot[r][1];
    x0 = ROOMX[r][0]; x1 = ROOMX[r][1];
    if (kt === 'test' || kt === 'cage')
      for (x = x0 + 2; x <= x1 - 2; x++) if (tiles[idx(x, WALL_TOP)] === T_WALL) tiles[idx(x, WALL_TOP)] = T_GLASS;
    if (kb === 'test' || kb === 'cage')
      for (x = x0 + 2; x <= x1 - 2; x++) if (tiles[idx(x, WALL_BOT)] === T_WALL) tiles[idx(x, WALL_BOT)] = T_GLASS;
  }
  // elevators
  var s, sh;
  for (s = 0; s < SHAFTS.length; s++){
    sh = SHAFTS[s];
    for (y = sh.y0; y <= sh.y1; y++)
      for (x = sh.x0; x <= sh.x1; x++) tiles[idx(x, y)] = T_ELEV;
  }
  // vents
  var ventsHere = [];
  for (i = 0; i < VENT_POS.length; i++){
    x = VENT_POS[i][0]; y = VENT_POS[i][1];
    tiles[idx(x, y)] = T_VENT;
    ventsHere.push(VENTS.length);
    VENTS.push({ f:f, tx:x, ty:y, px:x * TILE + 8, py:y * TILE + 8, links:[] });
  }
  // stations
  var stations = [];
  for (i = 0; i < STATION_POS[f].length; i++){
    x = STATION_POS[f][i][0]; y = STATION_POS[f][i][1];
    tiles[idx(x, y)] = T_STATION;
    stations.push({ f:f, tx:x, ty:y, px:x * TILE + 8, py:y * TILE + 8, stock:5, on:true, id:f * 2 + i });
  }
  // hide spots, 2 per room
  var hides = [];
  for (r = 0; r < rooms.length - 1; r++){
    var rm = rooms[r];
    var spots = [[rm.x0 + 1, rm.y0], [rm.x1 - 1, rm.y1]];
    for (i = 0; i < spots.length; i++){
      x = spots[i][0]; y = spots[i][1];
      if (tiles[idx(x, y)] === T_FLOOR){
        tiles[idx(x, y)] = T_HIDE;
        hides.push({ f:f, tx:x, ty:y, px:x * TILE + 8, py:y * TILE + 8, kind:(i === 0 ? 'locker' : 'desk') });
      }
    }
  }
  // props: horizontal rows with aisles, never near doors/features
  function nearFeature(px, py){
    for (var yy = py - 1; yy <= py + 1; yy++)
      for (var xx = px - 1; xx <= px + 1; xx++){
        if (!inb(xx, yy)) continue;
        var t = tiles[idx(xx, yy)];
        if (t === T_DOOR || t === T_VENT || t === T_ELEV || t === T_STATION || t === T_HIDE) return true;
      }
    return false;
  }
  for (r = 0; r < rooms.length - 1; r++){
    var room = rooms[r];
    var pid = PROP_FOR[room.kind] || 'p5';
    var pnum = parseInt(pid.charAt(1), 10);
    for (y = room.y0 + 1; y <= room.y1 - 1; y++){
      if ((y - room.y0) % 3 !== 1) continue;
      for (x = room.x0 + 1; x <= room.x1 - 1; x++){
        if ((x - room.x0) % 5 === 0) continue;
        if (tiles[idx(x, y)] !== T_FLOOR) continue;
        if (nearFeature(x, y)) continue;
        tiles[idx(x, y)] = T_PROP;
        props[idx(x, y)] = pnum;
      }
    }
  }
  // ceiling lights
  var lights = [];
  for (x = 4; x < GW - 3; x += 7) lights.push({ px:x * TILE + 8, py:15 * TILE + 8, r:78, on:1, ph:hash2(x, f) * 6.28 });
  for (r = 0; r < rooms.length - 1; r++){
    var rm2 = rooms[r];
    lights.push({ px:(rm2.x0 + 3) * TILE + 8, py:(rm2.y0 + 2) * TILE + 8, r:70, on:1, ph:hash2(rm2.x0, rm2.y0 + f) * 6.28 });
    lights.push({ px:(rm2.x1 - 3) * TILE + 8, py:(rm2.y1 - 2) * TILE + 8, r:70, on:1, ph:hash2(rm2.x1, rm2.y1 + f) * 6.28 });
  }
  // emergency lamps (red, only lit once the alarm is running)
  var emer = [];
  for (x = 7; x < GW - 5; x += 12){
    emer.push({ px:x * TILE + 8, py:WALL_TOP * TILE + 12, r:64 });
    emer.push({ px:(x + 5) * TILE + 8, py:WALL_BOT * TILE + 4, r:64 });
  }

  var fl = { tiles:tiles, props:props, roomId:roomId, rooms:rooms, doors:doors, hides:hides,
             stations:stations, vents:ventsHere, lights:lights, emer:emer, name:def.name,
             tint:def.tint, canvas:null, mini:null, reach:null };
  FLOORS[f] = fl;

  // reachability from corridor
  var reach = new Uint8Array(GW * GH);
  var stack = [idx(28, 15)];
  reach[idx(28, 15)] = 1;
  while (stack.length){
    var n = stack.pop();
    var nx = n % GW, ny = (n / GW) | 0;
    var nb = [[nx + 1, ny], [nx - 1, ny], [nx, ny + 1], [nx, ny - 1]];
    for (i = 0; i < 4; i++){
      var ax = nb[i][0], ay = nb[i][1];
      if (!inb(ax, ay)) continue;
      var ii = idx(ax, ay);
      if (reach[ii]) continue;
      if (isSolidT(tiles[ii])) continue;
      reach[ii] = 1;
      stack.push(ii);
    }
  }
  fl.reach = reach;
  renderFloorCanvas(f);
  renderMini(f);
}

function renderFloorCanvas(f){
  var fl = FLOORS[f];
  var c = mkc(WW, WH), g = cx2(c);
  var x, y, t, i;
  g.fillStyle = '#08090b'; g.fillRect(0, 0, WW, WH);
  for (y = 0; y < GH; y++){
    for (x = 0; x < GW; x++){
      t = fl.tiles[idx(x, y)];
      var px = x * TILE, py = y * TILE;
      var h = hash2(x + f * 31, y);
      if (t === T_WALL){
        g.fillStyle = h > 0.5 ? '#232830' : '#1f242b';
        g.fillRect(px, py, TILE, TILE);
        g.fillStyle = '#2c333d'; g.fillRect(px, py, TILE, 2);
        g.fillStyle = '#12161a'; g.fillRect(px, py + TILE - 2, TILE, 2);
        if (h > 0.86){ g.fillStyle = '#3a424d'; g.fillRect(px + 3, py + 5, 10, 1); }
        if (h < 0.06){ g.fillStyle = '#4a1418'; g.fillRect(px + 2, py + 6, 5, 3); }
      } else if (t === T_GLASS){
        g.fillStyle = '#1a2028'; g.fillRect(px, py, TILE, TILE);
        g.fillStyle = 'rgba(140,190,220,0.16)'; g.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
        g.fillStyle = 'rgba(190,230,255,0.22)'; g.fillRect(px + 2, py + 2, 2, TILE - 5);
        g.fillStyle = '#2c333d'; g.fillRect(px, py, TILE, 2); g.fillRect(px, py + TILE - 2, TILE, 2);
      } else {
        // floor base
        var base = (fl.roomId[idx(x, y)] === 8) ? '#15181d' : '#111418';
        g.fillStyle = base; g.fillRect(px, py, TILE, TILE);
        g.fillStyle = h > 0.5 ? 'rgba(255,255,255,0.022)' : 'rgba(0,0,0,0.14)';
        g.fillRect(px, py, TILE, TILE);
        g.fillStyle = 'rgba(0,0,0,0.30)';
        g.fillRect(px, py + TILE - 1, TILE, 1); g.fillRect(px + TILE - 1, py, 1, TILE);
        if (h > 0.965){ g.fillStyle = 'rgba(90,20,22,0.5)'; g.fillRect(px + 4, py + 5, 6, 4); }
        if (t === T_DOOR){
          g.fillStyle = '#1b1f25'; g.fillRect(px, py, TILE, TILE);
          g.fillStyle = '#333b45'; g.fillRect(px, py, TILE, 3);
          g.fillStyle = '#2a3038'; g.fillRect(px, py + TILE - 3, TILE, 3);
          g.fillStyle = 'rgba(220,170,60,0.10)'; g.fillRect(px + 2, py + 4, TILE - 4, TILE - 8);
        }
        if (t === T_ELEV){
          g.fillStyle = '#191d23'; g.fillRect(px, py, TILE, TILE);
          g.fillStyle = '#2b323b'; g.fillRect(px, py, TILE, 1); g.fillRect(px, py + TILE - 1, TILE, 1);
          g.fillStyle = 'rgba(120,180,220,0.07)'; g.fillRect(px + 2, py + 2, TILE - 4, TILE - 4);
        }
        if (t === T_PROP) g.drawImage(SPR['p' + (fl.props[idx(x, y)] || 5)], px, py);
        if (t === T_HIDE){
          var hs = null;
          for (i = 0; i < fl.hides.length; i++) if (fl.hides[i].tx === x && fl.hides[i].ty === y){ hs = fl.hides[i]; break; }
          g.drawImage(hs && hs.kind === 'desk' ? SPR.p6 : SPR.locker, px, py);
        }
        if (t === T_VENT) g.drawImage(SPR.vent, px, py);
      }
    }
  }
  // room labels, faint
  for (i = 0; i < fl.rooms.length - 1; i++){
    var rm = fl.rooms[i];
    txt(g, rm.name, ((rm.x0 + rm.x1) / 2) * TILE + 8, rm.y0 * TILE + 3, 7, 'rgba(150,170,190,0.13)', 'center');
  }
  txt(g, fl.name, 28 * TILE, 15 * TILE - 6, 8, 'rgba(150,170,190,0.10)', 'center');
  fl.canvas = c;
}

function renderMini(f){
  var fl = FLOORS[f];
  var c = mkc(GW, GH), g = cx2(c);
  for (var y = 0; y < GH; y++){
    for (var x = 0; x < GW; x++){
      var t = fl.tiles[idx(x, y)];
      var col;
      if (t === T_WALL) col = '#22262c';
      else if (t === T_GLASS) col = '#2c3a44';
      else if (t === T_PROP) col = '#191d22';
      else if (t === T_VENT) col = '#4a6a58';
      else if (t === T_ELEV) col = '#5a7a9a';
      else if (t === T_STATION) col = '#9a8a3a';
      else if (t === T_HIDE) col = '#3a4450';
      else if (t === T_DOOR) col = '#3d4550';
      else col = '#101318';
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  fl.mini = c;
}

function buildMap(){
  FLOORS.length = 0; VENTS.length = 0;
  for (var f = 0; f < NFLOORS; f++) buildFloor(f);
  // vent network: one link on the same floor, one to the floor above (wrapping)
  var per = VENT_POS.length;
  for (var i = 0; i < VENTS.length; i++){
    var f2 = (i / per) | 0, k = i % per;
    var sameFloor = f2 * per + ((k + 2) % per);
    var otherFloor = (((f2 + 1) % NFLOORS) * per) + k;
    VENTS[i].links = [sameFloor, otherFloor];
  }
  for (var s = 0; s < SHAFTS.length; s++){
    SHAFTS[s].at = 0; SHAFTS[s].state = 'idle'; SHAFTS[s].t = 0; SHAFTS[s].riders.length = 0;
  }
}

function roomNameAt(f, tx, ty){
  var rid = FLOORS[f].roomId[idx(tx, ty)];
  if (rid < 0) return FLOORS[f].name;
  return FLOORS[f].rooms[rid].name;
}
function floorLabel(f){ return FLOOR_DEFS[f].name; }

function walkableTile(f, tx, ty){
  var t = tileAt(f, tx, ty);
  return !isSolidT(t) && FLOORS[f].reach[idx(tx, ty)] === 1;
}
function nearestWalkable(f, tx, ty){
  if (walkableTile(f, tx, ty)) return { x:tx, y:ty };
  for (var r = 1; r <= 6; r++){
    for (var dy = -r; dy <= r; dy++){
      for (var dx = -r; dx <= r; dx++){
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        var nx = tx + dx, ny = ty + dy;
        if (inb(nx, ny) && walkableTile(f, nx, ny)) return { x:nx, y:ny };
      }
    }
  }
  return null;
}
function randomWalkable(f){
  for (var i = 0; i < 200; i++){
    var x = rint(1, GW - 2), y = rint(1, GH - 2);
    if (walkableTile(f, x, y)) return { x:x, y:y };
  }
  return { x:28, y:15 };
}

/* ============================================================
   PATHFINDING (A*, budgeted) + LINE OF SIGHT
   ============================================================ */
var _came = new Int32Array(GW * GH);
var _gsc  = new Float32Array(GW * GH);
var _stamp = new Int32Array(GW * GH);
var _closed = new Int32Array(GW * GH);
var _run = 1;
var HEAP_MAX = 6000;
var hIdx = new Int32Array(HEAP_MAX), hF = new Float32Array(HEAP_MAX), hN = 0;
var pathBudget = 3;

function hClear(){ hN = 0; }
function hPush(i, f){
  if (hN >= HEAP_MAX - 1) return false;
  var n = hN++;
  hIdx[n] = i; hF[n] = f;
  while (n > 0){
    var p = (n - 1) >> 1;
    if (hF[p] <= hF[n]) break;
    var ti = hIdx[p], tf = hF[p];
    hIdx[p] = hIdx[n]; hF[p] = hF[n];
    hIdx[n] = ti; hF[n] = tf;
    n = p;
  }
  return true;
}
function hPop(){
  var top = hIdx[0];
  hN--;
  if (hN > 0){
    hIdx[0] = hIdx[hN]; hF[0] = hF[hN];
    var n = 0;
    for (;;){
      var l = n * 2 + 1, r = l + 1, m = n;
      if (l < hN && hF[l] < hF[m]) m = l;
      if (r < hN && hF[r] < hF[m]) m = r;
      if (m === n) break;
      var ti = hIdx[m], tf = hF[m];
      hIdx[m] = hIdx[n]; hF[m] = hF[n];
      hIdx[n] = ti; hF[n] = tf;
      n = m;
    }
  }
  return top;
}

/* returns array of tile indices (goal-first order reversed to start->goal), or null */
function findPath(f, sx, sy, gx, gy, out){
  if (pathBudget <= 0) return null;
  pathBudget--;
  var tiles = FLOORS[f].tiles;
  if (!inb(sx, sy) || !inb(gx, gy)) return null;
  if (sx === gx && sy === gy){ out.length = 0; return out; }
  if (isSolidT(tiles[idx(gx, gy)])){
    var alt = nearestWalkable(f, gx, gy);
    if (!alt) return null;
    gx = alt.x; gy = alt.y;
  }
  var start = idx(sx, sy), goal = idx(gx, gy);
  _run++;
  hClear();
  _stamp[start] = _run; _gsc[start] = 0; _came[start] = -1; _closed[start] = 0;
  hPush(start, Math.abs(sx - gx) + Math.abs(sy - gy));
  var expanded = 0, MAXEXP = 1400;
  while (hN > 0){
    var cur = hPop();
    if (_closed[cur] === _run) continue;
    _closed[cur] = _run;
    if (cur === goal){
      out.length = 0;
      var n = cur;
      while (n !== -1 && n !== start){ out.push(n); n = _came[n]; }
      out.reverse();
      return out;
    }
    if (++expanded > MAXEXP) break;
    var cxx = cur % GW, cyy = (cur / GW) | 0;
    for (var d = 0; d < 4; d++){
      var nx = cxx + (d === 0 ? 1 : d === 1 ? -1 : 0);
      var ny = cyy + (d === 2 ? 1 : d === 3 ? -1 : 0);
      if (!inb(nx, ny)) continue;
      var ni = idx(nx, ny);
      var t = tiles[ni];
      if (isSolidT(t)) continue;
      if (_closed[ni] === _run) continue;
      var step = 1;
      if (t === T_PROP) step = 4;
      var ng = _gsc[cur] + step;
      if (_stamp[ni] === _run && _gsc[ni] <= ng) continue;
      _stamp[ni] = _run; _gsc[ni] = ng; _came[ni] = cur;
      hPush(ni, ng + Math.abs(nx - gx) + Math.abs(ny - gy));
    }
  }
  return null;
}

function hasLOS(f, x0, y0, x1, y1){
  var dx = x1 - x0, dy = y1 - y0;
  var len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return true;
  var steps = Math.min(64, Math.ceil(len / 6));
  var sx = dx / steps, sy = dy / steps;
  var x = x0, y = y0;
  var tiles = FLOORS[f].tiles;
  for (var i = 0; i < steps; i++){
    x += sx; y += sy;
    var tx = (x / TILE) | 0, ty = (y / TILE) | 0;
    if (!inb(tx, ty)) return false;
    if (blocksLOS(tiles[idx(tx, ty)])) return false;
  }
  return true;
}

var ents = [], player = null, entSeq = 0;

function mkEnt(team, f, px, py, opts){
  opts = opts || {};
  var st = STATS[team];
  var e = {
    id: entSeq++, team:team, isPlayer:false, temp:!!opts.temp, life: opts.life || 0,

    state:'active',            /* active | down | dead */
    mode:'normal',             /* normal | hide | nap | vent | elev | feed */
    modeT:0, ventTo:-1, ventFrom:-1, shaft:-1,
    inv:[], atkCd:0, abilCd:0, buffT:0, hurtT:0, revealT:0, spotT:0,
    anim:0, animT:0, moving:false, running:false, stepT:0, noiseT:0,
    barrCd:0, feedT:0, lastHitBy:-1,
    ai:{ st:'patrol', tx:0, ty:0, path:[], pi:0, pathT:0, thinkT:Math.random() * 0.3, losT:0,
         target:-1, seenX:0, seenY:0, seenF:-1, seenT:0, wanderT:0, transit:null, hideT:0, panic:0 }
  };

function aliveTeam(team, includeTemp){
  var n = 0;
  for (var i = 0; i < ents.length; i++){
    var e = ents[i];
    if (e.team !== team || e.state !== 'active') continue;
    if (!includeTemp && e.temp) continue;
    n++;
  }
  return n;
}
function firstAlive(team){
  for (var i = 0; i < ents.length; i++) if (ents[i].team === team && ents[i].state === 'active') return ents[i];
  return null;
}

function entRadius(e){ return e.team === 'rabbit' ? 6 : 5; }

function collides(f, x, y, r){
  var tiles = FLOORS[f].tiles;
  var x0 = ((x - r) / TILE) | 0, x1 = ((x + r) / TILE) | 0;
  var y0 = ((y - r) / TILE) | 0, y1 = ((y + r) / TILE) | 0;
  for (var ty = y0; ty <= y1; ty++)
    for (var tx = x0; tx <= x1; tx++){
      if (!inb(tx, ty)) return true;
      if (isSolidT(tiles[idx(tx, ty)])) return true;
    }
  return false;
}

function moveEnt(e, dx, dy){
  var r = entRadius(e);
  if (dx !== 0){
    if (!collides(e.f, e.x + dx, e.y, r)) e.x += dx;
    else {
      /* slide along a corner */
      if (!collides(e.f, e.x + dx, e.y - 2, r)) { e.x += dx; e.y -= 2; }
      else if (!collides(e.f, e.x + dx, e.y + 2, r)) { e.x += dx; e.y += 2; }
    }
  }
  if (dy !== 0){
    if (!collides(e.f, e.x, e.y + dy, r)) e.y += dy;
    else {
      if (!collides(e.f, e.x - 2, e.y + dy, r)) { e.y += dy; e.x -= 2; }
      else if (!collides(e.f, e.x + 2, e.y + dy, r)) { e.y += dy; e.x += 2; }
    }
  }
  e.x = clamp(e.x, TILE, WW - TILE);
  e.y = clamp(e.y, TILE, WH - TILE);
}

/* edge case: shoved into geometry -> pop out to the nearest open tile */
function unstick(e){
  if (!collides(e.f, e.x, e.y, entRadius(e))) return;
  var tx = (e.x / TILE) | 0, ty = (e.y / TILE) | 0;
  var w = nearestWalkable(e.f, tx, ty);
  if (w){ e.x = w.x * TILE + 8; e.y = w.y * TILE + 8; }
}

function setDirFromVec(e, dx, dy){
  if (dx === 0 && dy === 0) return;
  e.ang = Math.atan2(dy, dx);
  if (Math.abs(dx) > Math.abs(dy)) e.dir = dx > 0 ? 3 : 2;
  else e.dir = dy > 0 ? 0 : 1;
}

function entSprite(e){
  var set = e.team === 'rabbit' ? (e.temp ? 'rabClone' : 'rab') : (e.temp ? 'sciBackup' : 'sci');
  if (e.team === 'rabbit'){
    if (e.state === 'down') return SPR[set + 'Down'];
    if (e.mode === 'nap') return SPR[set + 'Nap'];
    if (e.atkCd > 0.35) return SPR[set + 'Atk'];
  } else {
    if (e.state === 'dead') return SPR.corpse;
  }
  return SPR[set][e.dir][e.anim & 3];
}
