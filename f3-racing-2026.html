/* ---------- 18. WORLD RENDER ---------- */
/* Gradients are objects: building one per viewport per frame meant 2 allocations
   every frame in split-screen. Viewport geometry only changes with the layout,
   so cache by geometry. */
var vignetteCache={};
/* cull bounds for the current viewport. Module-scope so renderView does not build
   a fresh closure per viewport per frame (that is twice a frame in split-screen). */
var _vx0=0,_vy0=0,_vx1=0,_vy1=0;
function vis(x,y){ return x>_vx0&&x<_vx1&&y>_vy0&&y<_vy1; }
function nightVignette(vp){
  var k=vp.x+'_'+vp.y+'_'+vp.w+'_'+vp.h;
  var g=vignetteCache[k];
  if(!g){
    g=ctx.createRadialGradient(vp.x+vp.w/2,vp.y+vp.h/2,vp.h*0.18,vp.x+vp.w/2,vp.y+vp.h/2,vp.h*0.78);
    g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(2,4,14,0.55)');
    vignetteCache[k]=g;
  }
  return g;
}
function renderView(vp, car, race, isSecond){
  var tr=race.tr;
  var shake=race.shake*(save.settings.shake?1:0);
  var sx2=(Math.random()-0.5)*shake, sy2=(Math.random()-0.5)*shake;
  var lookAhead = car.lookBack? -1 : 1;
  var camX=Math.round(car.x + car.vx*0.30*lookAhead - vp.w/2 + sx2);
  var camY=Math.round(car.y + car.vy*0.30*lookAhead - vp.h/2 + sy2);
  camX=clamp(camX, tr.bx, tr.bx+tr.bw-vp.w);
  camY=clamp(camY, tr.by, tr.by+tr.bh-vp.h);

  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x,vp.y,vp.w,vp.h); ctx.clip();
  // baked circuit
  ctx.drawImage(tr.world.c, camX-tr.bx, camY-tr.by, vp.w, vp.h, vp.x, vp.y, vp.w, vp.h);
  ctx.translate(vp.x-camX, vp.y-camY);

  _vx0=camX-40; _vy0=camY-40; _vx1=camX+vp.w+40; _vy1=camY+vp.h+40;

  // animated crowd flicker on the stands
  var tnow=race.time;
  for(var s=0;s<tr.standSpots.length;s+=1){
    var sp=tr.standSpots[s];
    if(!vis(sp.x,sp.y)) continue;
    ctx.save(); ctx.translate(sp.x,sp.y); ctx.rotate(sp.a);
    for(var cbit=0;cbit<7;cbit++){
      var ph=Math.sin(tnow*5+cbit*1.7+s)*0.5+0.5;
      if(ph>0.55){
        ctx.fillStyle=tr.theme.crowd;
        ctx.fillRect(-18+cbit*5, -10+((cbit+s)%3)*6, 3,3);
      }
    }
    ctx.restore();
  }
  // oil slicks
  for(var o=0;o<race.oils.length;o++){
    var ol=race.oils[o];
    if(!vis(ol.x,ol.y)) continue;
    ctx.fillStyle='rgba(40,25,80,0.72)';
    ctx.beginPath(); ctx.ellipse(ol.x,ol.y,ol.r,ol.r*0.72,0,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(150,120,255,0.5)';
    ctx.fillRect(ol.x-4,ol.y-3,5,2);
  }
  // item pads
  for(var p=0;p<tr.pads.length;p++){
    var pad=tr.pads[p];
    if(!vis(pad.x,pad.y)) continue;
    if(pad.t>0){
      ctx.globalAlpha=0.25;
      ctx.drawImage(props.pad,(pad.x-10)|0,(pad.y-10)|0);
      ctx.globalAlpha=1;
    } else {
      var bob=Math.sin(tnow*4+p)*1.5;
      ctx.drawImage(props.pad,(pad.x-10)|0,(pad.y-10+bob)|0);
      ctx.fillStyle='rgba(255,210,63,0.20)';
      ctx.fillRect(pad.x-12,pad.y-12+bob,24,24);
    }
  }
  // particles
  for(var q=0;q<PMAX;q++){
    var pa=parts[q];
    if(pa.life<=0) continue;
    if(!vis(pa.x,pa.y)) continue;
    var al=clamp(pa.life/pa.max,0,1);
    ctx.globalAlpha=al;
    ctx.fillStyle=pa.col;
    ctx.fillRect(pa.x-pa.size/2|0, pa.y-pa.size/2|0, pa.size, pa.size);
  }
  ctx.globalAlpha=1;
  // pit crews
  for(var pc2=0;pc2<race.cars.length;pc2++){
    var pcar=race.cars[pc2];
    if(pcar.pitPhase!=='stopped') continue;
    if(!vis(pcar.x,pcar.y)) continue;
    drawPitCrew(pcar,tr);
  }
  // cars
  for(var c=race.order.length-1;c>=0;c--){
    var o2=race.order[c];
    if(!vis(o2.x,o2.y)) continue;
    drawCar(o2, race, car);
  }
  // missiles
  for(var m=0;m<race.missiles.length;m++){
    var mi=race.missiles[m];
    if(!vis(mi.x,mi.y)) continue;
    ctx.save(); ctx.translate(mi.x,mi.y); ctx.rotate(mi.a);
    ctx.fillStyle='#e8eef8'; ctx.fillRect(-6,-2,10,4);
    ctx.fillStyle='#ff4d2e'; ctx.fillRect(4,-2,3,4);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(-9,-1,3,2);
    ctx.restore();
  }
  ctx.restore();

  // weather / time-of-day overlays, viewport space
  ctx.save();
  ctx.beginPath(); ctx.rect(vp.x,vp.y,vp.w,vp.h); ctx.clip();
  if(tr.weather==='RAIN'){
    ctx.strokeStyle='rgba(180,215,255,0.30)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(var r2=0;r2<70;r2++){
      var rx=(((r2*97+ (tnow*420))%(vp.w+60))|0)-30+vp.x;
      var ry=(((r2*151+(tnow*760))%(vp.h+60))|0)-30+vp.y;
      ctx.moveTo(rx,ry); ctx.lineTo(rx-4,ry+11);
    }
    ctx.stroke();
  }
  if(tr.time==='NIGHT'){
    ctx.fillStyle=nightVignette(vp);
    ctx.fillRect(vp.x,vp.y,vp.w,vp.h);
  }
  // speed lines
  var spd=len2(car.vx,car.vy);
  if(spd>250){
    var al2=clamp((spd-250)/220,0,0.5);
    ctx.strokeStyle='rgba(255,255,255,'+al2*0.5+')'; ctx.lineWidth=2;
    ctx.beginPath();
    for(var sl=0;sl<10;sl++){
      var f=(sl/10+ (tnow*2.2)%1)%1;
      var ex=vp.x+vp.w/2 + Math.cos(sl*2.1)*vp.w*0.55*(0.5+f*0.6);
      var ey=vp.y+vp.h/2 + Math.sin(sl*2.1)*vp.h*0.55*(0.5+f*0.6);
      ctx.moveTo(ex,ey); ctx.lineTo(ex-car.vx*0.05, ey-car.vy*0.05);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawCar(car, race, viewer){
  var f=frameFor(car.angle);
  var img=car.sprites[f];
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.fillRect(car.x-9, car.y-6+3, 18, 12);
  if(car.dnf) ctx.globalAlpha=0.6;
  ctx.drawImage(img, (car.x-FRAME/2)|0, (car.y-FRAME/2)|0);
  ctx.globalAlpha=1;
  // shield bubble
  if(car.shield>0){
    ctx.strokeStyle='rgba(63,230,255,'+(0.4+Math.sin(race.time*12)*0.2)+')';
    ctx.lineWidth=2; ctx.beginPath(); ctx.arc(car.x,car.y,15,0,6.283); ctx.stroke();
  }
  if(car.slow>0){
    ctx.fillStyle='rgba(255,243,94,0.5)';
    for(var z=0;z<3;z++) ctx.fillRect(car.x-8+z*7, car.y-14-Math.sin(race.time*14+z)*3, 3,3);
  }
  // marker chevron
  var isViewer=(car===viewer);
  ctx.fillStyle= isViewer? '#ffffff' : car.c1;
  var bob=Math.sin(race.time*4+car.gridPos)*1.2;
  ctx.beginPath();
  ctx.moveTo(car.x, car.y-19+bob);
  ctx.lineTo(car.x-4, car.y-25+bob);
  ctx.lineTo(car.x+4, car.y-25+bob);
  ctx.closePath(); ctx.fill();
  if(isViewer){
    ctx.fillStyle='#101520';
    ctx.fillRect(car.x-1,car.y-24+bob,2,2);
  }
  if(car.blue){
    ctx.fillStyle='#3f7cff';
    ctx.fillRect(car.x-12,car.y-26+bob,5,5);
  }
  if(car.msgT>0 && car.msg){
    txt(car.msg, car.x, car.y-40, 8, '#ffd23f','center',true);
  }
}
function drawPitCrew(car,tr){
  var f=(Math.floor(car.pitAnim*9)%2);
  var a=car.angle;
  var nx2=-Math.sin(a), ny2=Math.cos(a);
  var tx2=Math.cos(a), ty2=Math.sin(a);
  for(var i=0;i<4;i++){
    var lx2=(i<2?9:-9), ly2=(i%2?12:-12);
    var px2=car.x+tx2*lx2+nx2*ly2, py2=car.y+ty2*lx2+ny2*ly2;
    ctx.drawImage(props.crew[(f+i)%2],(px2-4)|0,(py2-5)|0);
  }
  // jack man at the front
  ctx.drawImage(props.crew[f],(car.x+tx2*18-4)|0,(car.y+ty2*18-5)|0);
  // lollipop / timer
  var left=Math.max(0,car.pitTimer);
  ctx.fillStyle='rgba(8,12,22,0.85)';
  ctx.fillRect(car.x-16,car.y-32,32,12);
  txt(left.toFixed(1)+'s', car.x, car.y-31, 9, left<0.6?'#7ce827':'#ffd23f','center',true);
}

function sectorCol(car,race,i){
  var t=car.sectorTimes[i];
  if(t==null) return '#3a4a60';
  if(race.bestSector[i]!=null && t<=race.bestSector[i]+0.0005) return '#c56bff';
  if(car.bestSectors[i]!=null && t<=car.bestSectors[i]+0.0005) return '#7ce827';
  return '#ffd23f';
}

  var rows=compact?7:10;
  var twx=X+W-(compact?116:140), twy=mmy+mmh+10;
  panel(twx,twy,compact?110:134,rows*13+16,0.72);
  txt('LIVE TIMING',twx+5,twy+4,8,'#8fb6dd',null,true);
  var startI=0;
  var myI=0;
  for(var t2=0;t2<race.order.length;t2++) if(race.order[t2]===car) myI=t2;
  if(myI>=rows) startI=Math.min(myI-rows+1, race.order.length-rows);
  for(var r=0;r<rows;r++){
    var idx=startI+r;
    if(idx>=race.order.length) break;
    var d2=race.order[idx];
    var ry=twy+15+r*13;
    if(d2===car){ ctx.fillStyle='rgba(255,210,63,0.20)'; ctx.fillRect(twx+2,ry-1,(compact?106:130),12); }
    ctx.fillStyle=d2.c1; ctx.fillRect(twx+4,ry+1,3,9);
    txt(''+(idx+1),twx+10,ry,9,d2.dnf?'#7a8497':'#e8eef8');
    txt(d2.ab,twx+26,ry,9,d2.dnf?'#7a8497':'#ffffff',null,d2===car);
    var lbl;
    if(d2.dnf) lbl='DNF';
    else if(d2.finished) lbl='FIN';
    else if(idx===0) lbl='LDR';
    else lbl=fmtGap(d2.gap);
    txt(lbl,twx+(compact?104:128),ry,9,d2.inPit?'#ffd23f':'#9fb8d4','right');
    if(d2.penalty>0) txt('+'+d2.penalty,twx+(compact?68:84),ry,8,'#ff4d2e','right');
  }

  // ---------- pit entry prompt: which way to the pit lane, and when
  var cxm=X+W/2;
  if(!car.inPit && !car.finished && !hasTwoCompounds(car) && race.phase==='race'){
    var toGate=((tr.pitGateIn-car.idx)%tr.N+tr.N)%tr.N;
    if(toGate<Math.floor(tr.N*0.14)){
      var flash=(Math.sin(race.time*9)*0.5+0.5);
      ctx.fillStyle='rgba(255,210,63,'+(0.55+flash*0.4)+')';
      ctx.fillRect(cxm-84,Y+H-146,168,22);
      // the left normal points at the driver's right in screen space, so
      // pitSide < 0 means the pit lane is off to the driver's left
      var leftSide = (tr.pitSide<0);
      txt((leftSide?'<< ':'')+'PIT LANE  '+Math.max(1,Math.round(toGate*SPACING))+'m'+(leftSide?'':' >>'),
          cxm,Y+H-141,12,'#101520','center',true);
    }
  }
  // ---------- flags and warnings
  if(car.blue){
    ctx.fillStyle='rgba(63,124,255,0.85)'; ctx.fillRect(cxm-70,Y+H-92,140,20);
    txt('BLUE FLAG - LET THEM BY',cxm,Y+H-87,10,'#ffffff','center',true);
  }
  if(car.wrongWay>0.6){
    ctx.fillStyle='rgba(255,60,40,'+(0.5+Math.sin(race.time*14)*0.3)+')';
    ctx.fillRect(cxm-70,Y+70,140,22);
    txt('WRONG WAY',cxm,Y+76,13,'#ffffff','center',true);
  }
  if(car.penTimer>0){
    ctx.fillStyle='rgba(200,30,20,0.9)'; ctx.fillRect(cxm-90,Y+46,180,20);
    txt(car.penMsg,cxm,Y+51,11,'#ffffff','center',true);
  }
  if(car.msgT>0 && car.msg){
    txt(car.msg,cxm,Y+H-118,12,'#ffd23f','center',true);
  }
  if(car.dnf){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(X,Y,W,H);
    txt('RETIRED',cxm,Y+H/2-20,26,'#ff4d2e','center',true);
    txt(car.dnfReason,cxm,Y+H/2+12,12,'#e8eef8','center');
  }
  // pit stop compound chooser
  if(car.pitPhase==='stopped'){
    var pw=190, px3=cxm-pw/2, py3=Y+H/2-46;
    panel(px3,py3,pw,86,0.88,'#ffd23f');
    txt('PIT STOP',cxm,py3+6,13,'#ffd23f','center',true);
    txt('CHOOSE TYRE  '+BIND[car.pnum-1].label.left+'/'+BIND[car.pnum-1].label.right,cxm,py3+22,8,'#8fb6dd','center');
    for(var cp=0;cp<COMPOUNDS.length;cp++){
      var C=COMPOUNDS[cp], selx=px3+22+cp*54;
      var sel=(C.id===car.pitChoice);
      if(sel){ ctx.fillStyle='rgba(255,210,63,0.22)'; ctx.fillRect(selx-16,py3+34,44,42); }
      drawTyreBadge(selx+6,py3+50,13,C,0);
      txt(C.name,selx+6,py3+66,7,sel?'#ffffff':'#8fb6dd','center',sel);
    }
    bar(px3+10,py3+80,pw-20,3, car.pitTimer/Math.max(0.01,car.pitTotal), '#ff4d2e');
  }
}

/* ---------- 20. START LIGHTS / GLOBAL RACE OVERLAY ---------- */
function drawRaceOverlay(race){
  if(race.phase==='grid'||race.phase==='lights'||(race.phase==='green'&&race.phaseT<1.2)){
    var n=5, bw=34, gap=8, totW=n*bw+(n-1)*gap;
    var x0=VW/2-totW/2, y0=26;
    panel(x0-12,y0-12,totW+24,64,0.8);
    for(var i=0;i<n;i++){
      var on = (race.phase==='lights'||race.phase==='grid') ? (i<race.lightCount) : false;
      var gx=x0+i*(bw+gap);
      ctx.fillStyle='#0a0d14'; ctx.fillRect(gx,y0,bw,40);
      ctx.strokeStyle='#2c3648'; ctx.strokeRect(gx+0.5,y0+0.5,bw-1,39);
      ctx.fillStyle= on? '#ff2a1a' : '#1a1f2b';
      ctx.beginPath(); ctx.arc(gx+bw/2,y0+13,9,0,6.283); ctx.fill();
      if(race.phase==='green'||race.phase==='race'){
        ctx.fillStyle='#00e070';
        ctx.beginPath(); ctx.arc(gx+bw/2,y0+29,9,0,6.283); ctx.fill();
      } else {
        ctx.fillStyle='#12241a';
        ctx.beginPath(); ctx.arc(gx+bw/2,y0+29,9,0,6.283); ctx.fill();
      }
    }
    var label = race.phase==='grid'? 'FORMATION' : (race.phase==='lights'? 'LIGHTS OUT WHEN THEY GO OUT' : 'GO GO GO');
    txt(label,VW/2,y0+46,11,race.phase==='green'?'#00e070':'#ffd23f','center',true);
  }
  if(race.msgT>0 && race.msg){
    var a=clamp(race.msgT,0,1);
    ctx.globalAlpha=a;
    panel(VW/2-160,VH-46,320,26,0.8);
    txt(race.msg,VW/2,VH-40,14,'#ffd23f','center',true);
    ctx.globalAlpha=1;
  }
  if(race.phase==='chequered'||race.phase==='done'){
    // chequered flag band
    for(var c=0;c<VW/12;c++){
      for(var r=0;r<2;r++){
        ctx.fillStyle=((c+r)%2)?'#f2f5fa':'#101520';
        ctx.fillRect(c*12,VH-14+r*7,12,7);
      }
    }
  }
}

var GAME={
  players:1,
  chassis:[0,1], livery:[0,3], tyre:['M','M'],
  circuit:0, mode:'single'
};
var screen='title', menuSel=0, screenT=0;
var race=null, paused=false, pauseSel=0;
var engines=[null,null];
var results=null, podiumT=0;

function requestPause(){ if(screen==='race'&&race&&race.phase!=='done') paused=true; }

function buildField(){
  var tr=getTrack(CIRCUITS[GAME.circuit].id);
  var cars=[], used={}, n=0;
  var FIELD=12;
  // players start toward the back so there is a race to run
  var playerSlots = GAME.players===2? [8,9] : [8];
  var aiIdx=0;
  for(var slot=0;slot<FIELD;slot++){
    var isP=playerSlots.indexOf(slot)>=0;
    var car;
    if(isP){
      var pn=playerSlots.indexOf(slot)+1;
      var lv=LIVERY[GAME.livery[pn-1]%LIVERY.length];
      car=makeCar({ name:'PLAYER '+pn, ab:'P'+pn, num:pn,
        c1:lv.c1,c2:lv.c2,c3:lv.c3, chassis:CHASSIS[GAME.chassis[pn-1]%CHASSIS.length],
        isPlayer:true, pnum:pn, tyre:GAME.tyre[pn-1], gridPos:slot });
    } else {
      var d=AI_ROSTER[aiIdx%AI_ROSTER.length]; aiIdx++;
      car=makeCar({ name:d.name, ab:d.ab, c1:d.c1,c2:d.c2,c3:d.c3,
        chassis:CHASSIS[(slot+2)%CHASSIS.length], pers:d.pers, skill:d.skill,
        tyre:(slot%3===0?'S':(slot%3===1?'M':'H')), gridPos:slot });
    }
    car.gridPos=slot;
    placeOnGrid(car,tr,slot);
    cars.push(car);
  }
  return {tr:tr, cars:cars};
}
function startRace(){
  // fresh circuit image each race so skid marks do not pile up over a season
  var id=CIRCUITS[GAME.circuit].id;
  if(trackCache[id]) delete trackCache[id];
  var f=buildField();
  race=new Race({track:f.tr, cars:f.cars, players:GAME.players, laps:f.tr.laps});
  for(var i=0;i<race.cars.length;i++){
    race.cars[i].lapStart=0;
    race.cars[i].pos=i+1;
  }
  race.updateOrder();
  screen='race'; paused=false; screenT=0;
  results=null;
  Audio_unlock();
  crowdStart(0.045);
  for(var p=0;p<2;p++){
    if(engines[p]){ engines[p].kill(); engines[p]=null; }
  }
}
function endRaceToResults(){
  killEngines();          // otherwise the engine voices drone on through results/podium/title
  results=race.result;
  // championship points
  if(GAME.mode==='champ' && save.champ){
    for(var i=0;i<results.length;i++){
      var c=results[i];
      var key=c.isPlayer? ('P'+c.pnum) : c.name;
      var st=findStanding(key);
      if(st) st.pts+=c.points;
    }
    save.champ.round++;
    writeSave();
  }
  screen='results'; screenT=0; menuSel=0;
  crowdLevel(0.09);
}
function findStanding(key){
  if(!save.champ) return null;
  for(var i=0;i<save.champ.standings.length;i++) if(save.champ.standings[i].key===key) return save.champ.standings[i];
  return null;
}
function newChampionship(){
  var st=[];
  for(var p=1;p<=GAME.players;p++){
    var lv=LIVERY[GAME.livery[p-1]%LIVERY.length];
    st.push({key:'P'+p, name:'PLAYER '+p, pts:0, c1:lv.c1, isPlayer:true});
  }
  var slots=GAME.players===2?[8,9]:[8];
  var aiIdx=0;
  for(var s=0;s<12;s++){
    if(slots.indexOf(s)>=0) continue;
    var d=AI_ROSTER[aiIdx%AI_ROSTER.length]; aiIdx++;
    st.push({key:d.name, name:d.name, pts:0, c1:d.c1, isPlayer:false});
  }
  save.champ={ round:0, standings:st, players:GAME.players };
  writeSave();
}

  if(MENU.back()) screen='title';
  if(MENU.ok()){
    SFX.select();
    var pick=items[menuSel];
    if(pick==='CONTINUE SEASON'){
      GAME.players=save.champ.players||1;
      GAME.circuit=Math.min(CIRCUITS.length-1, save.champ.round);
      if(save.champ.round>=CIRCUITS.length){ screen='standings'; }
      else { carselPlayer=1; menuSel=0; screen='carsel'; }
    } else if(pick==='NEW SEASON'){ save.champ=null; writeSave(); screen='players'; menuSel=0; }
    else if(pick==='STANDINGS'){ screen='standings'; }
    else screen='title';
  }
}

function updatePodium(dt){
  podiumT+=dt;
  if(podiumT>1.0 && (MENU.ok()||MENU.back())){
    SFX.select();
    crowdStop();
    if(GAME.mode==='champ'){
      if(save.champ && save.champ.round>=CIRCUITS.length) screen='champend';
      else screen='standings';
    } else { screen='title'; menuSel=0; }
  }
  if(podiumT<3.4 && Math.random()<dt*40){
    spawnP(rnd(200,760), -10, rnd(-30,30), rnd(60,130), 4.0,
           ['#ffd23f','#ff3fae','#3fe6ff','#7ce827'][Math.floor(Math.random()*4)],3,0,26);
  }
  updateParts(dt);
}
function drawPodium(){
  ctx.fillStyle='#0a0f1c'; ctx.fillRect(0,0,VW,VH);
  // crowd wall
  for(var r=0;r<7;r++){
    for(var c=0;c<48;c++){
      var ph=Math.sin(podiumT*4+c*0.7+r)*0.5+0.5;
      ctx.fillStyle= ph>0.5? 'rgba(230,240,255,0.35)':'rgba(120,150,190,0.22)';
      ctx.fillRect(c*20+ (r%2?6:0), 20+r*16, 12, 10);
    }
  }
  ctx.fillStyle='#121a2c'; ctx.fillRect(0,150,VW,VH-150);
  // replay-style slow camera drift
  var zoom=1.0+Math.sin(podiumT*0.5)*0.04;
  var panx=Math.sin(podiumT*0.35)*16;
  ctx.save();
  ctx.translate(VW/2+panx, 300);
  ctx.scale(zoom,zoom);
  var order=[1,0,2], heights=[86,58,42], xs=[-150,0,150];
  for(var i=0;i<3;i++){
    var slot=order[i];
    var c2=results? results[slot] : null;
    var px2=xs[i], h=heights[i];
    ctx.fillStyle= i===1? '#ffd23f' : (i===0? '#c8d0dc':'#c98a4b');
    ctx.fillRect(px2-64,0,128,h);
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(px2-64,0,128,6);
    txt(''+(slot+1),px2,h/2-10,22,'#101520','center',true);
    if(c2){
      var sp=c2.sprites[frameFor(-Math.PI/2)];
      var s2=2.4;
      ctx.drawImage(sp, px2-FRAME*s2/2, -FRAME*s2+6, FRAME*s2, FRAME*s2);
      txt(c2.name,px2,h+10,11,'#ffffff','center',true);
      txt(c2.points+' PTS',px2,h+26,10,'#ffd23f','center');
      if(i===1){
        var bob=Math.sin(podiumT*3)*2;
        ctx.drawImage(props.trophy, px2-7, -FRAME*s2-24+bob, 14,18);
      }
    }
  }
  ctx.restore();
  // confetti
  for(var q=0;q<PMAX;q++){
    var pa=parts[q];
    if(pa.life<=0) continue;
    ctx.globalAlpha=clamp(pa.life/pa.max,0,1);
    ctx.fillStyle=pa.col;
    ctx.fillRect(pa.x|0,pa.y|0,pa.size,pa.size);
  }
  ctx.globalAlpha=1;
  panel(VW/2-190,16,380,34,0.75);
  txt('PODIUM - '+race.tr.name,VW/2,25,16,'#ffd23f','center',true);
  if(podiumT>1.0) txt('ENTER TO CONTINUE',VW/2,VH-28,11,'#8fb6dd','center');
}

/* ---------- 24. PAUSE ---------- */
function drawPause(){
  ctx.fillStyle='rgba(4,7,14,0.78)'; ctx.fillRect(0,0,VW,VH);
  txt('PAUSED',VW/2,120,34,'#ffffff','center',true);
  var items=['RESUME','RESTART RACE','QUIT TO MENU'];
  menuList(items,380,220,pauseSel,16,34);
  txt('P OR ESC TO RESUME',VW/2,VH-40,10,'#5a7ba0','center');
}
function updatePause(dt){
  var items=['RESUME','RESTART RACE','QUIT TO MENU'];
  if(MENU.up()){ pauseSel=(pauseSel+items.length-1)%items.length; SFX.menu(); }
  if(MENU.down()){ pauseSel=(pauseSel+1)%items.length; SFX.menu(); }
  if(hit('KeyP')||hit('Escape')){ paused=false; }
  if(MENU.ok()){
    SFX.select();
    if(pauseSel===0) paused=false;
    else if(pauseSel===1){ paused=false; startRace(); }
    else { paused=false; crowdStop(); killEngines(); screen='title'; menuSel=0; }
    pauseSel=0;
  }
}
function killEngines(){
  for(var i=0;i<2;i++){ if(engines[i]){ engines[i].kill(); engines[i]=null; } }
}

/* ---------- 25. RACE SCREEN ---------- */
function updateRace(dt){
  race.update(dt);
  // engine audio
  if(audioReady){
    for(var p=1;p<=GAME.players;p++){
      var c=race.playerCar(p);
      if(!c) continue;
      if(!engines[p-1]) engines[p-1]=new EngineVoice();
      var load=c.throttle;
      var vol = c.dnf? 0 : (0.16 + load*0.13);
      engines[p-1].set(c.rpm, load, vol/GAME.players);
    }
    crowdLevel(0.035 + (race.phase==='race'?0.02:0) + race.shake*0.004);
  }
  if(race.phase==='done' && !results){ endRaceToResults(); }
}
/* viewports are fixed by the layout — build them once, not twice a frame */
var VP_FULL={x:0,y:0,w:VW,h:VH};
var VP_L={x:0,y:0,w:VW/2-1,h:VH};
var VP_R={x:VW/2+1,y:0,w:VW/2-1,h:VH};
function drawRace(){
  ctx.fillStyle='#05060c'; ctx.fillRect(0,0,VW,VH);
  if(GAME.players===2){
    var vp1=VP_L, vp2=VP_R;
    var c1=race.playerCar(1), c2=race.playerCar(2);
    renderView(vp1,c1,race,false); drawHUD(vp1,c1,race,true);
    renderView(vp2,c2,race,true);  drawHUD(vp2,c2,race,true);
    ctx.fillStyle='#0a0d14'; ctx.fillRect(VW/2-1,0,2,VH);
    ctx.fillStyle='#1fb6ff'; ctx.fillRect(VW/2-1,0,2,VH*0.02);
    txt('P1',6,VH-14,10,'#1fb6ff',null,true);
    txt('P2',VW/2+8,VH-14,10,'#ff3fae',null,true);
  } else {
    var vp=VP_FULL;
    var c=race.playerCar(1);
    renderView(vp,c,race,false);
    drawHUD(vp,c,race,false);
  }
  drawRaceOverlay(race);
}

/* ---------- 26. MAIN LOOP ---------- */
var STEP=1/120, accum=0, lastT=0, started=false;
function tick(dt){
  screenT+=dt;
  switch(screen){
    case 'title':    updateTitle(dt); break;
    case 'players':  updatePlayers(dt); break;
    case 'carsel':   updateCarSel(dt); break;
    case 'circuit':  updateCircuit(dt); break;
    case 'settings': updateSettings(dt); break;
    case 'controls': updateControls(dt); break;
    case 'champmenu':updateChampMenu(dt); break;
    case 'champstart':updateChampStart(dt); break;
    case 'standings':updateStandings(dt); break;
    case 'champend': updateChampEnd(dt); break;
    case 'results':  updateResults(dt); break;
    case 'podium':   updatePodium(dt); break;
    case 'race':
      if(paused) updatePause(dt);
      else {
        if(hit('KeyP')||hit('Escape')){ paused=true; pauseSel=0; }
        else updateRace(dt);
      }
      break;
  }
}
function draw(){
  switch(screen){
    case 'title':    drawTitle(); break;
    case 'players':  drawPlayers(); break;
    case 'carsel':   drawCarSel(); break;
    case 'circuit':  drawCircuit(); break;
    case 'settings': drawSettings(); break;
    case 'controls': drawControls(); break;
    case 'champmenu':drawChampMenu(); break;
    case 'champstart':drawChampStart(); break;
    case 'standings':drawStandings(); break;
    case 'champend': drawChampEnd(); break;
    case 'results':  drawResults(); break;
    case 'podium':   drawPodium(); break;
    case 'race':     drawRace(); if(paused) drawPause(); break;
  }
  if(!audioReady && screen!=='race'){
    txt('PRESS ANY KEY OR CLICK TO ENABLE SOUND',VW/2,VH-10,9,'#3a5a80','center');
  }
}
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT) lastT=now;
  var dt=(now-lastT)/1000;
  lastT=now;
  if(dt>0.25) dt=0.25;            // clamp after a backgrounded tab
  var steps=0;
  if(screen==='race' && !paused){
    accum+=dt;
    while(accum>=STEP && steps<10){ tick(STEP); accum-=STEP; steps++; }
    if(accum>STEP*10) accum=0;
  } else {
    accum=0;
    tick(Math.min(dt,0.05)); steps=1;
  }
  draw();
  // Only retire edge-triggered keys once an update has actually had a chance to
  // read them. On a display faster than the fixed step (144/165/240Hz) some
  // frames run zero steps, and clearing here regardless silently ate taps.
  if(steps>0){ clearHits(); pointer.click=false; }
}
function resize(){
  var availW=window.innerWidth, availH=window.innerHeight-34;
  var s=Math.min(availW/VW, availH/VH);
  if(s>=1) s=Math.floor(s*4)/4;
  if(s<0.25) s=0.25;
  cv.style.width=Math.round(VW*s)+'px';
  cv.style.height=Math.round(VH*s)+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
resize();
requestAnimationFrame(frame);
})();
