<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>F3 RACING 2026</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05060c;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;font-family:monospace;color:#eaf6ff;
       -webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:relative;line-height:0;}
  canvas{display:block;background:#05060c;image-rendering:pixelated;image-rendering:crisp-edges;
         box-shadow:0 0 0 2px #101a2e,0 0 44px rgba(40,170,255,.16);}
  #hint{position:absolute;left:0;right:0;bottom:-26px;text-align:center;font-size:11px;color:#3c5a80;
        letter-spacing:2px;line-height:1;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540"></canvas><div id="hint">F3 RACING 2026 &middot; TEAM 67</div></div>
<script>
"use strict";
(function(){
/* =====================================================================
   F3 RACING 2026 — Team 67
   Single file. No network. Everything drawn + synthesised at runtime.
   ===================================================================== */

/* ---------- 1. CORE UTILITIES ---------- */
var VW = 960, VH = 540;                 // internal (pixel-art) resolution
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function len2(x,y){ return Math.sqrt(x*x+y*y); }
function angDiff(a,b){ var d=(a-b)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
function fmtTime(t){
  if(t==null || t<0 || !isFinite(t)) return "--:--.---";
  var m=Math.floor(t/60), s=t-m*60;
  return m+":"+(s<10?"0":"")+s.toFixed(3);
}
function fmtShort(t){
  if(t==null || !isFinite(t)) return "--.---";
  var m=Math.floor(t/60), s=t-m*60;
  if(m>0) return m+":"+(s<10?"0":"")+s.toFixed(3);
  return s.toFixed(3);
}
function fmtGap(g){
  if(g==null||!isFinite(g)) return "--.-";
  if(g>=60){ var m=Math.floor(g/60); return "+"+m+":"+((g-m*60)<10?"0":"")+(g-m*60).toFixed(1); }
  return "+"+g.toFixed(1);
}
// deterministic-ish rng (own so the field is reproducible per race seed)
function RNG(seed){ this.s = (seed>>>0)||12345; }
RNG.prototype.next = function(){
  this.s ^= this.s<<13; this.s>>>=0;
  this.s ^= this.s>>17;
  this.s ^= this.s<<5;  this.s>>>=0;
  return this.s/4294967296;
};
RNG.prototype.range = function(a,b){ return a + this.next()*(b-a); };
RNG.prototype.pick = function(arr){ return arr[Math.floor(this.next()*arr.length)%arr.length]; };
var rngGlobal = new RNG(Date.now()&0xffffff);
function rnd(a,b){ return a + Math.random()*(b-a); }

function mkCanvas(w,h){
  var c=document.createElement('canvas'); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0);
  var x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  return {c:c,x:x,w:c.width,h:c.height};
}

/* ---------- 2. SAFE PERSISTENCE ---------- */
var SAVE_KEY = 'f3racing2026.save.v1';
var save = {
  bestLaps:{},          // circuitId -> {time, name}
  champ:null,           // {round, standings:{driverKey:{name,pts,color}}, cars:[], mode}
  settings:{ master:0.8, sfx:0.9, engine:0.7, assistSteer:true, assistStability:true, autoDRS:true, shake:true }
};
function loadSave(){
  try{
    var raw = window.localStorage ? window.localStorage.getItem(SAVE_KEY) : null;
    if(raw){
      var o=JSON.parse(raw);
      if(o && typeof o==='object'){
        if(o.bestLaps) save.bestLaps=o.bestLaps;
        if(o.champ) save.champ=o.champ;
        if(o.settings) for(var k in save.settings){ if(o.settings[k]!==undefined) save.settings[k]=o.settings[k]; }
      }
    }
  }catch(e){ /* storage blocked in sandboxed iframe — run without it */ }
}
function writeSave(){
  try{
    if(window.localStorage) window.localStorage.setItem(SAVE_KEY, JSON.stringify(save));
  }catch(e){ /* ignore */ }
}
loadSave();

/* ---------- 3. INPUT ---------- */
var BIND = [
  { name:'PLAYER 1', up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD',
    item:'KeyB', hand:'Space', drs:'KeyE', ers:'KeyQ', look:'KeyR',
    label:{up:'W',down:'S',left:'A',right:'D',item:'B',hand:'SPACE',drs:'E',ers:'Q',look:'R'} },
  // P2 deliberately avoids Control: with two players on one keyboard a held
  // Right-Ctrl turns P1's W / S / D into Ctrl+W (close tab), Ctrl+S, Ctrl+D.
  { name:'PLAYER 2', up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight',
    item:'ShiftRight', hand:'Slash', drs:'Period', ers:'Comma', look:'Enter',
    label:{up:'UP',down:'DOWN',left:'LEFT',right:'RIGHT',item:'R-SHIFT',hand:'/',drs:'.',ers:',',look:'ENTER'} }
];
var keys = {}, keyHit = {};
var SWALLOW = {};
(function(){
  var list = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Escape','Backspace',
              'Tab','KeyW','KeyA','KeyS','KeyD','KeyB','KeyE','KeyQ','KeyR','KeyP','KeyM',
              'ShiftRight','Slash','Period','Comma','Digit1','Digit2','Digit3'];
  for(var i=0;i<list.length;i++) SWALLOW[list[i]]=true;
})();
window.addEventListener('keydown', function(e){
  if(SWALLOW[e.code]) e.preventDefault();
  if(e.repeat) return;
  keys[e.code]=true; keyHit[e.code]=true;
  Audio_unlock();
}, {passive:false});
window.addEventListener('keyup', function(e){
  if(SWALLOW[e.code]) e.preventDefault();
  keys[e.code]=false;
}, {passive:false});
window.addEventListener('blur', function(){ for(var k in keys) keys[k]=false; requestPause(); });
document.addEventListener('visibilitychange', function(){ if(document.hidden){ for(var k in keys) keys[k]=false; requestPause(); } });
function hit(code){ if(keyHit[code]){ keyHit[code]=false; return true; } return false; }
function clearHits(){ keyHit = {}; }

// pointer (menus only) — maps through the letterbox scale
var pointer = {x:-999,y:-999,down:false,click:false};
function mapPointer(ev){
  var r = cv.getBoundingClientRect();
  var sx = VW / r.width, sy = VH / r.height;
  var cx = (ev.clientX!==undefined?ev.clientX:(ev.touches&&ev.touches[0]?ev.touches[0].clientX:0));
  var cy = (ev.clientY!==undefined?ev.clientY:(ev.touches&&ev.touches[0]?ev.touches[0].clientY:0));
  pointer.x = (cx - r.left)*sx; pointer.y = (cy - r.top)*sy;
}
cv.addEventListener('mousemove', function(e){ mapPointer(e); });
// grabbing focus matters inside an iframe: without it key events go to the host page
cv.addEventListener('mousedown', function(e){ mapPointer(e); pointer.down=true; Audio_unlock();
  try{ window.focus(); }catch(err){} });
window.addEventListener('mouseup', function(e){ if(pointer.down){ pointer.down=false; pointer.click=true; } });
cv.addEventListener('touchstart', function(e){ mapPointer(e); pointer.down=true; Audio_unlock(); e.preventDefault(); }, {passive:false});
cv.addEventListener('touchend', function(e){ if(pointer.down){ pointer.down=false; pointer.click=true; } e.preventDefault(); }, {passive:false});

/* menu helper input: any player's keys drive the menus */
var MENU = {
  up:function(){ return hit('KeyW')||hit('ArrowUp'); },
  down:function(){ return hit('KeyS')||hit('ArrowDown'); },
  left:function(){ return hit('KeyA')||hit('ArrowLeft'); },
  right:function(){ return hit('KeyD')||hit('ArrowRight'); },
  ok:function(){ return hit('Enter')||hit('Space')||hit('KeyB')||hit('ShiftRight'); },
  back:function(){ return hit('Escape')||hit('Backspace')||hit('KeyQ'); }
};

/* ---------- 4. AUDIO (WebAudio, created only after a gesture) ---------- */
var AC=null, masterGain=null, sfxGain=null, engGain=null, noiseBuf=null, crowdNode=null, audioReady=false;
function Audio_unlock(){
  if(audioReady) { if(AC && AC.state==='suspended'){ try{AC.resume();}catch(e){} } return; }
  try{
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return;
    AC = new Ctor();
    masterGain = AC.createGain(); masterGain.gain.value = save.settings.master; masterGain.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.gain.value = save.settings.sfx; sfxGain.connect(masterGain);
    engGain = AC.createGain(); engGain.gain.value = save.settings.engine; engGain.connect(masterGain);
    // one shared noise buffer
    var n = AC.sampleRate*2|0; noiseBuf = AC.createBuffer(1,n,AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = Math.random()*2-1;
    audioReady = true;
    if(AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; audioReady=false; }
}
function applyVolumes(){
  if(!audioReady) return;
  try{
    masterGain.gain.value = save.settings.master;
    sfxGain.gain.value = save.settings.sfx;
    engGain.gain.value = save.settings.engine;
  }catch(e){}
}
function noiseSrc(){ var s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }
function sfxTone(type,f0,f1,dur,vol,dest){
  if(!audioReady) return;
  try{
    var t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest||sfxGain); o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function sfxNoise(dur,vol,f,q,type){
  if(!audioReady) return;
  try{
    var t=AC.currentTime, s=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain();
    bp.type=type||'bandpass'; bp.frequency.value=f; bp.Q.value=q||1;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol), t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(bp); bp.connect(g); g.connect(sfxGain); s.start(t); s.stop(t+dur+0.02);
  }catch(e){}
}
var SFX = {
  light:  function(){ sfxTone('square',520,520,0.16,0.22); },
  green:  function(){ sfxTone('square',900,1200,0.5,0.28); sfxNoise(0.5,0.12,1200,1); },
  thump:  function(v){ v=clamp(v,0.05,1); sfxTone('sine',150*(0.6+v),40,0.28,0.30*v); sfxNoise(0.16,0.22*v,420,0.7); },
  scrape: function(v){ sfxNoise(0.10,0.10*v,1800,3); },
  squeal: function(v){ sfxNoise(0.13,0.055*v,2600,9); },
  pickup: function(){ sfxTone('square',480,960,0.10,0.16); setTimeout(function(){sfxTone('square',760,1500,0.12,0.14);},70); },
  boost:  function(){ sfxNoise(0.55,0.20,900,0.8); sfxTone('sawtooth',180,900,0.5,0.10); },
  missile:function(){ sfxTone('sawtooth',300,1400,0.7,0.10); sfxNoise(0.6,0.08,2200,2); },
  blast:  function(){ sfxTone('sine',220,30,0.5,0.34); sfxNoise(0.42,0.30,300,0.6); },
  oil:    function(){ sfxNoise(0.3,0.14,500,1.2); },
  shield: function(){ sfxTone('triangle',600,1300,0.35,0.16); sfxTone('triangle',900,1800,0.35,0.10); },
  bolt:   function(){ sfxNoise(0.45,0.30,3000,1); sfxTone('square',1500,140,0.5,0.16); },
  fresh:  function(){ sfxTone('triangle',400,800,0.18,0.14); setTimeout(function(){sfxTone('triangle',700,1200,0.22,0.12);},110); },
  gun:    function(){ sfxNoise(0.6,0.16,180,1.4,'lowpass'); },
  menu:   function(){ sfxTone('square',420,420,0.05,0.10); },
  select: function(){ sfxTone('square',600,900,0.10,0.14); },
  penalty:function(){ sfxTone('square',300,180,0.4,0.18); },
  best:   function(){ sfxTone('square',700,700,0.09,0.16); setTimeout(function(){sfxTone('square',1050,1050,0.09,0.16);},95);
                      setTimeout(function(){sfxTone('square',1400,1400,0.20,0.16);},190); },
  flag:   function(){ sfxTone('square',900,900,0.1,0.2); setTimeout(function(){sfxTone('square',1200,1200,0.1,0.2);},130);
                      setTimeout(function(){sfxTone('square',700,700,0.4,0.2);},260); }
};
// crowd ambience
function crowdStart(level){
  if(!audioReady || crowdNode) return;
  try{
    var s=noiseSrc(), bp=AC.createBiquadFilter(), g=AC.createGain();
    bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.6;
    g.gain.value=level||0.05;
    s.connect(bp); bp.connect(g); g.connect(masterGain); s.start();
    crowdNode={s:s,g:g,bp:bp};
  }catch(e){}
}
function crowdStop(){ if(crowdNode){ try{crowdNode.s.stop();}catch(e){} crowdNode=null; } }
function crowdLevel(v){ if(crowdNode){ try{ crowdNode.g.gain.value=v; }catch(e){} } }

// per-player engine voice
function EngineVoice(){
  this.ok=false;
  if(!audioReady) return;
  try{
    this.o1=AC.createOscillator(); this.o1.type='sawtooth';
    this.o2=AC.createOscillator(); this.o2.type='square';
    this.o3=AC.createOscillator(); this.o3.type='sawtooth';
    this.lp=AC.createBiquadFilter(); this.lp.type='lowpass'; this.lp.frequency.value=1800; this.lp.Q.value=3;
    this.g=AC.createGain(); this.g.gain.value=0;
    this.g2=AC.createGain(); this.g2.gain.value=0.35;
    this.o1.connect(this.lp); this.o2.connect(this.g2); this.g2.connect(this.lp); this.o3.connect(this.lp);
    this.lp.connect(this.g); this.g.connect(engGain);
    this.o1.start(); this.o2.start(); this.o3.start();
    this.ok=true;
  }catch(e){ this.ok=false; }
}
EngineVoice.prototype.set = function(rpm, load, vol){
  if(!this.ok) return;
  try{
    var f = 42 + rpm*0.055;
    this.o1.frequency.value = f;
    this.o2.frequency.value = f*2.02;
    this.o3.frequency.value = f*0.5+1;
    this.lp.frequency.value = 420 + rpm*0.35 + load*900;
    this.g.gain.value = vol;
  }catch(e){}
};
EngineVoice.prototype.kill = function(){
  if(!this.ok) return;
  try{ this.o1.stop(); this.o2.stop(); this.o3.stop(); }catch(e){}
  this.ok=false;
};

/* ---------- 5. PIXEL SPRITE FACTORY ---------- */
/* Cars are drawn once as pixel art, then pre-rotated into ROT frames.        */
var ROT = 64, CAR_L = 26, CAR_W = 15, FRAME = 34;

function shade(hex, amt){
  var n=parseInt(hex.slice(1),16);
  var r=clamp(((n>>16)&255)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return 'rgb('+r+','+g+','+b+')';
}
function drawCarPixels(x, c1, c2, c3){
  // nose points +X. canvas is CAR_L x CAR_W
  var W=CAR_L, H=CAR_W, cy=(H-1)/2;
  x.clearRect(0,0,W,H);
  function px(a,b,w,h,col){ x.fillStyle=col; x.fillRect(a,b,w,h); }
  var dark = shade(c1,-70), lite = shade(c1,55);
  // rear wing
  px(0,2,3,11,dark); px(1,3,1,9,c2); px(0,6,3,3,shade(c1,-30));
  // floor / sidepods
  px(4,3,13,9,dark);
  px(5,4,12,7,c1);
  px(5,4,12,1,lite);
  px(5,10,12,1,dark);
  // engine cover spine
  px(6,6,10,3,c2);
  px(7,7,8,1,lite);
  // nose cone
  px(17,5,6,5,c1);
  px(18,6,5,3,c2);
  px(20,6,3,1,lite);
  // front wing
  px(23,2,3,11,dark);
  px(24,3,1,9,c2);
  // cockpit + helmet
  px(12,6,4,3,'#151a22');
  px(13,6,2,3,c3);
  px(13,7,1,1,'#f7fbff');
  // halo
  px(11,5,1,5,'#2a3140'); px(16,5,1,5,'#2a3140');
  // tyres (black with a highlight row)
  px(4,0,5,3,'#101215'); px(4,1,5,1,'#2a2e35');
  px(4,12,5,3,'#101215'); px(4,13,5,1,'#2a2e35');
  px(17,0,5,3,'#101215'); px(17,1,5,1,'#2a2e35');
  px(17,12,5,3,'#101215'); px(17,13,5,1,'#2a2e35');
  // number board
  px(9,6,2,3,'#f3f7ff');
  return {cy:cy};
}
var spriteCache = {};
function carSprite(c1,c2,c3){
  var key = c1+c2+c3;
  if(spriteCache[key]) return spriteCache[key];
  var base = mkCanvas(CAR_L,CAR_W);
  drawCarPixels(base.x, c1, c2, c3);
  var frames = new Array(ROT);
  for(var i=0;i<ROT;i++){
    var f = mkCanvas(FRAME,FRAME);
    f.x.imageSmoothingEnabled=false;
    f.x.save();
    f.x.translate(FRAME/2, FRAME/2);
    f.x.rotate(i/ROT*Math.PI*2);
    f.x.drawImage(base.c, -CAR_L/2|0, -CAR_W/2|0);
    f.x.restore();
    frames[i]=f.c;
  }
  // shadow blob reused for all
  spriteCache[key]=frames;
  return frames;
}
function frameFor(angle){
  var i = Math.round(angle/(Math.PI*2)*ROT) % ROT;
  if(i<0) i+=ROT;
  return i;
}

/* small generic pixel props, baked once */
var props = {};
function buildProps(){
  // tyre stack barrier chunk
  var t = mkCanvas(8,8);
  t.x.fillStyle='#14161c'; t.x.fillRect(0,0,8,8);
  t.x.fillStyle='#23262e'; t.x.fillRect(1,1,6,2); t.x.fillRect(1,5,6,2);
  t.x.fillStyle='#d8dee8'; t.x.fillRect(0,3,8,1);
  props.tyre = t.c;
  // marshal post
  var m = mkCanvas(6,10);
  m.x.fillStyle='#3a4250'; m.x.fillRect(2,2,2,8);
  m.x.fillStyle='#ffdc3c'; m.x.fillRect(0,0,6,3);
  props.post = m.c;
  // grandstand block (drawn tiled)
  var g = mkCanvas(40,26);
  g.x.fillStyle='#2b3446'; g.x.fillRect(0,6,40,20);
  g.x.fillStyle='#3d4a63'; g.x.fillRect(0,10,40,3); g.x.fillRect(0,16,40,3); g.x.fillRect(0,22,40,3);
  g.x.fillStyle='#1b2130'; g.x.fillRect(0,0,40,7);
  g.x.fillStyle='#4a5a78'; g.x.fillRect(0,0,40,2);
  props.stand = g.c;
  // tree
  var tr = mkCanvas(14,16);
  tr.x.fillStyle='#3b2a1a'; tr.x.fillRect(6,10,2,6);
  tr.x.fillStyle='#1d6b34'; tr.x.fillRect(2,2,10,9);
  tr.x.fillStyle='#2a8f45'; tr.x.fillRect(3,1,8,6);
  tr.x.fillStyle='#41b45c'; tr.x.fillRect(4,2,4,3);
  props.tree = tr.c;
  // palm
  var pa = mkCanvas(14,18);
  pa.x.fillStyle='#6b4c2a'; pa.x.fillRect(6,7,2,11);
  pa.x.fillStyle='#1f8f4a'; pa.x.fillRect(1,4,12,2); pa.x.fillRect(3,2,8,2); pa.x.fillRect(0,6,5,2); pa.x.fillRect(9,6,5,2);
  props.palm = pa.c;
  // cactus
  var ca = mkCanvas(12,18);
  ca.x.fillStyle='#2f7a45'; ca.x.fillRect(5,2,3,16); ca.x.fillRect(2,7,3,6); ca.x.fillRect(8,5,3,7);
  ca.x.fillStyle='#48a25c'; ca.x.fillRect(5,2,1,16);
  props.cactus = ca.c;
  // neon sign block
  var ne = mkCanvas(16,22);
  ne.x.fillStyle='#171a26'; ne.x.fillRect(0,0,16,22);
  ne.x.fillStyle='#ff3fae'; ne.x.fillRect(2,3,12,2); ne.x.fillRect(2,9,8,2);
  ne.x.fillStyle='#3fe6ff'; ne.x.fillRect(2,15,12,2);
  props.neon = ne.c;
  // pit garage
  var pg = mkCanvas(34,22);
  pg.x.fillStyle='#232a38'; pg.x.fillRect(0,0,34,22);
  pg.x.fillStyle='#3a465c'; pg.x.fillRect(2,3,30,14);
  pg.x.fillStyle='#151a24'; pg.x.fillRect(4,6,26,11);
  pg.x.fillStyle='#e8eef8'; pg.x.fillRect(0,0,34,3);
  props.garage = pg.c;
  // item pad
  var ip = mkCanvas(20,20);
  var g2 = ip.x.createLinearGradient(0,0,20,20);
  g2.addColorStop(0,'#ffd23f'); g2.addColorStop(0.5,'#ff6f3c'); g2.addColorStop(1,'#ffd23f');
  ip.x.fillStyle='#101520'; ip.x.fillRect(0,0,20,20);
  ip.x.fillStyle=g2; ip.x.fillRect(2,2,16,16);
  ip.x.fillStyle='#101520'; ip.x.fillRect(6,5,8,3); ip.x.fillRect(6,12,8,3); ip.x.fillRect(9,8,2,4);
  props.pad = ip.c;
  // crew member (2 frames)
  props.crew = [];
  for(var f=0;f<2;f++){

function crPt(p0,p1,p2,p3,t,axis){
  var a=p0[axis],b=p1[axis],c=p2[axis],d=p3[axis], t2=t*t, t3=t2*t;
  return 0.5*((2*b) + (-a+c)*t + (2*a-5*b+4*c-d)*t2 + (-a+3*b-3*c+d)*t3);
}
function boxBlur(arr, rad){
  var n=arr.length, out=new Float32Array(n);
  for(var i=0;i<n;i++){
    var s=0;
    for(var j=-rad;j<=rad;j++) s+=arr[(i+j+n*4)%n];
    out[i]=s/(rad*2+1);
  }
  return out;
}

function buildTrack(def){
  var tr = { def:def, id:def.id, name:def.name, laps:def.laps, theme:def.theme, weather:def.weather, time:def.time };
  // 1. control nodes from the polar profile
  var K = def.radii.length, nodes=[];
  for(var k=0;k<K;k++){
    var th = (90 - k*(360/K)) * Math.PI/180;
    var r = def.radii[k];
    nodes.push([def.cx + Math.cos(th)*r*def.sx, def.cy + Math.sin(th)*r*def.sy]);
  }
  // 2. dense Catmull-Rom
  var dense=[];
  for(var i=0;i<K;i++){
    var p0=nodes[(i-1+K)%K], p1=nodes[i], p2=nodes[(i+1)%K], p3=nodes[(i+2)%K];
    for(var t=0;t<24;t++){
      var u=t/24;
      dense.push([crPt(p0,p1,p2,p3,u,0), crPt(p0,p1,p2,p3,u,1)]);
    }
  }
  // 2b. curvature limiter: no corner may be tighter than a car can physically take.
  //     Taubin smoothing (shrink pass + un-shrink pass) until the minimum radius is safe.
  var MINR=175;
  function worstCurv(a){
    var n=a.length, w=0, st=5;
    for(var i=0;i<n;i++){
      var p0=a[(i-st+n)%n], p1=a[i], p2=a[(i+st)%n];
      var ax=p1[0]-p0[0], ay=p1[1]-p0[1], bx=p2[0]-p1[0], by=p2[1]-p1[1];
      var cx2=p2[0]-p0[0], cy2=p2[1]-p0[1];
      var la=len2(ax,ay), lb=len2(bx,by), lc2=len2(cx2,cy2);
      var cross=Math.abs(ax*by-ay*bx);
      if(la*lb*lc2<0.0001) continue;
      var k=2*cross/(la*lb*lc2);
      if(k>w) w=k;
    }
    return w;
  }
  function smoothPass(a,lam){
    var n=a.length, out=new Array(n);
    for(var i=0;i<n;i++){
      var p0=a[(i-1+n)%n], p1=a[i], p2=a[(i+1)%n];
      out[i]=[ p1[0]+lam*(0.5*(p0[0]+p2[0])-p1[0]), p1[1]+lam*(0.5*(p0[1]+p2[1])-p1[1]) ];
    }
    return out;
  }
  for(var sm=0; sm<260; sm++){
    if(worstCurv(dense) < 1/MINR) break;
    dense=smoothPass(dense,0.55);
    dense=smoothPass(dense,-0.57);
  }
  // 3. resample by arc length
  var pts=[], acc=0, cur=dense[0].slice();
  pts.push([cur[0],cur[1]]);
  for(var i2=1;i2<=dense.length;i2++){
    var a=dense[(i2-1)%dense.length], b=dense[i2%dense.length];
    var dx=b[0]-a[0], dy=b[1]-a[1], seg=len2(dx,dy);
    if(seg<=0.0001) continue;
    var walked=0;
    while(acc+ (seg-walked) >= SPACING){
      var need = SPACING-acc;
      walked += need;
      var f = walked/seg;
      pts.push([a[0]+dx*f, a[1]+dy*f]);
      acc=0;
    }
    acc += seg-walked;
  }
  // drop the last point if it landed on top of the first
  if(pts.length>2 && len2(pts[pts.length-1][0]-pts[0][0], pts[pts.length-1][1]-pts[0][1]) < SPACING*0.55) pts.pop();
  var N=pts.length;
  tr.N=N; tr.spacing=SPACING; tr.length=N*SPACING;
  tr.px=new Float32Array(N); tr.py=new Float32Array(N);
  for(var i3=0;i3<N;i3++){ tr.px[i3]=pts[i3][0]; tr.py[i3]=pts[i3][1]; }
  // 4. tangents / normals / curvature
  tr.tx=new Float32Array(N); tr.ty=new Float32Array(N);
  tr.nx=new Float32Array(N); tr.ny=new Float32Array(N);
  tr.ang=new Float32Array(N);
  var curv=new Float32Array(N);
  for(var i4=0;i4<N;i4++){
    var a1=(i4-1+N)%N, b1=(i4+1)%N;
    var dx2=tr.px[b1]-tr.px[a1], dy2=tr.py[b1]-tr.py[a1], m=len2(dx2,dy2)||1;
    tr.tx[i4]=dx2/m; tr.ty[i4]=dy2/m;
    tr.nx[i4]=-tr.ty[i4]; tr.ny[i4]=tr.tx[i4];
    tr.ang[i4]=Math.atan2(tr.ty[i4],tr.tx[i4]);
  }
  for(var i5=0;i5<N;i5++){
    var p=(i5-1+N)%N, q=(i5+1)%N;
    curv[i5] = angDiff(tr.ang[q], tr.ang[p]) / (2*SPACING);
  }
  tr.curv = boxBlur(curv,3);
  // signed area -> which side is the infield
  var A=0;
  for(var i6=0;i6<N;i6++){ var j=(i6+1)%N; A += tr.px[i6]*tr.py[j] - tr.px[j]*tr.py[i6]; }
  tr.pitSide = (A>0)? 1 : -1;   // multiply the left-normal by this to point at the infield

  // 5. straights: pick the flattest window for the pit straight, second for DRS
  var win=Math.max(120, Math.floor(N*0.24));
  var roll=new Float32Array(N), s0=0;
  for(var i7=0;i7<win;i7++) s0+=Math.abs(tr.curv[i7]);
  roll[0]=s0;
  for(var i8=1;i8<N;i8++){ s0 += Math.abs(tr.curv[(i8+win-1)%N]) - Math.abs(tr.curv[(i8-1+N)%N]); roll[i8]=s0; }
  var best=0;
  for(var i9=1;i9<N;i9++) if(roll[i9]<roll[best]) best=i9;
  var best2=-1;
  for(var iA=0;iA<N;iA++){
    var dd=Math.abs(iA-best); dd=Math.min(dd, N-dd);
    if(dd < win*1.6) continue;
    if(best2<0 || roll[iA]<roll[best2]) best2=iA;
  }
  if(best2<0) best2=(best+Math.floor(N/2))%N;
  tr.pitFrom = best;
  tr.pitTo   = (best+win)%N;
  tr.sfIdx   = (best + Math.floor(win*0.62))%N;
  var drsLen = Math.max(50, Math.floor(N*0.11));
  tr.drs     = [ (best2+8)%N, (best2+8+drsLen)%N ];
  tr.sector1 = (tr.sfIdx + Math.floor(N/3))%N;
  tr.sector2 = (tr.sfIdx + Math.floor(2*N/3))%N;

  // 6. pit lane offsets (0 outside the pit window, ramping to PITO inside)
  tr.pitOff = new Float32Array(N);
  var taper = Math.floor(win*0.20);
  var count = (tr.pitTo - tr.pitFrom + N)%N;
  for(var c1=0;c1<count;c1++){
    var idx=(tr.pitFrom+c1)%N, v=1;
    if(c1<taper) v = c1/taper;
    else if(c1>count-taper) v = Math.max(0,(count-c1)/taper);
    tr.pitOff[idx] = PITO * v*v*(3-2*v);
  }
  tr.pitGateIn  = (tr.pitFrom + 4)%N;
  // exit AFTER the lane has tapered back to the racing surface. Sitting the gate
  // before the taper marked the car "on track" while it was still ~PITO px out,
  // and the outer-wall clamp then yanked it sideways into the barrier.
  tr.pitGateOut = (tr.pitFrom + count - 3 + N)%N;
  tr.pitBox     = (tr.pitFrom + taper + 20)%N;
  tr.pitCount   = count;
  tr.pitTaper   = taper;

  // 7. racing line
  var raw=new Float32Array(N), maxOff=HALFW-15;
  for(var iB=0;iB<N;iB++){
    var cc = tr.curv[iB];
    raw[iB] = clamp(cc*260, -1, 1) * maxOff;   // + = left normal = inside of a left-hander
  }
  var b1=boxBlur(raw,10), b2=boxBlur(raw,40);
  tr.line=new Float32Array(N);
  var lx=new Float32Array(N), ly=new Float32Array(N);
  for(var iC=0;iC<N;iC++){
    var off = clamp(b1[iC]*1.45 - b2[iC]*0.62, -maxOff, maxOff);
    tr.line[iC]=off;
    lx[iC]=tr.px[iC]+tr.nx[iC]*off;
    ly[iC]=tr.py[iC]+tr.ny[iC]*off;
  }
  tr.lx=lx; tr.ly=ly;
  // racing line curvature -> target speed with a backward braking pass
  var lc=new Float32Array(N);
  for(var iD=0;iD<N;iD++){
    var p2i=(iD-2+N)%N, n2=(iD+2)%N;
    var a2=Math.atan2(ly[iD]-ly[p2i], lx[iD]-lx[p2i]);
    var b3=Math.atan2(ly[n2]-ly[iD], lx[n2]-lx[iD]);
    lc[iD]=Math.abs(angDiff(b3,a2))/(4*SPACING);
  }
  lc = boxBlur(lc,4);
  var VMAX=430, LATG=137000;
  tr.tv=new Float32Array(N);
  for(var iE=0;iE<N;iE++){
    var k2=Math.max(lc[iE],0.00002);
    tr.tv[iE]=Math.min(VMAX, Math.sqrt(LATG*0.0016/k2)*1.0);
  }
  for(var pass=0;pass<3;pass++){
    for(var iF=N-1;iF>=0;iF--){
      var nx2=(iF+1)%N;
      var v=Math.sqrt(tr.tv[nx2]*tr.tv[nx2] + 2*350*SPACING);
      if(v<tr.tv[iF]) tr.tv[iF]=v;
    }
    for(var iG=0;iG<N;iG++){
      var pv=(iG-1+N)%N;
      var v2=Math.sqrt(tr.tv[pv]*tr.tv[pv] + 2*250*SPACING);
      if(v2<tr.tv[iG]) tr.tv[iG]=v2;
    }
  }
  // 8. bounding box + minimap transform
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(var iH=0;iH<N;iH++){
    if(tr.px[iH]<minx)minx=tr.px[iH]; if(tr.px[iH]>maxx)maxx=tr.px[iH];
    if(tr.py[iH]<miny)miny=tr.py[iH]; if(tr.py[iH]>maxy)maxy=tr.py[iH];
  }
  var pad=190;
  tr.bx=Math.floor(minx-pad); tr.by=Math.floor(miny-pad);
  tr.bw=Math.ceil(maxx-minx+pad*2); tr.bh=Math.ceil(maxy-miny+pad*2);
  // 9. item pad locations (on the racing line, spread around the lap)
  tr.pads=[];
  var padGroups=5;
  for(var g=0;g<padGroups;g++){
    var base=Math.floor(N*(g+0.5)/padGroups);
    // keep pads off the pit straight
    if(tr.pitOff[base]>0) base=(base+Math.floor(N*0.08))%N;
    for(var lane=-1;lane<=1;lane++){
      var off = lane*30;
      var bi=base%N;
      tr.pads.push({ i:bi, off:off,
                     x:tr.px[bi]+tr.nx[bi]*off, y:tr.py[bi]+tr.ny[bi]*off, t:0 });
    }
  }
  // 10. grid slots (behind the start/finish line)
  tr.grid=[];
  for(var gp=0;gp<14;gp++){
    var back = 26 + Math.floor(gp/2)*38;
    var gi = (tr.sfIdx - Math.floor(back/SPACING) + N*4)%N;
    var goff = (gp%2===0? -20 : 20) + tr.line[gi]*0.15;
    tr.grid.push({ i:gi, x:tr.px[gi]+tr.nx[gi]*goff, y:tr.py[gi]+tr.ny[gi]*goff, a:tr.ang[gi] });
  }
  // 11. pit box slots along the pit lane
  tr.boxes=[];
  for(var bi2=0;bi2<14;bi2++){
    var idx2=(tr.pitBox + bi2*6)%N;
    tr.boxes.push({ i:idx2,
      x:tr.px[idx2]+tr.nx[idx2]*tr.pitSide*tr.pitOff[idx2],
      y:tr.py[idx2]+tr.ny[idx2]*tr.pitSide*tr.pitOff[idx2] });
  }
  return tr;
}

/* signed lateral offset of a world point from the centreline, plus nearest index.
   Uses a local search window around the last known index (cheap + stable).   */
var _proj={i:0,lat:0,along:0};   // reused: project() runs once per car per step
/* `win` is the half-width of the local search, in samples. A car moves under one
   sample per step, so a wide window buys nothing and costs correctness: a point
   far off the centreline (in the pit lane, or buried in the outer barrier) can be
   nearer to some other sample of a twisty circuit, and the nearest-sample flip
   makes `lat` teleport, which the wall clamp then "corrects" by shoving the car. */
function project(tr, x, y, hint, win){
  var N=tr.N, bestI=hint|0, bestD=1e18;
  win = win||24;
  var lo=(hint|0)-win, hi=(hint|0)+win;
  for(var k=lo;k<=hi;k++){
    var i=((k%N)+N)%N;
    var dx=x-tr.px[i], dy=y-tr.py[i], d=dx*dx+dy*dy;
    if(d<bestD){ bestD=d; bestI=i; }
  }
  var dx2=x-tr.px[bestI], dy2=y-tr.py[bestI];
  _proj.i=bestI;
  _proj.lat = dx2*tr.nx[bestI] + dy2*tr.ny[bestI];
  _proj.along = dx2*tr.tx[bestI] + dy2*tr.ty[bestI];
  return _proj;
}
function projectGlobal(tr,x,y){
  var N=tr.N,bestI=0,bestD=1e18;
  for(var i=0;i<N;i+=2){
    var dx=x-tr.px[i], dy=y-tr.py[i], d=dx*dx+dy*dy;
    if(d<bestD){bestD=d;bestI=i;}
  }
  return project(tr,x,y,bestI);
}
function relIdx(tr,i){ return ((i - tr.sfIdx)%tr.N + tr.N)%tr.N; }

/* ---------- 8. BAKING THE CIRCUIT IMAGE ---------- */
function offPath(x, tr, offA, offB, from, to){
  // band between two lateral offset functions, index range [from,to)
  var N=tr.N, i, idx;
  x.beginPath();
  for(i=from;i<to;i++){
    idx=((i%N)+N)%N;
    var o=offA(idx);
    var px=tr.px[idx]+tr.nx[idx]*o, py=tr.py[idx]+tr.ny[idx]*o;
    if(i===from) x.moveTo(px,py); else x.lineTo(px,py);
  }
  for(i=to-1;i>=from;i--){
    idx=((i%N)+N)%N;
    var o2=offB(idx);
    x.lineTo(tr.px[idx]+tr.nx[idx]*o2, tr.py[idx]+tr.ny[idx]*o2);
  }
  x.closePath();
}
function bakeTrack(tr){
  var T=tr.theme, N=tr.N;
  var world=mkCanvas(tr.bw, tr.bh);
  var x=world.x;
  x.imageSmoothingEnabled=false;
  x.save();
  x.translate(-tr.bx, -tr.by);

  // wall offsets
  tr.wallPit = new Float32Array(N);
  tr.wallOut = new Float32Array(N);
  for(var i=0;i<N;i++){
    var t=clamp((tr.pitOff[i]-40)/50,0,1);
    tr.wallPit[i]=HALFW+RUNOFF-(RUNOFF-14)*t;
    tr.wallOut[i]=HALFW+RUNOFF;
  }
  var side=tr.pitSide;

  // --- ground ---
  x.fillStyle=T.ground; x.fillRect(tr.bx,tr.by,tr.bw,tr.bh);
  var R=new RNG(tr.id.length*7919+1234);
  x.fillStyle=T.ground2;
  for(var g=0;g<5200;g++){
    var gx=tr.bx+R.next()*tr.bw|0, gy=tr.by+R.next()*tr.bh|0;
    x.fillRect(gx&~3, gy&~3, 4+ (R.next()<0.3?4:0), 4);
  }
  // --- run-off ring ---
  x.fillStyle=T.sand;
  offPath(x,tr,function(i){return tr.wallOut[i];},function(i){return -tr.wallOut[i];},0,N+1);
  x.fill('evenodd');
  // inner cutout is handled by drawing asphalt on top
  // gravel speckle
  x.save();
  offPath(x,tr,function(i){return tr.wallOut[i]+2;},function(i){return -tr.wallOut[i]-2;},0,N+1);
  x.clip();
  x.fillStyle='rgba(0,0,0,0.10)';
  for(var s2=0;s2<2600;s2++){
    var sx2=tr.bx+R.next()*tr.bw|0, sy2=tr.by+R.next()*tr.bh|0;
    x.fillRect(sx2&~1,sy2&~1,2,2);
  }
  x.restore();

  // --- asphalt ---
  x.fillStyle=T.road;
  offPath(x,tr,function(i){return HALFW;},function(i){return -HALFW;},0,N+1);
  x.fill();
  // asphalt grain + patch shading
  x.save();
  offPath(x,tr,function(i){return HALFW;},function(i){return -HALFW;},0,N+1);
  x.clip();
  x.fillStyle=T.road2;
  for(var a=0;a<4200;a++){
    var ax=tr.bx+R.next()*tr.bw|0, ay=tr.by+R.next()*tr.bh|0;
    x.fillRect(ax&~2,ay&~2, 2+(R.next()<0.25?2:0), 2);
  }
  x.fillStyle='rgba(0,0,0,0.13)';
  for(var a2=0;a2<600;a2++){
    var bx2=tr.bx+R.next()*tr.bw|0, by2=tr.by+R.next()*tr.bh|0;
    x.fillRect(bx2&~3,by2&~3,10,6);
  }
  x.restore();

  // --- kerbs on corners ---
  for(var i2=0;i2<N;i2++){
    var c=tr.curv[i2];
    if(Math.abs(c)<0.0016) continue;
    var kside = c>0? 1 : -1;                       // inside of the corner
    var col = ((i2/3)|0)%2===0 ? T.kerbA : T.kerbB;
    var i3=(i2+1)%N;
    var o1=HALFW, o2=HALFW+9;
    x.fillStyle=col;
    x.beginPath();
    x.moveTo(tr.px[i2]+tr.nx[i2]*o1*kside, tr.py[i2]+tr.ny[i2]*o1*kside);
    x.lineTo(tr.px[i2]+tr.nx[i2]*o2*kside, tr.py[i2]+tr.ny[i2]*o2*kside);
    x.lineTo(tr.px[i3]+tr.nx[i3]*o2*kside, tr.py[i3]+tr.ny[i3]*o2*kside);
    x.lineTo(tr.px[i3]+tr.nx[i3]*o1*kside, tr.py[i3]+tr.ny[i3]*o1*kside);
    x.closePath(); x.fill();
    // outside kerb on the exit of quick corners
    if(Math.abs(c)>0.0032){
      var col2 = ((i2/3)|0)%2===0 ? T.kerbB : T.kerbA;
      x.fillStyle=col2;
      x.beginPath();
      x.moveTo(tr.px[i2]-tr.nx[i2]*o1*kside, tr.py[i2]-tr.ny[i2]*o1*kside);
      x.lineTo(tr.px[i2]-tr.nx[i2]*o2*kside, tr.py[i2]-tr.ny[i2]*o2*kside);
      x.lineTo(tr.px[i3]-tr.nx[i3]*o2*kside, tr.py[i3]-tr.ny[i3]*o2*kside);
      x.lineTo(tr.px[i3]-tr.nx[i3]*o1*kside, tr.py[i3]-tr.ny[i3]*o1*kside);
      x.closePath(); x.fill();
    }
  }
  // --- white edge lines ---
  x.strokeStyle=T.line; x.lineWidth=2.5;
  for(var sgn=-1;sgn<=1;sgn+=2){
    x.beginPath();
    for(var i4=0;i4<=N;i4++){
      var ii=i4%N, o=(HALFW-2)*sgn;
      var pxx=tr.px[ii]+tr.nx[ii]*o, pyy=tr.py[ii]+tr.ny[ii]*o;
      if(i4===0) x.moveTo(pxx,pyy); else x.lineTo(pxx,pyy);
    }
    x.closePath(); x.stroke();
  }

  // --- pit lane ---
  var pf=tr.pitFrom, pc=tr.pitCount;
  x.fillStyle=T.road2;
  offPath(x,tr,function(i){return side*(tr.pitOff[i]+PITHALF);},
                function(i){return side*(tr.pitOff[i]-PITHALF);}, pf, pf+pc);
  x.fill();
  // pit lane markings
  x.strokeStyle='#f2f5fa'; x.lineWidth=2;
  for(var e=-1;e<=1;e+=2){
    x.beginPath();
    for(var i5=pf;i5<pf+pc;i5++){
      var ii2=i5%N, o3=side*(tr.pitOff[ii2]+e*(PITHALF-2));
      if(tr.pitOff[ii2]<HALFW*0.4) continue;
      var qx=tr.px[ii2]+tr.nx[ii2]*o3, qy=tr.py[ii2]+tr.ny[ii2]*o3;
      x.lineTo(qx,qy);
    }
    x.stroke();
  }
  // pit boxes + garages + crew markings
  for(var b=0;b<tr.boxes.length;b++){
    var bx3=tr.boxes[b], bi=bx3.i;
    var nx3=tr.nx[bi], ny3=tr.ny[bi], tx3=tr.tx[bi], ty3=tr.ty[bi];
    var cxx=bx3.x, cyy=bx3.y;
    x.save();
    x.translate(cxx,cyy);
    x.rotate(Math.atan2(ty3,tx3));
    x.fillStyle= (b%2? '#e8eef8':'#ffd23f');
    x.fillRect(-14,-PITHALF+1,28,3);
    x.fillRect(-14,PITHALF-4,28,3);
    x.fillStyle='rgba(255,255,255,0.16)'; x.fillRect(-13,-PITHALF+4,26,PITHALF*2-8);
    x.restore();
    // garage behind the box
    var go = side*(PITO+PITHALF+18);
    x.save();
    x.translate(tr.px[bi]+nx3*go, tr.py[bi]+ny3*go);
    x.rotate(Math.atan2(ty3,tx3)+Math.PI/2);
    x.drawImage(props.garage,-17,-11);
    x.restore();
  }
  // pit wall between the lane and the track
  x.fillStyle='#c9d3e2';
  offPath(x,tr,function(i){ return side*Math.max(HALFW+8, tr.pitOff[i]-PITHALF-10); },
                function(i){ return side*Math.max(HALFW+2, tr.pitOff[i]-PITHALF-16); },
                pf+tr.pitTaper, pf+pc-tr.pitTaper);
  x.fill();
  x.fillStyle='#e33b3b';
  offPath(x,tr,function(i){ return side*Math.max(HALFW+8, tr.pitOff[i]-PITHALF-10); },
                function(i){ return side*Math.max(HALFW+5, tr.pitOff[i]-PITHALF-13); },
                pf+tr.pitTaper, pf+pc-tr.pitTaper);
  x.fill();
  // pit entry / exit arrows
  function marker(idx,text,col){
    var o4=side*(HALFW-16);
    x.save();
    x.translate(tr.px[idx]+tr.nx[idx]*o4, tr.py[idx]+tr.ny[idx]*o4);
    x.rotate(tr.ang[idx]);
    x.fillStyle=col; x.fillRect(-16,-7,32,14);
    x.fillStyle='#101520'; x.font='bold 9px monospace'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText(text,0,1);
    x.restore();
  }
  marker(tr.pitGateIn,'PIT','#ffd23f');
  marker((tr.pitFrom+4)%N,'PIT >','#ffd23f');

  // --- barriers ---
  function tyreWall(i,o){
    var px2=tr.px[i]+tr.nx[i]*o, py2=tr.py[i]+tr.ny[i]*o;
    x.drawImage(props.tyre, (px2-4)|0, (py2-4)|0);
  }
  for(var i6=0;i6<N;i6+=3){
    tyreWall(i6, -side*tr.wallOut[i6]);
    if(tr.pitOff[i6]>HALFW+24) tyreWall(i6, side*(tr.pitOff[i6]+PITHALF+4));
    else tyreWall(i6, side*tr.wallPit[i6]);
  }
  // marshal posts
  for(var i7=0;i7<N;i7+=46) {
    var mo=-side*(tr.wallOut[i7]+12);
    x.drawImage(props.post, (tr.px[i7]+tr.nx[i7]*mo-3)|0, (tr.py[i7]+tr.ny[i7]*mo-5)|0);
  }

  // --- start / finish + sector lines ---
  function lineAcross(idx,drawFn){
    x.save();
    x.translate(tr.px[idx],tr.py[idx]);
    x.rotate(tr.ang[idx]);
    drawFn();
    x.restore();
  }
  lineAcross(tr.sfIdx,function(){
    for(var r=0;r<Math.floor(HALFW*2/8);r++){
      for(var c2=0;c2<3;c2++){
        x.fillStyle=((r+c2)%2===0)?'#f2f5fa':'#101520';
        x.fillRect(-6+c2*4, -HALFW+r*8, 4, 8);
      }
    }
    x.fillStyle='#f2f5fa'; x.fillRect(-7,-HALFW,1,HALFW*2); x.fillRect(6,-HALFW,1,HALFW*2);
  });
  lineAcross(tr.sector1,function(){ x.fillStyle='#ffd23f'; x.fillRect(-2,-HALFW,4,HALFW*2); });
  lineAcross(tr.sector2,function(){ x.fillStyle='#ffd23f'; x.fillRect(-2,-HALFW,4,HALFW*2); });
  lineAcross(tr.drs[0],function(){ x.fillStyle='#3fe6ff'; x.fillRect(-2,-HALFW,4,HALFW*2);
    x.fillStyle='#3fe6ff'; x.font='bold 12px monospace'; x.textAlign='left'; x.fillText('DRS',6,-HALFW-4); });
  lineAcross(tr.drs[1],function(){ x.fillStyle='#3fe6ff'; x.fillRect(-2,-HALFW,4,HALFW*2); });
  var detIdx=(tr.drs[0]-Math.floor(tr.N*0.06)+tr.N)%tr.N;
  tr.drsDetect=detIdx;
  lineAcross(detIdx,function(){ x.fillStyle='rgba(63,230,255,0.55)'; x.fillRect(-1,-HALFW,2,HALFW*2); });

  // --- grandstands + trackside props ---
  var propImg = props[tr.def.prop] || props.tree;
  for(var i8=0;i8<N;i8+=7){
    var outo = -side*(tr.wallOut[i8]+30);
    var wx=tr.px[i8]+tr.nx[i8]*outo, wy=tr.py[i8]+tr.ny[i8]*outo;
    if(R.next()<0.55){
      x.drawImage(propImg, (wx-7+R.range(-8,8))|0, (wy-14+R.range(-8,8))|0);
    }
  }
  // stands along the pit straight (outside)
  tr.standSpots=[];
  for(var i9=tr.pitFrom-30;i9<tr.pitFrom+tr.pitCount+30;i9+=7){
    var ii3=((i9%N)+N)%N;
    var so=-side*(tr.wallOut[ii3]+26);
    var sxp=tr.px[ii3]+tr.nx[ii3]*so, syp=tr.py[ii3]+tr.ny[ii3]*so;
    x.save(); x.translate(sxp,syp); x.rotate(tr.ang[ii3]+Math.PI/2);
    x.drawImage(props.stand,-20,-13);
    x.restore();
    tr.standSpots.push({x:sxp,y:syp,a:tr.ang[ii3]+Math.PI/2});
  }
  // a couple more stands around the lap
  for(var iA2=0;iA2<N;iA2+=Math.floor(N/6)){
    var so2=-side*(tr.wallOut[iA2]+26);
    var sxq=tr.px[iA2]+tr.nx[iA2]*so2, syq=tr.py[iA2]+tr.ny[iA2]*so2;
    for(var q=-1;q<=1;q++){
      var qq=(iA2+q*7+N)%N;
      var so3=-side*(tr.wallOut[qq]+26);
      var ax2=tr.px[qq]+tr.nx[qq]*so3, ay2=tr.py[qq]+tr.ny[qq]*so3;
      x.save(); x.translate(ax2,ay2); x.rotate(tr.ang[qq]+Math.PI/2);
      x.drawImage(props.stand,-20,-13); x.restore();
      tr.standSpots.push({x:ax2,y:ay2,a:tr.ang[qq]+Math.PI/2});
    }
  }
  // night / sunset colour wash
  if(tr.time==='NIGHT'){ x.fillStyle='rgba(10,14,34,0.34)'; x.fillRect(tr.bx,tr.by,tr.bw,tr.bh); }
  else if(tr.time==='SUNSET'){ x.fillStyle='rgba(255,120,40,0.13)'; x.fillRect(tr.bx,tr.by,tr.bw,tr.bh); }
  else if(tr.time==='OVERCAST'){ x.fillStyle='rgba(30,45,60,0.22)'; x.fillRect(tr.bx,tr.by,tr.bw,tr.bh); }

  x.restore();
  tr.world=world;

  // --- minimap ---
  var MW=196, MH=126;
  var sc=Math.min((MW-14)/tr.bw, (MH-14)/tr.bh);
  tr.mm={ s:sc, ox:MW/2 - (tr.bx+tr.bw/2)*sc, oy:MH/2 - (tr.by+tr.bh/2)*sc, w:MW, h:MH };
  var mm=mkCanvas(MW,MH);
  var mx=mm.x;
  mx.strokeStyle='rgba(255,255,255,0.30)'; mx.lineWidth=Math.max(4,HALFW*2*sc); mx.lineJoin='round';
  mx.beginPath();
  for(var iB2=0;iB2<=N;iB2+=2){
    var jj=iB2%N;
    var mxx=tr.px[jj]*sc+tr.mm.ox, myy=tr.py[jj]*sc+tr.mm.oy;
    if(iB2===0) mx.moveTo(mxx,myy); else mx.lineTo(mxx,myy);
  }
  mx.closePath(); mx.stroke();
  mx.strokeStyle='rgba(120,200,255,0.85)'; mx.lineWidth=Math.max(2,HALFW*2*sc*0.55);
  mx.stroke();
  // DRS zone highlight
  mx.strokeStyle='#3fe6ff'; mx.lineWidth=Math.max(2,HALFW*sc);
  mx.beginPath();
  var d0=tr.drs[0], d1=tr.drs[1], cnt=((d1-d0)%N+N)%N;
  for(var iC2=0;iC2<=cnt;iC2++){
    var kk=(d0+iC2)%N;
    var ex=tr.px[kk]*sc+tr.mm.ox, ey=tr.py[kk]*sc+tr.mm.oy;
    if(iC2===0) mx.moveTo(ex,ey); else mx.lineTo(ex,ey);
  }
  mx.stroke();
  // start line dot
  mx.fillStyle='#f2f5fa';
  mx.fillRect(tr.px[tr.sfIdx]*sc+tr.mm.ox-2, tr.py[tr.sfIdx]*sc+tr.mm.oy-2, 4,4);
  tr.minimap=mm.c;
  return tr;
}

var trackCache={};
function getTrack(id){
  if(trackCache[id]) return trackCache[id];
  var def=null;
  for(var i=0;i<CIRCUITS.length;i++) if(CIRCUITS[i].id===id) def=CIRCUITS[i];
  if(!def) def=CIRCUITS[0];
  var tr=buildTrack(def);
  bakeTrack(tr);
  trackCache[id]=tr;
  return tr;
}

/* ---------- 9. PHYSICS CONSTANTS ---------- */
var VMAXBASE   = 425;    // px/s
var ACC0       = 335;    // px/s^2 at low speed
var BRAKE0     = 470;
var LAT        = 285;    // lateral grip, px/s^2
var WHEELBASE  = 24;
var MAXSTEER   = 0.62;
var KMH        = 0.78;   // px/s -> km/h for the HUD
var PITSPEED   = PITLIMIT/KMH;
var WEAR_K     = 0.015;
var CAR_R      = 11;     // collision radius

/* ---------- 10. PARTICLES ---------- */
var PMAX=420, parts=new Array(PMAX), pHead=0;
for(var pi=0;pi<PMAX;pi++) parts[pi]={life:0,x:0,y:0,vx:0,vy:0,max:1,col:'#fff',size:2,grav:0,type:0};
function spawnP(x,y,vx,vy,life,col,size,type,grav){
  var p=parts[pHead]; pHead=(pHead+1)%PMAX;
  p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.col=col;p.size=size||2;p.type=type||0;p.grav=grav||0;
}
function updateParts(dt){
  for(var i=0;i<PMAX;i++){
    var p=parts[i];
    if(p.life<=0) continue;
    p.life-=dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=(1-2.2*dt); p.vy*=(1-2.2*dt);
    if(p.grav) p.vy+=p.grav*dt;
  }
}

/* ---------- 11. CAR ---------- */
function makeCar(o){
  var c={

    idx:0, lat:0, lap:-1, prevRel:0, sect:0, sectorTimes:[null,null,null],
    bestSectors:[null,null,null],
    lapStart:0, lastLap:null, bestLap:null, lapTimes:[],
    totalProg:0, pos:1,
    tyre:compoundById(o.tyre||'M'), wear:0, usedCompounds:{}, fuel:o.fuel||100,
    item:null, itemFlash:0, shield:0, boost:0, slow:0, spin:0, oiled:0,
    drs:false, drsAvail:false, drsHeld:false, ers:100, ersOn:false,
    damage:0, dnf:false, dnfReason:'',

  };
  c.usedCompounds[c.tyre.id]=true;
  if(!c.isPlayer){
    c.ai={
      aggro: o.pers==='AGGRESSIVE'?1:(o.pers==='DEFENSIVE'?0.45:0.7),

function placeOnGrid(car, tr, slot){

/* surface at a world position for a given car */
function surfaceFor(car, tr){
  var side=tr.pitSide, i=car.idx, ad=car.lat*side;
  if(car.inPit){
    var dp=Math.abs(ad - tr.pitOff[i]);
    return dp<=PITHALF? 'pit' : 'pitedge';
  }
  var a=Math.abs(car.lat);
  if(a<=HALFW-2) return 'road';
  if(a<=HALFW+9) return 'kerb';
  return 'runoff';
}

/* ---------- 12. AI BRAIN ---------- */
function aiDrive(car, tr, dt, race){
  var ai=car.ai, N=tr.N;
  // ---- pit decision
  if(!car.inPit && !car.pitReq && !car.finished){
    var needCompound = !hasTwoCompounds(car);
    var lapsLeft = tr.laps - car.lap;
    // last usable window: one lap before the end, since boxing on the final lap
    // means crossing the line inside the pit lane.
    if(needCompound && (car.lap>=ai.pitLap || car.lap>=tr.laps-2 || (car.wear>1.05 && car.pitStops<2))) car.pitReq=true;
    if(lapsLeft<=1) car.pitReq=false;   // too late to be worth the time loss
  }
  // ---- target point on the racing line
  var speed=len2(car.vx,car.vy);
  var look = 12 + Math.floor(speed/9);
  var ti=(car.idx+look)%N;
  var tx, ty, tv;
  if(car.inPit || (car.pitReq && nearPitEntry(car,tr))){
    // aim down the pit lane
    var lookP=car.inPit?8:15;
    var tp=(car.idx+lookP)%N;
    var po=tr.pitOff[tp]*tr.pitSide;
    if(!car.inPit && tr.pitOff[tp]<HALFW*0.5) po=tr.pitSide*(HALFW-5);
    ti=tp;
    tx=tr.px[tp]+tr.nx[tp]*po; ty=tr.py[tp]+tr.ny[tp]*po;
    tv=car.inPit? PITSPEED*0.95 : Math.min(tr.tv[ti], PITSPEED*1.45);
    if(car.inPit && car.pitPhase==='approach'){
      var bidx=car.boxIdx;
      var dToBox=((bidx-car.idx)%N+N)%N;
      if(dToBox<N/2) tv=Math.min(tv, 30+dToBox*2.0);
    }
  } else {
    var off=tr.line[ti]+ai.lineOff+ai.avoid;
    off=clamp(off,-(HALFW-13),HALFW-13);
    tx=tr.px[ti]+tr.nx[ti]*off; ty=tr.py[ti]+tr.ny[ti]*off;
    tv=tr.tv[ti]*ai.pace*(1-car.wear*0.14)*(car.blue?0.88:1);
    if(race.phase==='formation') tv=Math.min(tv,60);
    // mild catch-up, never a teleport: +-4% pace based on gap to the player
    tv*= race.aiCatch(car);
  }
  if(ai.mistakeT>0) tv*=0.72;
  // ---- steering
  var dx=tx-car.x, dy=ty-car.y;
  var want=Math.atan2(dy,dx);
  var err=angDiff(want, car.angle);
  var st=clamp(err*2.3,-1,1);
  if(ai.mistakeT>0) st+=Math.sin(race.time*9+car.aiJitter)*0.45;
  car.steer=st;
  // ---- throttle / brake
  var over=speed-tv;
  if(over>18){ car.throttle=0; car.brake=clamp(over/70,0.25,1); }
  else if(over>2){ car.throttle=0.15; car.brake=0; }
  else { car.throttle=clamp(1-over/40,0.35,1); car.brake=0; }
  if(race.phase==='lights'||race.phase==='grid'){ car.throttle=0; car.brake=1; car.steer=0; }
  if(race.phase==='green' && race.startT<ai.react){ car.throttle=0.0; car.brake=0.2; }
  // ---- avoid the car ahead / overtake
  ai.avoid *= (1-2*dt);
  var ahead=race.carAhead(car, 92);
  if(ahead && !car.inPit){
    var rel=angDiff(Math.atan2(ahead.y-car.y, ahead.x-car.x), car.angle);
    if(Math.abs(rel)<0.55){
      var d=len2(ahead.x-car.x,ahead.y-car.y);
      var sideSign = (ahead.lat > car.lat)? -1 : 1;
      ai.avoid += sideSign * (1-d/92) * (16+ai.aggro*26) * dt * 5;
      if(d<38){ car.throttle*=0.55; }
      // defending: the car ahead moves to cover if it is a defensive type
      if(ahead.ai && ahead.ai.aggro<0.6 && !ahead.inPit){
        ahead.ai.avoid += (car.lat-ahead.lat>0?1:-1)*11*dt*4;
      }
    }
  }
  ai.avoid=clamp(ai.avoid,-26,26);
  // ---- mistakes
  if(ai.mistakeT>0) ai.mistakeT-=dt;
  else if(Math.random() < dt*(0.030*(1.25-car.skill)) && race.phase==='race' && !car.inPit){
    ai.mistakeT=rnd(0.4,1.1);
  }
  // ---- item use
  if(car.item && race.phase==='race'){
    var use=false;
    if(car.item==='boost') use = Math.abs(tr.curv[car.idx])<0.0018 && speed>200;
    else if(car.item==='missile') use = !!race.carAhead(car,340);
    else if(car.item==='oil') use = !!race.carBehind(car,150);
    else if(car.item==='shield') use = car.pos>2 || !!race.carBehind(car,120);
    else if(car.item==='bolt') use = car.pos>1;
    else if(car.item==='fresh') use = car.wear>0.5;
    if(use && Math.random()<dt*3.5) useItem(car,race);
  }
  // ---- DRS
  car.drsHeld = car.drsAvail;
  car.ersOn = (car.ers>25 && speed>170 && Math.abs(tr.curv[car.idx])<0.0016 && ai.aggro>0.5);
}
function nearPitEntry(car,tr){
  var d=((tr.pitGateIn-car.idx)%tr.N+tr.N)%tr.N;
  return d < Math.floor(tr.N*0.16);
}
function hasTwoCompounds(car){
  var n=0; for(var k in car.usedCompounds) n++;
  return n>=2;
}

/* ---------- 13. ITEMS ---------- */
function useItem(car, race){
  if(!car.item || car.dnf || car.finished) return;
  var id=car.item; car.item=null; car.itemFlash=0.45;
  if(id==='boost'){
    car.boost=Math.max(car.boost,1.9); SFX.boost();
    car.msg='TURBO!'; car.msgT=1.1;
  } else if(id==='missile'){
    race.fireMissile(car); SFX.missile();
    car.msg='HOMER AWAY'; car.msgT=1.1;
  } else if(id==='oil'){
    race.dropOil(car); SFX.oil();
    car.msg='OIL DOWN'; car.msgT=1.0;
  } else if(id==='shield'){
    car.shield=Math.max(car.shield,6.5); SFX.shield();
    car.msg='SHIELD UP'; car.msgT=1.1;
  } else if(id==='bolt'){
    race.lightning(car); SFX.bolt();
    car.msg='LIGHTNING!'; car.msgT=1.4;
  } else if(id==='fresh'){
    car.wear=Math.max(0,car.wear-0.55);
    car.damage=Math.max(0,car.damage-30);
    SFX.fresh(); car.msg='TYRES FRESHENED'; car.msgT=1.3;
    for(var i=0;i<10;i++) spawnP(car.x,car.y,rnd(-60,60),rnd(-60,60),0.5,'#7ce827',2,0);
  }
}
function spinCar(car, power){
  if(car.shield>0){ car.shield=0; SFX.shield(); car.msg='BLOCKED!'; car.msgT=1.0;
    for(var i=0;i<12;i++) spawnP(car.x,car.y,rnd(-120,120),rnd(-120,120),0.4,'#3fe6ff',2,0);
    return false; }
  car.spin=power||1.1; car.spinDir=Math.random()<0.5?-1:1;
  car.msg='SPUN!'; car.msgT=1.2;
  car.damage+=6;
  return true;
}

/* ---------- 14. RACE ---------- */
function crossedFwd(prev, cur, gate, N){
  var a=((prev-gate)%N+N)%N, b=((cur-gate)%N+N)%N;
  return (a>N*0.75 && b<N*0.25);
}
function Race(cfg){
  var self=this;
  this.tr = cfg.track;
  this.laps = cfg.laps || this.tr.laps;
  this.cars = cfg.cars;
  this.players = cfg.players;
  this.time = 0;
  this.phase = 'grid';       // grid -> lights -> green -> race -> chequered -> done
  this.phaseT = 0;
  this.lightCount = 0;
  this.startT = 0;
  this.missiles = [];
  this.oils = [];
  this.finishCount = 0;
  this.leaderFinished = false;
  this.leaderFinishT = 0;
  this.fastestLap = null;
  this.fastestName = '';
  this.bestSector = [null,null,null];
  this.msg=''; this.msgT=0;
  this.shake=0;
  this.markCount=0;
  this.order = this.cars.slice();
  this.rng = new RNG(Date.now()&0xffff);

  this.carAhead=function(car, maxD){
    var best=null, bd=maxD*maxD;
    for(var i=0;i<self.cars.length;i++){
      var o=self.cars[i];
      if(o===car||o.dnf) continue;
      var dx=o.x-car.x, dy=o.y-car.y, d=dx*dx+dy*dy;
      if(d>bd) continue;
      var rel=angDiff(Math.atan2(dy,dx), car.angle);
      if(Math.abs(rel)<0.62){ bd=d; best=o; }
    }
    return best;
  };
  this.carBehind=function(car, maxD){
    var best=null, bd=maxD*maxD;
    for(var i=0;i<self.cars.length;i++){
      var o=self.cars[i];
      if(o===car||o.dnf) continue;
      var dx=o.x-car.x, dy=o.y-car.y, d=dx*dx+dy*dy;
      if(d>bd) continue;
      var rel=angDiff(Math.atan2(dy,dx), car.angle);
      if(Math.abs(rel)>2.5){ bd=d; best=o; }
    }
    return best;
  };
  // mild, honest catch-up: no teleporting, +/-3.5% pace only
  this.aiCatch=function(car){
    var p=null;
    for(var i=0;i<self.cars.length;i++) if(self.cars[i].isPlayer && !self.cars[i].dnf){ p=self.cars[i]; break; }
    if(!p) return 1;
    var d = (p.totalProg - car.totalProg)*SPACING;
    if(d>900) return 1.035;
    if(d<-900) return 0.972;
    return 1 + clamp(d/900,-1,1)*0.02;
  };
  this.fireMissile=function(car){
    var t=null, bestD=1e9;
    for(var i=0;i<self.cars.length;i++){
      var o=self.cars[i];
      if(o===car||o.dnf||o.finished) continue;
      if(o.totalProg<=car.totalProg) continue;      // only targets cars ahead
      var d=o.totalProg-car.totalProg;
      if(d<bestD){ bestD=d; t=o; }
    }
    // a missile fired with nobody ahead still flies, then self-destructs
    self.missiles.push({ x:car.x+Math.cos(car.angle)*20, y:car.y+Math.sin(car.angle)*20,
      a:car.angle, v:330, target:t, life:4.2, owner:car, seek:(t?1:0) });
  };
  this.dropOil=function(car){
    self.oils.push({ x:car.x-Math.cos(car.angle)*20, y:car.y-Math.sin(car.angle)*20, life:16, r:17 });
    if(self.oils.length>14) self.oils.shift();
  };
  this.lightning=function(car){
    for(var i=0;i<self.cars.length;i++){
      var o=self.cars[i];
      if(o===car||o.dnf||o.finished) continue;
      if(o.totalProg>car.totalProg){
        if(o.shield>0){ o.shield=0; continue; }
        o.slow=Math.max(o.slow,2.6);
        o.wear=Math.min(1.3,o.wear+0.05);
        for(var k=0;k<6;k++) spawnP(o.x,o.y,rnd(-90,90),rnd(-90,90),0.45,'#fff35e',2,0);
      }
    }
    self.msg='LIGHTNING STRIKE'; self.msgT=1.6;
    self.shake=Math.max(self.shake,6);
  };
}

Race.prototype.start=function(){
  this.phase='lights'; this.phaseT=0; this.lightCount=0;
};
Race.prototype.playerCar=function(n){
  for(var i=0;i<this.cars.length;i++) if(this.cars[i].isPlayer && this.cars[i].pnum===n) return this.cars[i];
  return null;
};
Race.prototype.update=function(dt){
  var tr=this.tr, i;
  this.time+=dt;
  if(this.msgT>0) this.msgT-=dt;
  if(this.shake>0) this.shake=Math.max(0,this.shake-dt*14);

  // ---- start sequence: five red lights, then out they go
  if(this.phase==='grid'){
    this.phaseT+=dt;
    if(this.phaseT>2.0){ this.phase='lights'; this.phaseT=0; this.lightCount=0; }
  } else if(this.phase==='lights'){
    this.phaseT+=dt;
    var want=Math.min(5, Math.floor(this.phaseT/0.85)+1);
    if(want>this.lightCount && this.lightCount<5){ this.lightCount=want; SFX.light(); }
    if(this.lightCount>=5 && this.phaseT > 5*0.85 + this.holdTime()){
      this.phase='green'; this.phaseT=0; this.startT=0; SFX.green();
      this.msg='GO!'; this.msgT=1.4;
    }
  } else if(this.phase==='green'){
    this.phaseT+=dt; this.startT+=dt;
    if(this.phaseT>2.2){ this.phase='race'; }
  } else if(this.phase==='chequered'){
    this.phaseT+=dt;
  }

  // ---- aero: tow + dirty air
  for(i=0;i<this.cars.length;i++){
    var c=this.cars[i]; c.tow=0; c.dirty=0;
    if(c.dnf) continue;
    var a=this.carAhead(c,140);
    if(a){
      var d=len2(a.x-c.x,a.y-c.y);
      var f=clamp((140-d)/140,0,1);
      c.tow=f*f;
      c.dirty=f*0.9;
    }
  }
  // ---- cars
  for(i=0;i<this.cars.length;i++) updateCar(this.cars[i], tr, dt, this);
  // ---- collisions
  for(i=0;i<this.cars.length;i++){
    var A=this.cars[i];
    if(A.dnf) continue;
    for(var j=i+1;j<this.cars.length;j++){
      var B=this.cars[j];
      if(B.dnf) continue;
      var dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy;
      var R2=(CAR_R*2)*(CAR_R*2);
      if(d2>R2||d2<0.0001) continue;
      var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=(CAR_R*2-d)*0.5;
      A.x-=nx*ov; A.y-=ny*ov; B.x+=nx*ov; B.y+=ny*ov;
      var rvx=B.vx-A.vx, rvy=B.vy-A.vy, vn=rvx*nx+rvy*ny;
      if(vn<0){
        var imp=-vn*0.62;
        A.vx-=nx*imp; A.vy-=ny*imp;
        B.vx+=nx*imp; B.vy+=ny*imp;
        var mag=Math.abs(vn);
        if(mag>60){
          SFX.thump(clamp(mag/300,0.1,1));
          A.damage+=mag*0.020; B.damage+=mag*0.020;
          if(A.isPlayer||B.isPlayer) this.shake=Math.max(this.shake, clamp(mag/40,1,7));
          for(var k=0;k<3;k++) spawnP((A.x+B.x)/2,(A.y+B.y)/2,rnd(-90,90),rnd(-90,90),0.35,'#ffd23f',2,0);
        } else if(mag>18){ SFX.scrape(clamp(mag/90,0.1,1)); }
        A.omega += (ny*nx>0?0.4:-0.4)*mag*0.004;
        B.omega -= (ny*nx>0?0.4:-0.4)*mag*0.004;
      }
    }
  }
  // ---- missiles
  for(i=this.missiles.length-1;i>=0;i--){
    var m=this.missiles[i];
    m.life-=dt;
    if(m.target && (m.target.dnf||m.target.finished)) m.target=null;
    if(m.target){
      var want2=Math.atan2(m.target.y-m.y, m.target.x-m.x);
      var e=angDiff(want2,m.a);
      m.a += clamp(e,-3.2*dt,3.2*dt);
    }
    m.x+=Math.cos(m.a)*m.v*dt; m.y+=Math.sin(m.a)*m.v*dt;
    if(this.time%0.02<dt) spawnP(m.x,m.y,rnd(-20,20),rnd(-20,20),0.35,'#ff9f1c',2,0);
    var boom=false;
    for(var q=0;q<this.cars.length;q++){
      var o=this.cars[q];
      if(o===m.owner||o.dnf) continue;
      if(len2(o.x-m.x,o.y-m.y)<16){
        if(spinCar(o,1.2)){ o.vx*=0.35; o.vy*=0.35; }
        boom=true; break;
      }
    }
    // expiry: a missile fired at nobody simply detonates harmlessly
    if(m.life<=0) boom=true;
    if(boom){
      SFX.blast();
      for(var w=0;w<14;w++) spawnP(m.x,m.y,rnd(-190,190),rnd(-190,190),0.5,(w%2?'#ffd23f':'#ff4d2e'),3,0);
      this.shake=Math.max(this.shake,4);
      this.missiles.splice(i,1);
    }
  }
  // ---- oil
  for(i=this.oils.length-1;i>=0;i--){
    this.oils[i].life-=dt;
    if(this.oils[i].life<=0) this.oils.splice(i,1);
  }
  // ---- item pads respawn
  for(i=0;i<tr.pads.length;i++) if(tr.pads[i].t>0) tr.pads[i].t-=dt;

  updateParts(dt);
  this.updateOrder();
  this.updateFlags();

  // ---- race finish bookkeeping
  // safety net: if the whole field retires nobody ever takes the flag, so
  // leaderFinished stays false and the race would never reach 'done'.
  if(this.phase!=='done' && this.phase!=='grid' && this.phase!=='lights'){
    var running=0;
    for(i=0;i<this.cars.length;i++) if(!this.cars[i].finished && !this.cars[i].dnf) running++;
    if(running===0){ this.classify(); this.phase='done'; }
  }
  if(this.leaderFinished){
    this.leaderFinishT+=dt;
    var allDone=true;
    for(i=0;i<this.cars.length;i++){ var cc=this.cars[i]; if(!cc.finished && !cc.dnf) allDone=false; }
    if(allDone || this.leaderFinishT>26){
      if(this.phase!=='done'){ this.classify(); this.phase='done'; }
    }
  }
};
Race.prototype.holdTime=function(){
  if(this._hold===undefined) this._hold = rnd(0.9,2.0);
  return this._hold;
};
Race.prototype.updateOrder=function(){
  var arr=this.order;
  arr.sort(function(a,b){
    if(a.dnf!==b.dnf) return a.dnf?1:-1;
    if(a.finished&&b.finished) return a.finishOrder-b.finishOrder;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProg-a.totalProg;
  });
  for(var i=0;i<arr.length;i++){
    arr[i].pos=i+1;
    // time gap to the car ahead
    if(i===0) arr[i].gap=0;
    else {
      var ahead=arr[i-1];
      var dProg=(ahead.totalProg-arr[i].totalProg)*SPACING;
      var sp=Math.max(70,len2(arr[i].vx,arr[i].vy));
      arr[i].gap=dProg/sp;
    }
  }
};
Race.prototype.updateFlags=function(){
  var leader=this.order[0];
  for(var i=0;i<this.cars.length;i++){
    var c=this.cars[i];
    c.blue=false;
    if(c===leader||c.dnf||c.finished) continue;
    for(var j=0;j<this.cars.length;j++){
      var o=this.cars[j];
      if(o===c||o.dnf) continue;
      if(o.lap>c.lap && len2(o.x-c.x,o.y-c.y)<150){
        var rel=angDiff(Math.atan2(c.y-o.y,c.x-o.x),o.angle);
        if(Math.abs(rel)<0.7){ c.blue=true; break; }
      }
    }
  }
};
Race.prototype.classify=function(){
  var arr=this.cars.slice();
  for(var i=0;i<arr.length;i++){
    var c=arr[i];
    if(!c.finished && !c.dnf){
      // took the flag late / classified on distance
      c.finished=true; c.finishTime=this.time + Math.max(0,(this.laps*this.tr.N - c.totalProg))*0.06;
      c.finishOrder=1000+i;
      c.classifiedOnly=true;
    }
    c.finalTime = c.finished? c.finishTime + c.penalty : Infinity;
  }
  arr.sort(function(a,b){
    if(a.dnf!==b.dnf) return a.dnf?1:-1;
    if(a.finalTime!==b.finalTime) return a.finalTime-b.finalTime;
    return b.totalProg-a.totalProg;     // dead heat -> whoever covered more distance
  });
  this.result=arr;
  for(var j=0;j<arr.length;j++){
    arr[j].finalPos=j+1;
    arr[j].points = (!arr[j].dnf && j<POINTS.length)? POINTS[j] : 0;
    arr[j].deadHeat = (j>0 && Math.abs(arr[j].finalTime-arr[j-1].finalTime)<0.004);
  }
  // fastest lap point (top 10 only, F1 style)
  if(this.fastestLap!=null){
    for(var k=0;k<arr.length;k++){
      if(arr[k].bestLap===this.fastestLap && k<10 && !arr[k].dnf){ arr[k].points+=1; arr[k].fl=true; break; }
    }
  }
};

/* ---------- 15. PLAYER CONTROLS ---------- */
function playerDrive(car, tr, dt, race){
  var b=BIND[car.pnum-1];
  var th = keys[b.up]?1:0, br = keys[b.down]?1:0;
  var l  = keys[b.left]?1:0, r = keys[b.right]?1:0;
  car.hand = keys[b.hand]?1:0;
  var target = r-l;
  if(save.settings.assistSteer && car.spin<=0 && !car.inPit){
    var N=tr.N, look=(car.idx+10+Math.floor(len2(car.vx,car.vy)/22))%N;
    var aimErr=angDiff(tr.ang[look], car.angle);
    var assist=clamp(aimErr*1.15,-0.5,0.5);
    target = clamp(target*1.0 + assist*(0.34 - Math.abs(target)*0.18), -1, 1);
  }
  car.steer += (target-car.steer)*clamp(dt*13,0,1);
  car.throttle=th; car.brake=br;
  if(race.phase==='grid'||race.phase==='lights'){ car.brake=Math.max(car.brake,0.6); }
  if(hit(b.item)) useItem(car,race);
  car.drsHeld = !!keys[b.drs] || (save.settings.autoDRS && car.drsAvail);
  car.ersOn = !!keys[b.ers] && car.ers>1 && th>0;
  car.lookBack = !!keys[b.look];
}

/* ---------- 16. THE CAR UPDATE ---------- */
function updateCar(car, tr, dt, race){
  var N=tr.N, side=tr.pitSide;
  if(car.msgT>0) car.msgT-=dt;
  if(car.itemFlash>0) car.itemFlash-=dt;
  if(car.penTimer>0) car.penTimer-=dt;

  if(car.dnf){
    car.vx*=(1-3*dt); car.vy*=(1-3*dt);
    car.x+=car.vx*dt; car.y+=car.vy*dt;
    if(Math.random()<dt*14) spawnP(car.x,car.y,rnd(-24,24),-rnd(12,40),1.1,'#59606e',3,1);
    return;
  }
  // ---- brain
  if(car.isPlayer && !car.finished) playerDrive(car,tr,dt,race);
  else if(!car.isPlayer) aiDrive(car,tr,dt,race);
  if(car.finished){ // cruise down after the flag
    car.throttle=0.28; car.brake=0; car.item=null;
    var Nl=(car.idx+12)%N, aerr=angDiff(tr.ang[Nl],car.angle);
    car.steer=clamp(aerr*2.0,-1,1);
  }
  // the stop itself overrides both brains: nobody drives through their own pit box
  if(car.pitPhase==='stopping'||car.pitPhase==='stopped'){
    car.throttle=0; car.brake=1; car.steer*=0.25;
  }
  if(race.phase==='grid'||race.phase==='lights'){
    if(car.isPlayer && car.throttle>0 && len2(car.vx,car.vy)>16 && !car.jumpStart){
      car.jumpStart=true; car.penalty+=5; car.penMsg='JUMP START +5s'; car.penTimer=3.2; SFX.penalty();
    }
  }

  // ---- effect timers
  if(car.boost>0) car.boost-=dt;
  if(car.slow>0) car.slow-=dt;
  if(car.shield>0) car.shield-=dt;
  if(car.oiled>0) car.oiled-=dt;
  if(car.spin>0){ car.spin-=dt; car.throttle=0; }

  // ---- surface
  var surf=surfaceFor(car,tr);
  var sg=1, rolling=0;
  if(surf==='kerb'){ sg=0.87; rolling=0.35; }
  else if(surf==='runoff'){ sg=0.50; rolling=2.4; }
  else if(surf==='pitedge'){ sg=0.48; rolling=2.6; }
  if(tr.weather==='RAIN') sg*=0.85;
  if(car.oiled>0) sg*=0.35;

  var cs=car.chassis;
  var wearCliff = car.wear>0.85 ? (car.wear-0.85)*0.55 : 0;
  var tyreGrip = Math.max(0.42, car.tyre.grip*(1-Math.min(car.wear,1.3)*0.30) - wearCliff);
  var massF = 1 + car.fuel*0.0014;
  var gripBase = LAT*cs.grip*sg*tyreGrip*(1-car.dirty*0.13);

  // ---- decompose velocity
  var ca=Math.cos(car.angle), sa=Math.sin(car.angle);
  var vf = car.vx*ca + car.vy*sa;
  var vr = -car.vx*sa + car.vy*ca;
  var speed=Math.abs(vf);

  // ---- DRS + boost + top speed
  var inDRSzone = (function(){
    var a=((car.idx-tr.drs[0])%N+N)%N, span=((tr.drs[1]-tr.drs[0])%N+N)%N;
    return a<span;
  })();
  var gapOK = (car.gap!==undefined && car.gap>0 && car.gap<1.0);
  car.drsAvail = inDRSzone && gapOK && car.lap>=0 && tr.weather!=='RAIN' && !car.inPit && race.phase==='race' && !car.finished;
  car.drs = car.drsAvail && car.drsHeld && car.brake<0.2 && speed>120;
  if(car.ersOn && car.ers>0){ car.ers=Math.max(0,car.ers-26*dt); if(car.ers<=0) car.ersOn=false; }
  else car.ers=Math.min(100, car.ers + (car.brake>0?26:9)*dt);

  var vtop = VMAXBASE*cs.power;
  if(car.drs) vtop*=1.115;
  if(car.boost>0) vtop*=1.34;
  if(car.ersOn) vtop*=1.06;
  vtop *= (1+car.tow*0.085);
  if(car.slow>0) vtop*=0.60;
  if(car.fuel<=0) vtop*=0.5;
  vtop *= (1-Math.min(car.damage,90)*0.0016);
  var limiter = car.inPit;
  if(limiter) vtop=Math.min(vtop, PITSPEED);

  // ---- longitudinal
  var acc = ACC0*cs.power/massF;
  if(car.boost>0) acc*=1.95;
  if(car.ersOn) acc*=1.22;
  if(surf==='runoff') acc*=0.52;
  if(car.spin>0) acc*=0.2;
  if(vf<vtop) vf += car.throttle*acc*(1-clamp(vf/vtop,0,1))*dt;
  if(vf>vtop) vf -= (vf-vtop)*(limiter?9:2.2)*dt;
  // reverse only after holding the brake at a standstill, and never on the grid
  if(car.brake>0 && Math.abs(vf)<6) car.brakeHold=(car.brakeHold||0)+dt; else car.brakeHold=0;
  var mayReverse = car.brakeHold>0.45 && race.phase!=='grid' && race.phase!=='lights' && !car.finished;
  if(car.brake>0){
    if(vf>4) vf -= BRAKE0*cs.brake*sg*tyreGrip*dt*car.brake;
    else if(mayReverse){ vf -= 130*dt*car.brake; if(vf<-115) vf=-115; }
    else if(vf>0) vf=Math.max(0, vf-BRAKE0*dt*car.brake);
  }
  var sgn = vf>0?1:(vf<0?-1:0);
  vf -= (vf*0.16 + sgn*7 + vf*rolling)*dt*(car.throttle>0?0.4:1);
  if(car.hand) vf -= vf*1.3*dt;

  // ---- pit speeding
  if(car.inPit){
    if(vf > PITSPEED*1.10){
      car.pitSpeedT=(car.pitSpeedT||0)+dt;
      if(car.pitSpeedT>0.30 && !car.pitSpeedPen){
        car.pitSpeedPen=true; car.penalty+=5; car.penMsg='PIT SPEEDING +5s'; car.penTimer=3.2; SFX.penalty();
      }
    }
  } else { car.pitSpeedT=0; }

  // ---- steering / yaw
  var wt = 1 + car.brake*0.17 - car.throttle*0.09;
  var gripY = gripBase*wt;
  var steerA = MAXSTEER*car.steer*(0.40+0.60*clamp(1-speed/560,0,1));
  var omegaDes=0, under=0;
  if(speed>7){
    omegaDes = (vf*Math.tan(steerA))/WHEELBASE;
    var need = Math.abs(vf*omegaDes);
    if(need>gripY && need>0.0001){ under=1-gripY/need; omegaDes*=gripY/need; }
  }
  if(car.hand) omegaDes*=1.8;
  if(car.spin>0) omegaDes = car.spinDir*5.2;
  car.omega += (omegaDes-car.omega)*clamp(dt*10,0,1);
  car.under=under;

  // ---- lateral grip / slide
  var latGrip = gripBase*(car.hand?0.42:1)*(1-under*0.22);
  var latAcc = -vr*8.4;
  var sliding=0;
  if(Math.abs(latAcc)>latGrip){
    sliding=clamp((Math.abs(latAcc)-latGrip)/260,0,1);
    latAcc=(latAcc>0?1:-1)*latGrip;
  }
  vr += latAcc*dt;
  car.slide=sliding;
  car.slip=Math.abs(vr);

  // ---- rebuild world velocity in the OLD basis (this is what creates slip)
  car.vx = ca*vf - sa*vr;
  car.vy = sa*vf + ca*vr;
  car.angle += car.omega*dt;

  // ---- stability assist (gentle auto counter-steer)
  if(save.settings.assistStability && car.isPlayer && car.spin<=0 && speed>45){
    var slipAng=angDiff(Math.atan2(car.vy,car.vx), car.angle);
    if(Math.abs(slipAng)>0.30 && Math.abs(slipAng)<2.0){
      car.angle += clamp(slipAng,-1,1)*2.6*dt;
      car.omega *= (1-1.6*dt);
    }
  }
  if(car.angle>Math.PI) car.angle-=Math.PI*2;
  if(car.angle<-Math.PI) car.angle+=Math.PI*2;

  // ---- integrate
  car.x += car.vx*dt; car.y += car.vy*dt;

  // ---- project onto the circuit
  var prevIdx=car.idx;
  var pr=project(tr,car.x,car.y,car.idx, car.inPit?12:24);
  car.idx=pr.i; car.lat=pr.lat;

  // ---- pit entry / exit gates
  // an AI that has committed to the stop gets a generous gate: traffic can shove
  // it to the wrong side of the entry and it has no second chance on the last lap
  var entryThresh = car.isPlayer? HALFW*0.62 : (car.pitReq? -12 : HALFW*0.86);
  if(!car.inPit && !car.finished && crossedFwd(prevIdx,car.idx,tr.pitGateIn,N) && car.lat*side > entryThresh){
    car.inPit=true; car.pitPhase='approach';
    car.boxIdx=tr.boxes[Math.min(tr.boxes.length-1,car.gridPos)].i;
    car.pitSpeedPen=false; car.pitSpeedT=0;
    // a car that wandered in with nothing to do just drives through and loses the time
    car.pitService = car.isPlayer || car.pitReq || !hasTwoCompounds(car) || car.wear>0.9 || car.damage>45;
    car.pitReq=false;
    if(car.isPlayer){ car.msg='PIT LANE - 80 KM/H'; car.msgT=2.0; }
  }
  if(car.inPit && crossedFwd(prevIdx,car.idx,tr.pitGateOut,N)){
    car.inPit=false; car.pitPhase='';
    if(car.isPlayer){ car.msg='PIT EXIT - MIND THE TRAFFIC'; car.msgT=2.0; }
  }

  // ---- pit stop state machine
  if(car.inPit){
    var dToBox=((car.boxIdx-car.idx)%N+N)%N;
    var passed = dToBox>N*0.5;
    if(car.pitPhase==='approach' && car.pitService){
      if(!passed && dToBox<11){ car.pitPhase='stopping'; }
      else if(passed && ((car.idx-car.boxIdx)%N+N)%N < 40){ car.pitPhase='stopping'; }
    }
    if(car.pitPhase==='stopping'){
      car.throttle=0; car.brake=1;
      car.vx*=(1-5.5*dt); car.vy*=(1-5.5*dt);
      if(len2(car.vx,car.vy)<12){
        car.pitPhase='stopped';
        car.pitTimer = 2.15 + Math.random()*0.5 + (100-car.fuel)*0.010;
        car.pitTotal = car.pitTimer;
        car.pitChoice = pitDefaultCompound(car);
        car.pitAnim=0;
        SFX.gun();
      }
    }
    if(car.pitPhase==='stopped'){
      car.throttle=0; car.brake=1; car.vx=0; car.vy=0; car.omega=0;
      var bp=tr.boxes[Math.min(tr.boxes.length-1,car.gridPos)];
      car.x=lerp(car.x,bp.x,clamp(dt*7,0,1));
      car.y=lerp(car.y,bp.y,clamp(dt*7,0,1));
      car.angle=car.angle+angDiff(tr.ang[bp.i],car.angle)*clamp(dt*7,0,1);
      car.pitAnim+=dt;
      car.pitTimer-=dt;
      if(car.isPlayer){
        var bb=BIND[car.pnum-1];
        if(hit(bb.left)||hit(bb.up)) { car.pitChoice=cycleCompound(car.pitChoice,-1); SFX.menu(); }
        if(hit(bb.right)||hit(bb.down)){ car.pitChoice=cycleCompound(car.pitChoice, 1); SFX.menu(); }
      } else if(car.pitAnim<0.1){
        car.pitChoice=pitDefaultCompound(car);
      }
      if(car.pitTimer<=0){
        car.tyre=compoundById(car.pitChoice);
        car.usedCompounds[car.tyre.id]=true;
        car.wear=0; car.tyreAge=0;
        car.fuel=100;
        car.damage=Math.max(0,car.damage-18);
        car.pitStops++;
        car.pitPhase='release';
        car.msg='TYRES: '+car.tyre.name; car.msgT=1.6;
        SFX.pickup();
      }
    }
    if(car.pitPhase==='release'){
      car.brake=0;
      if(!car.isPlayer) car.throttle=1;
      if(len2(car.vx,car.vy)>30) car.pitPhase='out';
    }
  }

  // ---- track limits / walls
  var latPit=car.lat*side;
  if(car.inPit){
    var centre=tr.pitOff[car.idx];
    var d=latPit-centre;
    var lim=(PITHALF-3) + (1-clamp(centre/PITO,0,1))*(HALFW-4);
    if(Math.abs(d)>lim){
      var push=(Math.abs(d)-lim)*(d>0?1:-1);
      car.x -= tr.nx[car.idx]*side*push;
      car.y -= tr.ny[car.idx]*side*push;
      wallImpact(car,tr,(d>0?-1:1)*side, race, 0.5);
    }
  } else {
    var maxPit=tr.wallPit[car.idx], maxOut=tr.wallOut[car.idx];
    var targetLat=null, wallSide=0;
    if(latPit>maxPit){ targetLat=maxPit*side; wallSide=-side; }
    else if(latPit<-maxOut){ targetLat=-maxOut*side; wallSide=side; }
    if(targetLat!==null){
      var dL=targetLat-car.lat;
      car.x += tr.nx[car.idx]*dL; car.y += tr.ny[car.idx]*dL;
      car.lat=targetLat;
      wallImpact(car,tr,wallSide,race,1);
    }
  }
  // last-resort sanity net: a car can never be allowed to go non-finite
  if(!isFinite(car.x)||!isFinite(car.y)||!isFinite(car.vx)||!isFinite(car.vy)||Math.abs(car.lat)>600){
    car.vx=0; car.vy=0; car.omega=0; car.x=tr.lx[car.idx]; car.y=tr.ly[car.idx];
    car.angle=tr.ang[car.idx]; car.lat=0; car.inPit=false; car.pitPhase='';
  }

  // ---- stuck against a barrier -> recover
  var spd2=len2(car.vx,car.vy);
  if(spd2<22 && (surf==='runoff'||car.touchWall) && race.phase==='race' && !car.finished){
    car.stuck+=dt;
    if(car.stuck>2.6){
      recoverCar(car,tr);
      car.stuck=0;
    }
  } else if(spd2>40) car.stuck=0;
  car.touchWall=false;

  // ---- wrong way
  var fwdDot = car.vx*tr.tx[car.idx] + car.vy*tr.ty[car.idx];
  if(fwdDot < -35 && !car.inPit){ car.wrongWay=Math.min(2,car.wrongWay+dt); }
  else car.wrongWay=Math.max(0,car.wrongWay-dt*2);

  // ---- track limits abuse
  if(!car.inPit && Math.abs(car.lat)>HALFW+27 && spd2>110 && race.phase==='race'){
    car.offTrack+=dt;
    if(car.offTrack>1.1 && car.cutTimer<=0){
      car.cutTimer=5.0; car.cuts++; car.lapValid=false;
      if(car.cuts%3===0){ car.penalty+=5; car.penMsg='TRACK LIMITS +5s'; car.penTimer=3.2; SFX.penalty(); }
      else if(car.isPlayer){ car.msg='TRACK LIMITS ('+(car.cuts%3)+'/3)'; car.msgT=1.6; }
    }
  } else car.offTrack=Math.max(0,car.offTrack-dt);
  if(car.cutTimer>0) car.cutTimer-=dt;

  // ---- item pads
  if(!car.item && !car.inPit && !car.finished){
    for(var pdi=0;pdi<tr.pads.length;pdi++){
      var pad=tr.pads[pdi];
      if(pad.t>0) continue;
      if(Math.abs(pad.i-car.idx)>18 && Math.abs(Math.abs(pad.i-car.idx)-N)>18) continue;
      if(len2(pad.x-car.x,pad.y-car.y)<17){
        pad.t=4.5;
        var frac=(car.pos-1)/Math.max(1,race.cars.length-1);
        car.item=rollItem(frac, race.rng);
        car.itemFlash=0.6;
        if(car.isPlayer) SFX.pickup();
        for(var pk=0;pk<6;pk++) spawnP(pad.x,pad.y,rnd(-90,90),rnd(-90,90),0.4,'#ffd23f',2,0);
        break;
      }
    }
  }
  // ---- oil slicks
  for(var oi=0;oi<race.oils.length;oi++){
    var ol=race.oils[oi];
    if(len2(ol.x-car.x,ol.y-car.y)<ol.r+6){
      if(car.oiled<=0 && spd2>60){
        if(car.shield>0){ car.shield=0; SFX.shield(); }
        else { car.oiled=1.35; car.omega+=(Math.random()<0.5?-1:1)*2.4; car.msg='OIL!'; car.msgT=0.9; SFX.oil(); }
      }
    }
  }

  // ---- tyres, fuel, damage
  var wearRate=(0.32 + car.slide*1.9 + spd2/1100)*car.tyre.wear*WEAR_K;
  if(surf!=='road') wearRate*=1.35;
  if(car.inPit) wearRate*=0.2;
  car.wear=Math.min(1.3, car.wear+wearRate*dt);
  car.tyreAge+=dt;
  // burn rate is sized so a clean 3-lap run finishes with a margin: at 2.35 the
  // tank emptied on the last lap of every race and halved everyone's top speed.
  car.fuel=Math.max(0, car.fuel-car.throttle*1.65*dt);
  if(car.damage>=100 && !car.dnf){
    car.dnf=true; car.dnfReason='CRASH DAMAGE';
    car.msg='RETIRED'; car.msgT=3;
    race.msg=car.name+' RETIRES'; race.msgT=2.4;
    SFX.blast();
  }

  // ---- lap / sector timing
  var rel=relIdx(tr,car.idx);
  var s1=Math.floor(N/3), s2=Math.floor(2*N/3);
  var sect = rel<s1?0:(rel<s2?1:2);
  if(sect!==car.sect){
    if(sect===(car.sect+1)%3 && race.phase!=='grid' && race.phase!=='lights'){
      if(sect===1||sect===2||sect===0){
        var st=race.time-car.lapStart;
        var idxS=(sect+2)%3;
        var prevSum=0;
        for(var q2=0;q2<idxS;q2++) prevSum+=car.sectorTimes[q2]||0;
        var stime=st-prevSum;
        if(idxS<2){
          car.sectorTimes[idxS]=stime;
          if(car.bestSectors[idxS]==null||stime<car.bestSectors[idxS]) car.bestSectors[idxS]=stime;
          if(race.bestSector[idxS]==null||stime<race.bestSector[idxS]) race.bestSector[idxS]=stime;
        }
      }
    }
    car.sect=sect;
  }
  // line crossing
  if(car.prevRel>N*0.72 && rel<N*0.28){
    // forward across the start / finish line
    if(race.phase!=='grid' && race.phase!=='lights' && !car.finished){
      completeLap(car,tr,race);
    }
  } else if(car.prevRel<N*0.28 && rel>N*0.72){
    // reversed over the line -> take the lap back, no cheating
    if(car.lap>-1){ car.lap--; car.lapValid=false; if(car.isPlayer){ car.msg='WRONG WAY'; car.msgT=1.4; } }
  }
  car.prevRel=rel;
  car.totalProg=car.lap*N+rel;

  // ---- skid marks / dust / sparks
  if(race.markCount<2600 && spd2>50){
    var markStrength = car.slide*1.0 + (car.brake>0.5&&spd2>200?0.5:0) + (car.hand?0.7:0);
    if(markStrength>0.35 && (surf==='road'||surf==='kerb')){
      var mdx=car.x-car.lastMarkX, mdy=car.y-car.lastMarkY;
      if(mdx*mdx+mdy*mdy>16){
        var wc=tr.world.x;
        wc.save(); wc.translate(-tr.bx,-tr.by);
        wc.fillStyle='rgba(18,18,22,'+clamp(markStrength*0.5,0.08,0.42)+')';
        var pxr=-Math.sin(car.angle), pyr=Math.cos(car.angle);
        wc.fillRect(car.x+pxr*5-1.5|0, car.y+pyr*5-1.5|0, 3,3);
        wc.fillRect(car.x-pxr*5-1.5|0, car.y-pyr*5-1.5|0, 3,3);
        wc.restore();
        car.lastMarkX=car.x; car.lastMarkY=car.y;
        race.markCount++;
        if(car.isPlayer && Math.random()<0.2) SFX.squeal(clamp(markStrength,0.2,1));
      }
    }
    if(surf==='runoff' && Math.random()<dt*34){
      spawnP(car.x,car.y,rnd(-45,45)-car.vx*0.10,rnd(-45,45)-car.vy*0.10,0.55,tr.theme.dust,3,0);
    }
    if(car.slide>0.5 && Math.random()<dt*22 && surf==='road'){
      spawnP(car.x,car.y,rnd(-30,30),rnd(-30,30),0.4,'rgba(210,210,210,0.5)',2,0);
    }
  }
  if(car.boost>0 && Math.random()<dt*44){
    spawnP(car.x-Math.cos(car.angle)*14, car.y-Math.sin(car.angle)*14,
           rnd(-40,40)-Math.cos(car.angle)*90, rnd(-40,40)-Math.sin(car.angle)*90,
           0.4,(Math.random()<0.5?'#ffd23f':'#ff6f3c'),3,0);
  }
  // ---- engine numbers for audio / HUD
  var gearN=6, vRatio=clamp(speed/(VMAXBASE*cs.power),0,1);
  car.gear=Math.max(1,Math.min(gearN,Math.floor(vRatio*gearN)+1));
  var seg=vRatio*gearN-(car.gear-1);
  car.rpm= 2600 + seg*9200 + (car.throttle>0?600:0);
  car.speedKmh=Math.abs(vf)*KMH;
}

function pitDefaultCompound(car){
  if(!hasTwoCompounds(car)){
    if(car.tyre.id!=='M') return 'M';
    return 'S';
  }
  return car.tyre.id==='S'?'M':'S';
}
function cycleCompound(id,dir){
  var i=0;
  for(var k=0;k<COMPOUNDS.length;k++) if(COMPOUNDS[k].id===id) i=k;
  i=(i+dir+COMPOUNDS.length)%COMPOUNDS.length;
  return COMPOUNDS[i].id;
}
function wallImpact(car, tr, ns, race, scale){
  var nxw=tr.nx[car.idx]*ns, nyw=tr.ny[car.idx]*ns;
  var vn=car.vx*nxw+car.vy*nyw;
  car.touchWall=true;
  if(vn<0){
    var mag=-vn;
    car.vx -= 1.45*vn*nxw; car.vy -= 1.45*vn*nyw;
    car.vx*=0.80; car.vy*=0.80;
    car.omega*=0.5;
    if(mag>50){
      car.damage += mag*0.055*scale;
      SFX.thump(clamp(mag/280,0.12,1));
      if(car.isPlayer && race) race.shake=Math.max(race.shake, clamp(mag/34,1,9));
      for(var i=0;i<4;i++) spawnP(car.x,car.y,rnd(-130,130),rnd(-130,130),0.4,(i%2?'#ffd23f':'#fff3b0'),2,0);
      if(mag>190) car.spin=Math.max(car.spin,0.6), car.spinDir=(Math.random()<0.5?-1:1);
    } else if(mag>14){
      SFX.scrape(clamp(mag/90,0.1,0.8));
      if(Math.random()<0.4) spawnP(car.x,car.y,rnd(-60,60),rnd(-60,60),0.28,'#ffd23f',2,0);
    }
  }
}
function recoverCar(car,tr){
  var i=car.idx;
  car.x=tr.lx[i]; car.y=tr.ly[i];
  car.angle=tr.ang[i];
  car.vx=Math.cos(car.angle)*40; car.vy=Math.sin(car.angle)*40;
  car.omega=0; car.spin=0;
  car.msg='RECOVERED'; car.msgT=1.4;
  for(var k=0;k<8;k++) spawnP(car.x,car.y,rnd(-70,70),rnd(-70,70),0.5,'#3fe6ff',2,0);
}
function completeLap(car, tr, race){
  var t=race.time;
  var lapT=t-car.lapStart;
  car.lapStart=t;
  car.lap++;
  // final sector
  var used=(car.sectorTimes[0]||0)+(car.sectorTimes[1]||0);
  var s3=lapT-used;
  if(s3>0 && used>0){
    car.sectorTimes[2]=s3;
    if(car.bestSectors[2]==null||s3<car.bestSectors[2]) car.bestSectors[2]=s3;
    if(race.bestSector[2]==null||s3<race.bestSector[2]) race.bestSector[2]=s3;
  }
  if(car.lap>=1){
    car.lastLap=lapT;
    car.lapTimes.push(lapT);
    if(car.lapValid){
      if(car.bestLap==null||lapT<car.bestLap) car.bestLap=lapT;
      if(race.fastestLap==null||lapT<race.fastestLap){
        race.fastestLap=lapT; race.fastestName=car.name;
        race.msg='FASTEST LAP '+car.ab+' '+fmtShort(lapT); race.msgT=2.2;
        if(car.isPlayer) SFX.best();
      }
      if(car.isPlayer){
        var rec=save.bestLaps[tr.id];
        if(!rec || lapT<rec.time){ save.bestLaps[tr.id]={time:lapT,name:car.name}; writeSave(); }
      }
    }
  }
  car.lapValid=true;
  car.sectorTimes=[null,null,null];
  // finished? (lapped runners take the flag once the leader is home)
  if((car.lap>=race.laps || race.leaderFinished) && !car.finished){
    car.finished=true;
    car.finishTime=t;
    car.finishOrder=++race.finishCount;
    if(!race.leaderFinished){
      race.leaderFinished=true; race.leaderFinishT=0;
      race.phase='chequered'; race.phaseT=0;
      SFX.flag();
      race.msg='CHEQUERED FLAG';  race.msgT=3;
    }
    if(!hasTwoCompounds(car) && !car.dnf){
      car.penalty+=30; car.penMsg='NO COMPOUND CHANGE +30s'; car.penTimer=4;
      if(car.isPlayer) SFX.penalty();
    }
    if(car.isPlayer){ car.msg='FINISH  P'+car.pos; car.msgT=3; }
  }
}
