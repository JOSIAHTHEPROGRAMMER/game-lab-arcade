/* ============================================================
   FLOW / STATE
   ============================================================ */
if(!(game.board instanceof Array))game.board=[];
game.canRetry=false;

function loadLevel(i,demo){
  game.li=i;
  game.lvl=buildLevel(i);
  renderLevelCanvas(game.lvl);
  game.boss=null;game.bossTriggered=false;game.clearing=false;game.clearT=0;
  game.demo=!!demo;
  game.lvlTime=0;
  game.chrono=0;game.slow=0;game.freeze=0;game.flash=0;
  game.shockT=0;game.shockR=0;game.deadT=0;
  ringQ.length=0;
  clearPool(PB);clearPool(EB);clearPool(PT);clearPool(CH);
  cam.lockL=0;cam.lockR=1e9;
  resetPlayer();
  if(demo){cam.x=0;cam.y=Math.max(0,game.lvl.pxH-H-20);}
  else{camUpdate(true);}
}
function startRun(){
  game.lives=0;game.runTime=0;
  loadLevel(0,false);
  game.state='play';game.paused=false;
  toast('DEPTH 1  -  '+LEVELS[0].name);
  sfx('ui');
}
function nextLevel(){
  if(game.li+1>=LEVELS.length){
    finishRun(true);
    return;
  }
  loadLevel(game.li+1,false);
  game.state='play';game.paused=false;
  toast('DEPTH '+(game.li+1)+'  -  '+LEVELS[game.li].name);
}
function retryLevel(){
  loadLevel(game.li,false);
  game.state='play';game.paused=false;
  toast('EXTRA LIFE SPENT  -  RETRY');
}
function recordRun(finished){
  var b=game.best;
  var reached=game.li+1;
  if(reached>b.maxLevel)b.maxLevel=reached;
  if(finished&&(b.runTime<=0||game.runTime<b.runTime))b.runTime=game.runTime;
  store.set('best',b);
  var brd=game.board||[];
  brd.push({t:Math.round(game.runTime*100)/100,l:reached,f:finished?1:0,d:Date.now()});
  brd.sort(function(a,c){
    if(c.f!==a.f)return c.f-a.f;
    if(c.l!==a.l)return c.l-a.l;
    return a.t-c.t;
  });
  if(brd.length>10)brd.length=10;
  game.board=brd;store.set('board',brd);
}
function finishRun(won){
  recordRun(won);
  game.state='victory';game.clearT=0;
  sfx('win');
}
function gameOver(){
  recordRun(false);
  game.state='dead';
}

/* ============================================================
   UPDATE
   ============================================================ */
var holdInput=false;   // set when a frame is skipped by hitstop: keep edge keys buffered
function update(dt){
  holdInput=false;
  game.tick++;
  if(game.msgT>0)game.msgT--;
  if(game.flash>0)game.flash--;
  if(game.transition>0)game.transition--;

  if(game.state==='title'){
    trapsUpdate();
    bulletsUpdate();
    pickupsUpdate();
    partsUpdate();
    camUpdate(false);
    return;
  }
  if(game.state==='play'){
    if(game.freeze>0){game.freeze--;partsUpdate();camUpdate(false);holdInput=true;return;}
    if(game.slow>0){game.slow--;if(game.tick&1){partsUpdate();camUpdate(false);return;}}
    if(game.chrono>0)game.chrono--;

    if(!p.dead&&!game.clearing)game.lvlTime+=STEP,game.runTime+=STEP;

    playerUpdate();
    pickupsUpdate();
    enemiesUpdate();
    trapsUpdate();
    ringQUpdate();
    if(game.boss)bossUpdate();
    bulletsUpdate();
    partsUpdate();

    // boss trigger
    if(!game.bossTriggered&&!game.demo&&p.x>game.lvl.gateX*TS+20)spawnBoss();

    // clearing sequence
    if(game.clearing){
      game.clearT++;
      var b=game.boss;
      if(b){
        if(game.clearT%7===0){
          var ex=b.x+rnd(0,b.w),ey=b.y+rnd(0,b.h);
          spark(ex,ey,10,'#ffd24a',4,26,1);
          ring(ex,ey,10,'#ffffff',2.6,18);
          shake(3.5);sfx('boom');
          for(var c=0;c<3;c++)chunk(ex,ey,rnd(-3,3),rnd(-5,-1),'#39404c',rndi(2,4),rndi(2,4),rnd(50,90));
        }
        if(game.clearT%3===0)part(b.x+rnd(0,b.w),b.y+rnd(0,b.h),rnd(-0.6,0.6),rnd(-2.2,-0.6),rnd(30,60),b.acc,rndi(1,3),-0.01,1);
      }
      if(game.clearT===110){flashScreen('#ffffff',12);shake(10);sfx('win');}
      if(game.clearT>150){
        game.lives++;
        if(game.best.lvlTime[game.li]<=0||game.lvlTime<game.best.lvlTime[game.li]){
          game.best.lvlTime[game.li]=game.lvlTime;
          store.set('best',game.best);
        }
        if(game.li+1>game.best.maxLevel){game.best.maxLevel=game.li+1;store.set('best',game.best);}
        game.state='clear';game.clearT=0;
      }
    }
    // death sequence
    if(p.dead&&!game.clearing){
      if(game.deadT>95){
        if(game.lives>0){game.lives--;game.canRetry=true;game.state='dead';sfx('ui2');}
        else{game.canRetry=false;gameOver();}
      }
    }
    camUpdate(false);
    return;
  }
  if(game.state==='clear'){
    game.clearT++;
    partsUpdate();camUpdate(false);
    if(game.clearT%12===0)spark(rnd(60,W-60)+cam.x,rnd(40,H-60)+cam.y,4,'#ffd24a',2.4,26,1);
    return;
  }
  if(game.state==='dead'||game.state==='victory'){
    game.clearT++;
    partsUpdate();camUpdate(false);
    return;
  }
  if(game.state==='pause'||game.state==='settings'||game.state==='board'){
    return;
  }
}

/* mouse starts parked at the centre of the screen, which sits inside a pause-menu
   row: without the mouse.active gate a keyboard-only player could never move the
   selection, because hover re-snapped it every frame. */
function hoverRect(r){return mouse.active&&mouse.x>=r.x&&mouse.x<=r.x+r.w&&mouse.y>=r.y&&mouse.y<=r.y+r.h;}
function drawGear(cx,cy,r,col){
  g.save();
  g.translate(cx,cy);
  g.fillStyle=col;
  for(var i=0;i<8;i++){
    g.save();g.rotate(i/8*Math.PI*2);
    g.fillRect(-1.6,-r-2.5,3.2,4.5);
    g.restore();
  }
  g.beginPath();g.arc(0,0,r-1,0,6.2832);g.fill();
  g.globalCompositeOperation='destination-out';
  g.beginPath();g.arc(0,0,r-4.5,0,6.2832);g.fill();
  g.globalCompositeOperation='source-over';
  g.restore();
}

function settingsInput(){
  var i;
  if(kp('ArrowDown')||kp('KeyS')){setSel=(setSel+1)%SETROWS.length;sfx('ui');}
  if(kp('ArrowUp')||kp('KeyW')){setSel=(setSel+SETROWS.length-1)%SETROWS.length;sfx('ui');}
  var r=SETROWS[setSel];
  if(r.t==='slider'){
    var d=0;
    if(kd('ArrowLeft')||kd('KeyA'))d=-0.02;
    if(kd('ArrowRight')||kd('KeyD'))d=0.02;
    if(d!==0){settings[r.k]=clamp(settings[r.k]+d,0,1);saveSettings();if(game.tick%8===0)sfx('ui');}
  }
  if(kp('Enter')&&r.t==='back'){closeSettings();}
  if(kp('Escape')){closeSettings();}
  // mouse
  for(i=0;i<SETROWS.length;i++){
    var rc=setRowRect(i);
    if(hoverRect(rc)){
      if(mouse.click||mouse.down){
        setSel=i;
        var rr=SETROWS[i];
        if(rr.t==='slider'){
          var tx=rc.x+150,tw=90;
          settings[rr.k]=clamp((mouse.x-tx)/tw,0,1);saveSettings();
        } else if(mouse.click){closeSettings();}
      }
    }
  }
}

    txt('DEPTH '+(i+1)+'  '+LEVELS[i].name,W/2-140,yy,8,'#a9c0d6');
    var bt=game.best.lvlTime[i];
    txt(bt>0?fmtTime(bt):'--:--.--',W/2+140,yy,8,bt>0?'#5fdcff':'rgba(160,180,205,0.45)','right');
  }
  drawBoardList(68+LEVELS.length*13+10,6);
  txt('ESC / ENTER  -  BACK',W/2,H-32,9,'rgba(180,205,225,0.7)','center');
}

/* ============================================================
   INPUT PER STATE
   ============================================================ */
function stateInput(){
  if(game.state==='title'){
    if(kp('KeyL')){game.state='board';sfx('ui');}
    else if(kp('Escape')||(mouse.click&&hoverRect(gearRect))){openSettings();}
    else if(mouse.click&&hoverRect(boardRect)){game.state='board';sfx('ui');}
    else if(kp('Enter')||kp('Space')||kp('KeyW')||mouse.click){startRun();}
  }
  else if(game.state==='play'){
    if(kp('Escape')||kp('KeyP')){game.state='pause';pauseSel=0;clearKeys();sfx('ui');}
  }
  else if(game.state==='pause')pauseInput();
  else if(game.state==='settings')settingsInput();
  else if(game.state==='board'){
    if(kp('Escape')||kp('Enter')||kp('KeyL')||mouse.click){game.state='title';sfx('ui2');}
  }
  else if(game.state==='clear'){
    if(game.clearT>50&&(kp('Enter')||kp('Space')||mouse.click)){
      if(game.li+1>=LEVELS.length)finishRun(true);
      else nextLevel();
    }
  }
  else if(game.state==='dead'){
    if(kp('Escape')){game.state='title';loadLevel(0,true);sfx('ui2');}
    else if(kp('Enter')||kp('Space')||mouse.click){
      if(game.canRetry)retryLevel();
      else startRun();
    }
  }
  else if(game.state==='victory'){
    if(kp('Enter')||kp('Space')||mouse.click){game.state='title';loadLevel(0,true);sfx('ui2');}
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  g.imageSmoothingEnabled=false;
  drawBG();
  drawTiles();
  drawTorches();
  drawPickups();
  drawTraps();
  drawEnemies();
  if(game.boss)drawBoss();
  if(!game.demo)drawPlayer();
  drawBullets();
  drawParticles();
  drawShock();
  drawFG();
  drawLighting();
  if(game.flash>0){
    g.fillStyle=rgba(hx(game.flashCol),clamp(game.flash/14,0,1)*0.55);
    g.fillRect(0,0,W,H);
  }
  if(game.state==='play'||game.state==='pause')drawHUD();
  if(game.state==='play'&&p.dead)drawDeath();
  if(game.state==='dead')drawDeath();
  if(game.state==='clear')drawClear();
  if(game.state==='victory')drawVictory();
}

function blit(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#04060b';
  ctx.fillRect(0,0,cv.width,cv.height);
  var blurred=(game.state==='title'||game.state==='board'||(game.state==='settings'&&game.prev==='title'));
  var canFilter=(typeof ctx.filter==='string');
  if(blurred&&canFilter)ctx.filter='blur('+(2.2*view.s).toFixed(2)+'px)';
  ctx.drawImage(gg.c,0,0,W,H,view.ox,view.oy,Math.round(W*view.s),Math.round(H*view.s));
  if(canFilter)ctx.filter='none';
  if(blurred){
    ctx.fillStyle='rgba(4,7,12,0.30)';
    ctx.fillRect(view.ox,view.oy,Math.round(W*view.s),Math.round(H*view.s));
  }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
var last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!last)last=ts;
  var dt=(ts-last)/1000;
  last=ts;
  if(!isFinite(dt)||dt<0)dt=0;
  if(dt>0.25)dt=0.25;

  if(document.hidden){acc=0;return;}

  var running=!(game.paused&&game.state==='play');
  if(running){
    acc+=dt;
    var steps=0;
    while(acc>=STEP&&steps<5){
      stateInput();
      update(STEP);
      // edge-triggered keys must survive until AFTER update(): playerUpdate()
      // reads jump / roll / drop / Q / E / R / 1-3 through kp(). holdInput keeps
      // them buffered across hitstop frames, which skip playerUpdate entirely.
      if(!holdInput){
        for(var k in pressed)pressed[k]=false;
        mouse.click=false;
      }
      acc-=STEP;steps++;
    }
    if(steps>=5)acc=0;
    musicTick(dt);
  } else {
    var anyKey=false,k2;
    for(k2 in pressed)if(pressed[k2])anyKey=true;
    if(anyKey||mouse.click){game.paused=false;clearKeys();resumeAudio();}
    for(k2 in pressed)pressed[k2]=false;
    mouse.click=false;
    acc=0;
  }

  render();
  blit();

  // unblurred UI on top of the blurred backdrop
  if(game.state==='title'||game.state==='board'||game.state==='settings'||(game.paused&&game.state==='play')){
    g.clearRect(0,0,W,H);
    if(game.state==='title')drawTitle();
    else if(game.state==='board')drawBoard();
    else if(game.state==='settings')drawSettings();
    else if(game.paused&&game.state==='play'){
      g.fillStyle='rgba(4,7,12,0.6)';g.fillRect(0,0,W,H);
      txt('PAUSED  -  WINDOW LOST FOCUS',W/2,H/2-10,13,'#e9f3ff','center');
      txt('CLICK OR PRESS ANY KEY TO RESUME',W/2,H/2+10,9,'rgba(180,205,225,0.8)','center');
    }
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(gg.c,0,0,W,H,view.ox,view.oy,Math.round(W*view.s),Math.round(H*view.s));
  }
  if(game.state==='pause'){
    g.clearRect(0,0,W,H);
    drawPause();
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(gg.c,0,0,W,H,view.ox,view.oy,Math.round(W*view.s),Math.round(H*view.s));
  }
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  genArt();
  resize();
  loadLevel(0,true);
  game.state='title';
  requestAnimationFrame(frame);
}
boot();

})();
</script>
